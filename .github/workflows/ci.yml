name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build and regressions
    runs-on: macos-latest
    defaults:
      run:
        working-directory: immersive-translator-mac
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Swift package
        run: swift build

      - name: Build Swift package (release)
        run: swift build -c release

      - name: Run Swift tests
        run: swift test

      - name: Run regression checks
        shell: zsh {0}
        run: |
          set -euo pipefail
          for script in scripts/check_*.sh; do
            echo "Running $script"
            zsh "$script"
          done

  windows-frontend:
    name: Windows frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: immersive-translator-windows
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: immersive-translator-windows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

  windows-rust:
    name: Windows Rust tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: immersive-translator-windows/src-tauri
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --locked
