name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build and regressions
    runs-on: macos-latest
    defaults:
      run:
        working-directory: immersive-translator-mac
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Swift package
        run: swift build

      - name: Build Swift package (release)
        run: swift build -c release

      - name: Run Swift tests
        run: swift test

      - name: Run regression checks
        shell: zsh {0}
        run: |
          set -euo pipefail
          for script in scripts/check_*.sh; do
            echo "Running $script"
            zsh "$script"
          done

  windows-frontend:
    name: Windows frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: immersive-translator-windows
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: immersive-translator-windows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

  windows-rust:
    name: Windows Rust tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: immersive-translator-windows/src-tauri
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: immersive-translator-windows/src-tauri
          cache-directories: ~/AppData/Local/ort.pyke.io

      - name: Run Rust tests
        shell: bash
        run: |
          cargo test --locked > cargo-test.log 2>&1
          exit $?

      # 失败时把日志直接从文件 dump 成 annotation（换行折叠为 |），免登录可见
      - name: Report test failure detail
        if: failure()
        shell: bash
        run: |
          if [[ ! -f cargo-test.log ]]; then
            echo "::error::cargo-test.log-missing"
            exit 0
          fi
          echo "::error::ERRLINES|$(grep -n -iE 'error|panic|fatal|failed' cargo-test.log | tail -40 | tr -d '\r' | awk 1 ORS='|')"
          echo "::error::TAIL|$(tail -c 15000 cargo-test.log | tr -d '\r' | awk 1 ORS='|')"
