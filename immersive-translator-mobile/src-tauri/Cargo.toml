[package]
name = "imreader-mobile"
version = "0.1.0"
description = "Immersive reading room, mobile (iOS-first) — M0 spike"
edition = "2021"

# Tauri v2 移动端入口标准布局：lib + 细薄 main
[lib]
name = "imreader_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
futures-util = "0.3"
# 讯飞 WS 三链路（IAT/ISE/TTS）：tokio 定时器竞速 + tungstenite(native-tls，与 reqwest 同 TLS 栈)
tokio = { version = "1", features = ["macros", "sync", "time", "rt"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
# 鉴权/编码：HMAC-SHA256（WS 签名）、MD5（OCR CheckSum）、base64（音频/图像）
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
# iOS Keychain（secret_put/get/delete，service="ita.secrets"）：API Key 只存钥匙串
security-framework = "2"
# 设备能力插件（A2 经官方 JS 包消费）：通知/震动/剪贴板/分享/深链
tauri-plugin-notification = "2"
tauri-plugin-haptics = "2"
tauri-plugin-share = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"

# 桌面专属插件（移动端不编译；与官方模板一致）
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-opener = "2"

# iOS 专属：AVAudioSession 设 playback 类别（否则 WKWebView 音频受静音拨片控制）
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
