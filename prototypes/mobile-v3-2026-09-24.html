<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>沉浸阅读室 · 移动端 v3 定稿原型（静气 · 纸感编辑风）</title>
<style>
/* ============================================================
   移动端 v3 交互原型 —— docs/mobile-v3-design-2026-09-24.md 定稿
   候选 A「静气 · 纸感编辑风」· 单文件无依赖 · 零 webfont · 零渐变
   令牌 = §1.1 / §1.2（每主题显式 rgba，禁 color-mix）
   iOS 16 兼容：无 oklch / 无嵌套 / 无 :has 依赖 / 输入 ≥17px
   呈现约定：手机壳顶格，说明文字在底部一行（§5）
   ============================================================ */

/* ---------- §1.1 色板 · 浅色（暖纸） ---------- */
:root{
  --bg:#FAF8F3;
  --surface:#FFFFFF;
  --surface-2:#F3F0E9;
  --ink:#201D18;
  --ink-2:#565147;
  --ink-3:#736C5F;
  --ink-4:#B4AC9E;
  --hairline:#E7E2D6;
  --hairline-strong:#D8D2C2;
  --accent:#2B567F;
  --accent-soft:rgba(43,86,127,.10);
  --on-ink:#FAF8F3;
  --ok:#3F7050;  --ok-soft:rgba(63,112,80,.10);
  --warn:#96631C; --warn-soft:rgba(150,99,28,.10);
  --err:#AE4A3C; --err-soft:rgba(174,74,60,.10);
  --tb-bg:rgba(250,248,243,.86);
  --shadow-sheet:0 -8px 40px rgba(32,29,24,.14);
  --shadow-pop:0 10px 30px rgba(32,29,24,.16);
}
/* ---------- §1.2 色板 · 深色（暖炭） ---------- */
:root[data-theme="dark"]{
  --bg:#1A1815; --surface:#24211D; --surface-2:#2E2A25;
  --ink:#ECE7DD; --ink-2:#BFB8AA; --ink-3:#938B7C;
  --ink-4:#6B655A;
  --hairline:#35312A; --hairline-strong:#453F36;
  --accent:#8FB3D4; --accent-soft:rgba(143,179,212,.14);
  --on-ink:#1A1815;
  --ok:#85AC90; --ok-soft:rgba(133,172,144,.14);
  --warn:#C9A15C; --warn-soft:rgba(201,161,92,.14);
  --err:#D98376; --err-soft:rgba(217,131,118,.14);
  --tb-bg:rgba(26,24,21,.86);
  --shadow-sheet:0 -8px 40px rgba(0,0,0,.5);
  --shadow-pop:0 10px 30px rgba(0,0,0,.55);
}

/* ---------- §1.4 字体栈 ---------- */
:root{
  --font-serif:ui-serif,"New York","Songti SC","Noto Serif SC",Georgia,serif;
  --font-sans:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(0.32,0.72,0,1);
  /* §1.5 间距 */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
  --sp-6:28px; --sp-7:36px; --sp-8:48px; --sp-9:64px;
  /* §1.6 圆角 */
  --r-xs:5px; --r-s:8px; --r-m:12px; --r-l:16px;
  /* 壳外舞台 */
  --studio:#E9E5DC; --bezel:#101010;
  --shell-shadow:0 30px 80px rgba(32,29,24,.35), 0 6px 20px rgba(32,29,24,.22);
}
:root[data-theme="dark"]{
  --studio:#111010; --bezel:#000;
  --shell-shadow:0 30px 90px rgba(0,0,0,.7);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--studio);
  font-family:var(--font-sans);color:var(--ink);
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;
  overflow:hidden;
}
::selection{background:rgba(43,86,127,.22)}
:root[data-theme="dark"] ::selection{background:rgba(143,179,212,.28)}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;font-size:inherit}
input,textarea{font-family:inherit;color:var(--ink)}
svg{display:block}

/* ---------- 舞台（壳外） ---------- */
.stage{
  flex:1;width:100%;display:flex;flex-direction:column;align-items:center;
  padding-top:24px;min-height:0;
}
.caption{
  flex:none;display:flex;align-items:center;gap:14px;
  padding:12px 24px 14px;font-size:13px;color:var(--ink-2);
}
.caption b{font-weight:600;color:var(--ink);font-family:var(--font-serif);letter-spacing:.01em}
.caption .sep{width:1px;height:12px;background:var(--hairline-strong)}
.caption a{color:var(--accent);cursor:pointer;text-decoration:none;padding:2px 2px}
.caption a.on{font-weight:600;border-bottom:1px solid var(--accent)}
.caption a:not(.on){opacity:.82}
.caption .hint{color:var(--ink-3);font-size:12px}
/* 钩子目录（壳外小抽屉） */
.hooks{position:relative}
.hooks>summary{
  list-style:none;cursor:pointer;color:var(--accent);font-size:13px;
  padding:3px 12px;border:1px solid var(--hairline-strong);border-radius:999px;
}
.hooks>summary::-webkit-details-marker{display:none}
.hooks[open]>summary{background:var(--accent-soft)}
.hooks-pop{
  position:fixed;bottom:56px;right:8px;width:min(460px,calc(100vw - 16px));max-height:min(320px,60vh);overflow:auto;
  background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-l);
  box-shadow:var(--shadow-pop);padding:14px 16px;z-index:99;
}
.hooks-pop .ht{font-family:var(--font-serif);font-size:14px;font-weight:600;margin-bottom:8px}
.hooks-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px}
@media (max-width:560px){.hooks-grid{grid-template-columns:1fr}}
.hooks-grid a{display:flex;gap:8px;align-items:baseline;font-size:12.5px;padding:4px 2px;color:var(--ink-2)}
.hooks-grid a code{color:var(--accent);font-family:var(--font-mono);font-size:11.5px;flex:none;width:104px}
.hooks-grid a:hover{color:var(--ink)}
@media (max-width:560px){
  .caption{gap:10px;padding:10px 12px 12px;font-size:12px;white-space:nowrap}
  .caption .hint,.caption .sep{display:none}
}

/* ---------- iPhone 壳（顶格） ---------- */
.phone{
  flex:none;width:412px;height:866px;
  background:var(--bezel);border-radius:56px;padding:11px;
  box-shadow:var(--shell-shadow);
  transform-origin:top center;
}
.screen{
  position:relative;width:390px;height:844px;border-radius:45px;overflow:hidden;
  background:var(--bg);transition:background-color .16s;
}
.island{
  position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:122px;height:35px;border-radius:20px;background:var(--bezel);z-index:80;
  pointer-events:none;
}
.statusbar{
  position:absolute;top:0;left:0;right:0;height:54px;z-index:75;pointer-events:none;
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:17px 30px 0 34px;color:var(--ink);
}
.sb-time{font-size:16px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.sb-icons{display:flex;align-items:center;gap:7px;padding-top:2px}
.home-indicator{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.9;z-index:76;
  pointer-events:none;
}

/* ---------- 应用布局 ---------- */
.app{position:absolute;inset:0}
.pane{
  position:absolute;top:54px;bottom:82px;left:0;right:0;
  overflow-y:auto;overscroll-behavior:contain;padding:0 20px;
  display:none;scrollbar-width:none;
}
.pane::-webkit-scrollbar{display:none}
.pane.on{display:block;animation:tabin .16s ease-out}
@keyframes tabin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- 通用排版 ---------- */
.h1{font-family:var(--font-serif);font-size:32px;line-height:38px;font-weight:600;letter-spacing:.01em;margin-top:10px}
.overline{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.12em;color:var(--ink-3)}
.meta{font-size:13px;line-height:18px;color:var(--ink-3)}
.meta2{font-size:13px;line-height:18px;color:var(--ink-2)}
.serif{font-family:var(--font-serif)}
.num{font-variant-numeric:lining-nums tabular-nums}
.hr{height:1px;background:var(--hairline);border:0}
.press:active{opacity:.78}
.press-bg:active{background:var(--surface-2)}

/* ---------- 按钮 ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;height:48px;background:var(--ink);color:var(--on-ink);
  border-radius:var(--r-m);font-size:17px;font-weight:600;letter-spacing:.02em;
  transition:opacity .1s;
}
.btn:active{opacity:.78}
.btn-ghost{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;height:48px;background:none;color:var(--ink);
  border-radius:var(--r-m);font-size:17px;font-weight:600;
  transition:opacity .1s;
}
.btn-ghost:active{opacity:.6}
.tlink{color:var(--accent);font-weight:500;cursor:pointer}
.tlink:active{opacity:.7}
.iconbtn{
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;color:var(--ink);flex:none;
}
.iconbtn:active{background:var(--surface-2)}

/* ---------- 分段控件 / 开关 / 徽章 ---------- */
.seg{display:flex;background:var(--surface-2);border-radius:var(--r-m);padding:2px;height:36px}
.seg button{
  flex:1;border-radius:10px;font-size:13px;font-weight:500;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.seg button.on{
  background:var(--surface);color:var(--ink);
  box-shadow:0 1px 3px rgba(32,29,24,.10);border:1px solid var(--hairline);
}
.switch{
  width:50px;height:30px;border-radius:15px;background:var(--hairline-strong);
  position:relative;transition:background .16s;flex:none;
}
.switch i{
  position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;
  background:var(--surface);box-shadow:0 1px 3px rgba(32,29,24,.25);
  transition:transform .16s var(--ease);
}
.switch.on{background:var(--accent)}
.switch.on i{transform:translateX(20px)}
.pos-badge{
  font-size:10px;line-height:16px;font-weight:500;letter-spacing:.06em;
  color:var(--ink-3);background:var(--surface-2);border-radius:var(--r-xs);
  padding:0 6px;flex:none;
}
.warn-chip{
  font-size:11px;font-weight:500;color:var(--warn);background:var(--warn-soft);
  border-radius:999px;padding:2px 9px;flex:none;
}
.dot-due{width:6px;height:6px;border-radius:50%;background:var(--ink);flex:none}

/* ---------- 列表行 ---------- */
.row{
  display:flex;align-items:center;gap:12px;min-height:52px;
  padding:8px 0;border-bottom:1px solid var(--hairline);cursor:pointer;
}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.chev{color:var(--ink-4);flex:none}

/* ---------- 分组列表（我的） ---------- */
.group{margin-top:18px}
.group-t{padding:0 0 6px 0}
.gcard{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-m);overflow:hidden}
.frow{
  display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;
  border-bottom:1px solid var(--hairline);cursor:pointer;font-size:16px;
}
.frow:last-child{border-bottom:0}
.frow:active{background:var(--surface-2)}
.frow .sub{font-size:13px;color:var(--ink-3);margin-top:2px}
.frow .ico{color:var(--ink);flex:none}
.grow{flex:1;min-width:0}

/* ---------- 输入（≥17px 铁律） ---------- */
.input{
  width:100%;min-height:44px;background:var(--surface-2);border:1px solid transparent;
  border-radius:var(--r-s);padding:10px 12px;font-size:17px;line-height:24px;
  outline:none;transition:border-color .12s;
}
.input:focus{border-color:var(--hairline-strong);background:var(--surface)}
textarea.input{resize:none}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:var(--r-s);padding:0 12px;height:44px}
.search svg{color:var(--ink-3);flex:none}
.search input{flex:1;background:none;border:0;outline:none;font-size:17px}

/* ---------- Tab 栏 ---------- */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;height:82px;z-index:30;
  border-top:1px solid var(--hairline);background:var(--tb-bg);
  -webkit-backdrop-filter:saturate(1.4) blur(18px);backdrop-filter:saturate(1.4) blur(18px);
  display:flex;align-items:flex-start;padding:9px 6px 0;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink-3);font-size:10px;line-height:12px;font-weight:500;cursor:pointer;
  transition:color .16s;position:relative;height:48px;justify-content:flex-start;padding-top:2px;
}
.tab.on{color:var(--ink)}
.badge{
  position:absolute;top:-4px;left:50%;margin-left:4px;
  min-width:16px;height:16px;padding:0 4px;border-radius:9px;
  background:var(--accent);color:var(--on-ink);
  font-size:10px;line-height:16px;font-weight:600;text-align:center;
}

/* ---------- push 页 ---------- */
.push-root{position:absolute;inset:0;z-index:40;pointer-events:none}
.push{
  position:absolute;inset:0;background:var(--bg);
  transform:translateX(100%);transition:transform 320ms var(--ease);
  pointer-events:auto;display:flex;flex-direction:column;
}
.push.in{transform:none}
.push.out{transform:translateX(100%)}
.pnav{
  flex:none;height:98px;padding:54px 8px 0;
  display:flex;align-items:center;gap:2px;
}
.pnav .ttl{
  flex:1;text-align:center;font-family:var(--font-serif);font-size:17px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pnav .side{width:76px;display:flex;justify-content:flex-end}
.pnav .side.l{justify-content:flex-start}
.pbody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 20px 40px;scrollbar-width:none}
.pbody::-webkit-scrollbar{display:none}
.pbody.narrow{padding:0 24px}

/* ---------- 底部 sheet ---------- */
.sheet-root{position:absolute;inset:0;z-index:50;pointer-events:none}
.sheet-dim{position:absolute;inset:0;background:rgba(32,29,24,0);transition:background 280ms var(--ease);pointer-events:none}
.sheet-root.on .sheet-dim{background:rgba(32,29,24,.38);pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:76%;
  background:var(--surface);border-radius:var(--r-l) var(--r-l) 0 0;
  box-shadow:var(--shadow-sheet);display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform 280ms var(--ease);
  pointer-events:auto;visibility:hidden;
}
.sheet-root.on .sheet{transform:none;visibility:visible}
.sheet-grab{flex:none;padding:8px 0 2px;display:flex;justify-content:center;cursor:grab;touch-action:none}
.sheet-grab i{width:36px;height:5px;border-radius:3px;background:var(--hairline-strong)}
.sheet-body{overflow-y:auto;padding:4px 20px 28px;scrollbar-width:none}
.sheet-body::-webkit-scrollbar{display:none}

/* ---------- 通知横幅 / toast ---------- */
.banner{
  position:absolute;top:60px;left:12px;right:12px;z-index:60;
  background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-m);
  box-shadow:var(--shadow-pop);padding:12px 14px;
  transform:translateY(-140%);transition:transform 400ms var(--ease);
}
.banner.on{transform:none}
.banner .bt{display:flex;justify-content:space-between;align-items:baseline}
.banner .bx{font-size:12px;color:var(--ink-3)}
.toast{
  position:absolute;left:24px;right:24px;bottom:96px;z-index:70;
  background:var(--ink);color:var(--on-ink);border-radius:var(--r-m);
  padding:12px 16px;font-size:14px;line-height:20px;
  display:flex;align-items:center;gap:14px;justify-content:space-between;
  opacity:0;transform:translateY(8px);transition:opacity 200ms,transform 200ms var(--ease);
  pointer-events:none;overflow:hidden;
}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast .undo{color:var(--accent);font-weight:600;flex:none}
:root[data-theme="dark"] .toast{background:var(--surface);color:var(--ink);border:1px solid var(--hairline-strong)}
.toast .tl{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);width:100%;transform-origin:left}

/* ---------- 今天 ---------- */
.folio{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:10px 0;border-bottom:1px solid var(--hairline);
  font-size:12px;letter-spacing:.05em;color:var(--ink-3);
}
.folio b{font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hero{margin-top:14px}
.hero-row{display:flex;align-items:flex-end;gap:16px;margin-top:4px}
.hero-num{font-family:var(--font-serif);font-size:62px;line-height:1;font-weight:500;letter-spacing:-.01em}
.hero-side{padding-bottom:6px}
.hero-side .s1{font-size:13px;line-height:22px;color:var(--ink-2)}
.hero-side .s2{font-size:13px;line-height:22px;color:var(--ink-3)}
.hero-done{
  display:flex;align-items:center;gap:10px;padding:6px 0 2px;
  font-family:var(--font-serif);font-size:22px;font-weight:600;color:var(--ok);
}
.sec{margin-top:16px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline}
.sec-head .pct{font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--accent);font-variant-numeric:tabular-nums}
.sec-head .when{font-size:12px;color:var(--ink-3)}
.art-title{font-family:var(--font-serif);font-size:20px;line-height:27px;font-weight:600;margin-top:8px;cursor:pointer}
.art-title:active{opacity:.7}
.meter{margin-top:8px;height:2px;background:var(--hairline);border-radius:1px;overflow:hidden}
.meter>i{display:block;height:100%;width:0;background:var(--accent);transition:width 320ms var(--ease)}
.quote{
  margin-top:8px;padding:2px 0 2px 14px;border-left:2px solid var(--ink-3);
  font-family:var(--font-serif);font-style:italic;font-size:16px;line-height:24px;color:var(--ink-2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;
}
.quote:active{opacity:.7}
.quote-actions{margin-top:8px;display:flex;align-items:center;font-size:15px;line-height:20px}
.quote-actions .a{color:var(--accent);font-weight:500;cursor:pointer}
.quote-actions .dot{color:var(--ink-4);margin:0 10px}
.quote-actions .b{color:var(--ink-2);cursor:pointer}
.cliptwo{margin-top:10px;display:flex;align-items:center;gap:10px;padding:10px 0 2px;cursor:pointer;font-size:15px}
.cliptwo:active{opacity:.7}
.cliptwo .t{font-weight:600;color:var(--ink)}
.cliptwo .s{color:var(--ink-3);font-size:13px}
.practice{display:flex;justify-content:space-between;margin-top:12px}
.p-item{display:flex;align-items:center;gap:9px;cursor:pointer;padding:6px 0;margin:-6px 0}
.p-item:active{opacity:.7}
.p-item svg{color:var(--ink);flex:none}
.p-item .t{font-size:14px;font-weight:500;color:var(--ink);line-height:17px}
.p-item .s{font-size:12px;color:var(--ink-3);line-height:15px;margin-top:1px}
.week{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-top:10px}
.w-num{font-family:var(--font-serif);font-size:22px;line-height:28px;font-weight:600;font-variant-numeric:lining-nums}
.w-label{font-size:12px;color:var(--ink-3);margin-top:2px}
.guide{
  margin-top:12px;padding:10px 12px;background:var(--accent-soft);border-radius:var(--r-s);
  font-size:13px;line-height:19px;color:var(--accent);display:flex;gap:8px;align-items:center;cursor:pointer;
}

/* ---------- 练 ---------- */
.prow{
  display:flex;align-items:center;gap:14px;padding:16px 0;cursor:pointer;
  border-bottom:1px solid var(--hairline);
}
.prow:active{opacity:.75}
.prow .ic{width:44px;height:44px;border-radius:var(--r-m);background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.prow .tt{font-family:var(--font-serif);font-size:19px;font-weight:600;line-height:24px}
.prow .dd{font-size:13px;color:var(--ink-3);margin-top:2px}
.recent{display:flex;gap:10px;overflow-x:auto;margin:12px -20px 0;padding:2px 20px 6px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.recent .rc{
  flex:none;width:150px;background:var(--surface);border:1px solid var(--hairline);
  border-radius:var(--r-m);padding:12px 14px;cursor:pointer;
}
.recent .rc:active{background:var(--surface-2)}
.recent .rc .t{font-size:14px;font-weight:600}
.recent .rc .m{font-size:12px;color:var(--ink-3);margin-top:3px}

/* ---------- 书架 ---------- */
.shelf-row{position:relative;overflow:hidden;border-bottom:1px solid var(--hairline)}
.swipe-main{display:block;padding:16px 0;cursor:pointer;touch-action:pan-y;position:relative;z-index:1;transition:transform 200ms var(--ease);background:var(--bg)}
.swipe-main.drag{transition:none}
.swipe-act{
  position:absolute;top:0;right:0;bottom:0;width:76px;
  display:flex;align-items:center;justify-content:center;
  color:var(--err);font-size:15px;font-weight:500;background:var(--err-soft);
}
.pin{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--accent)}
.plus-nav{position:absolute;top:64px;right:20px;z-index:5}

/* ---------- 生词 ---------- */
.seg-line{display:flex;align-items:center;gap:12px;margin-top:14px}
.vrow{position:relative;overflow:hidden;border-bottom:1px solid var(--hairline)}
.vmain{display:flex;align-items:center;gap:12px;padding:13px 0;cursor:pointer;touch-action:pan-y;transition:transform 200ms var(--ease);background:var(--bg);position:relative;z-index:1}
.vmain.drag{transition:none}
.vword{font-family:var(--font-serif);font-size:19px;font-weight:600;line-height:24px;white-space:nowrap}
.vgloss{font-size:13px;color:var(--ink-3);line-height:18px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtime{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);flex:none;font-variant-numeric:tabular-nums}
.ghead{display:flex;justify-content:space-between;align-items:center;padding:16px 0 8px}
.ghead .ok-line{color:var(--ok);font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}

/* ---------- 阅读页 ---------- */
.rd-theme-black{--bg:#000;--surface:#0A0A0B;--surface-2:#141416;--ink:#E8E7E4;--ink-2:#B0AEAB;--ink-3:#77756F;--hairline:#212126;--hairline-strong:#2F2F36}
.rd-prog{height:2px;background:var(--hairline);margin:0 20px}
.rd-prog>i{display:block;height:100%;background:var(--accent);transition:width 200ms}
.rd-body{padding:18px 24px 120px}
.para{margin-bottom:22px;content-visibility:auto;contain-intrinsic-size:auto 220px}
.sent{cursor:pointer;border-radius:4px;transition:background 200ms}
.sent.playing{background:var(--accent-soft)}
.sent-en{font-family:var(--font-serif);font-size:19px;line-height:34px;font-weight:400}
.sent-zh{font-size:14px;line-height:22px;color:var(--ink-3);margin-top:2px;transition:filter 200ms,opacity 200ms}
.rd-hidden-en{display:none}
.reader-mask .sent-zh{filter:blur(6px);opacity:.5}
.reader-mask .sent-zh.reveal,.reader-mask .sent-zh.peek{filter:none;opacity:1}
.tok{border-radius:3px;cursor:pointer}
.tok:active{background:var(--surface-2)}
.tok.ck{border-bottom:2px dotted var(--accent)}
.tok.known{background:var(--accent-soft)}
.pu{cursor:default}
.pu:active{background:none}
.rd-playbar{
  position:absolute;left:0;right:0;bottom:0;z-index:10;
  border-top:1px solid var(--hairline);background:var(--tb-bg);
  -webkit-backdrop-filter:saturate(1.4) blur(18px);backdrop-filter:saturate(1.4) blur(18px);
  padding:10px 14px 30px;display:flex;align-items:center;gap:4px;
}
.rd-playbar .cnt{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding:0 6px;min-width:64px;text-align:center}
.rd-playbar .spacer{flex:1}
.skel{height:14px;border-radius:4px;background:var(--surface-2);margin:10px 0;animation:breathe 1.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}

/* ---------- 复习流 ---------- */
.rv-top{display:flex;align-items:center;justify-content:space-between;padding:58px 14px 0}
.rv-prog{flex:1;margin:0 12px}
.rv-stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px 60px}
.rv-card{animation:cardin 240ms var(--ease)}
@keyframes cardin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rv-word{font-family:var(--font-serif);font-size:28px;line-height:36px;font-weight:600;text-align:center;margin-top:8px}
.rv-pho{text-align:center;font-family:var(--font-mono);font-size:13px;color:var(--ink-3);margin-top:6px}
.rv-sent{font-family:var(--font-serif);font-size:19px;line-height:34px}
.blank{
  display:inline-block;min-width:76px;border-bottom:2px dashed var(--hairline-strong);
  text-align:center;color:var(--ink-2);margin:0 2px;
}
.blank.fill{border-bottom-color:var(--ink);font-weight:600}
.blank.trap{color:var(--warn);border-bottom-color:var(--warn)}
.blank.wrong{color:var(--err);border-bottom-color:var(--err);text-decoration:line-through}
.blank.good{color:var(--ok)}
.verdict{margin-top:14px;font-size:14px;line-height:20px;display:flex;gap:8px;align-items:baseline}
.verdict .v-ok{color:var(--ok);font-weight:600}
.verdict .v-warn{color:var(--warn);font-weight:600}
.verdict .v-err{color:var(--err);font-weight:600}
.trap-note{
  margin-top:12px;padding:10px 12px;background:var(--warn-soft);border-radius:var(--r-s);
  font-size:13px;line-height:19px;color:var(--warn);
}
.grades{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}
.grade{
  min-height:58px;border:1px solid var(--hairline-strong);border-radius:var(--r-m);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--surface);
}
.grade:active{background:var(--surface-2)}
.grade .g1{font-size:15px;font-weight:600}
.grade .g2{font-size:11px;color:var(--ink-3)}
.diffline{font-family:var(--font-serif);font-size:19px;line-height:34px;margin-top:6px}
.diffline .ok{color:var(--ink)}
.diffline .miss{color:var(--warn);border-bottom:2px solid var(--warn)}
.diffline .extra{color:var(--err);text-decoration:line-through;text-decoration-thickness:1px;opacity:.8}
.diff-legend{display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--ink-3)}
.diff-legend i{display:inline-block;width:14px;height:2px;margin-right:5px;vertical-align:middle}
.hintbox{margin-top:12px;padding:10px 12px;background:var(--surface-2);border-radius:var(--r-s);font-size:14px;line-height:20px;color:var(--ink-2)}

/* ---------- 翻译结果 ---------- */
.src-badge{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;letter-spacing:.08em;
  color:var(--ink-3);border:1px solid var(--hairline);border-radius:999px;padding:3px 10px;
}
.tr-src{font-size:15px;line-height:23px;color:var(--ink-2);margin-top:12px;cursor:pointer}
.tr-zh{font-family:var(--font-serif);font-size:19px;line-height:32px;margin-top:14px}
.caret{display:inline-block;width:2px;height:18px;background:var(--accent);vertical-align:-3px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tr-status{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:12px;color:var(--ink-3)}
.tr-status .st{display:flex;align-items:center;gap:5px}
.tr-status .st.on{color:var(--accent);font-weight:500}
.tr-status .st-line{flex:none;width:14px;height:1px;background:var(--hairline-strong)}
.chips{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.chip{
  font-size:13px;font-weight:500;padding:7px 13px;border:1px solid var(--hairline-strong);
  border-radius:999px;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:6px;
}
.chip:active{background:var(--surface-2)}
.tr-bottom{
  position:absolute;left:0;right:0;bottom:0;padding:12px 20px 30px;
  border-top:1px solid var(--hairline);background:var(--tb-bg);
  -webkit-backdrop-filter:saturate(1.4) blur(18px);backdrop-filter:saturate(1.4) blur(18px);
  display:flex;gap:8px;
}
.tr-bottom .tb{
  flex:1;height:44px;border:1px solid var(--hairline-strong);border-radius:var(--r-m);
  display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;
  background:var(--surface);
}
.tr-bottom .tb:active{background:var(--surface-2)}
.tr-bottom .tb.pri{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}

/* ---------- 相机拍译 ---------- */
.cam{position:absolute;inset:0;background:#171512;display:flex;flex-direction:column}
.cam-view{flex:1;position:relative;overflow:hidden}
.cam-scene{position:absolute;inset:0}
.cam-hint{position:absolute;left:0;right:0;top:110px;text-align:center;color:rgba(250,248,243,.85);font-size:13px;letter-spacing:.06em}
.cam-corner{position:absolute;width:26px;height:26px;border:2.5px solid rgba(250,248,243,.9)}
.cam-corner.tl{top:24px;left:24px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.cam-corner.tr{top:24px;right:24px;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.cam-corner.bl{bottom:24px;left:24px;border-right:0;border-top:0;border-radius:0 0 0 6px}
.cam-corner.br{bottom:24px;right:24px;border-left:0;border-top:0;border-radius:0 0 6px 0}
.cam-scan{position:absolute;left:24px;right:24px;height:2px;background:var(--accent);top:20%;opacity:0;box-shadow:0 0 12px rgba(143,179,212,.8)}
.cam-scan.go{animation:scan 1.15s ease-in-out forwards}
@keyframes scan{0%{top:14%;opacity:1}60%{top:78%;opacity:1}100%{top:78%;opacity:0}}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.cam-flash.go{animation:flash 420ms ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.cam-bottom{flex:none;height:150px;display:flex;align-items:center;justify-content:space-between;padding:0 44px 24px}
.cam-album,.cam-flip{width:44px;height:44px;border-radius:50%;background:rgba(250,248,243,.14);display:flex;align-items:center;justify-content:center;color:#FAF8F3}
.cam-shutter{width:70px;height:70px;border-radius:50%;border:4px solid #FAF8F3;display:flex;align-items:center;justify-content:center}
.cam-shutter i{width:54px;height:54px;border-radius:50%;background:#FAF8F3;transition:transform .12s}
.cam-shutter:active i{transform:scale(.86)}
.cam-empty{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 36px;text-align:center;gap:0}
.cam-empty .t{font-family:var(--font-serif);font-size:22px;font-weight:600;margin-top:14px}
.cam-empty .d{font-size:14px;line-height:21px;color:var(--ink-3);margin-top:8px}

/* ---------- 陪练 ---------- */
.scene-row{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--hairline);cursor:pointer}
.scene-row:active{opacity:.75}
.scene-ic{width:44px;height:44px;border-radius:var(--r-m);background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.scene-t{font-family:var(--font-serif);font-size:18px;font-weight:600}
.scene-d{font-size:13px;color:var(--ink-3);margin-top:2px}
.chat-body{flex:1;overflow-y:auto;padding:16px 20px 12px;scrollbar-width:none}
.chat-body::-webkit-scrollbar{display:none}
.bubble{max-width:82%;margin-bottom:14px;animation:cardin 240ms var(--ease)}
.bubble .en{font-family:var(--font-serif);font-size:17px;line-height:26px}
.bubble .zh{font-size:12px;color:var(--ink-3);margin-top:3px}
.bubble .brow{display:flex;align-items:center;gap:8px;margin-top:6px}
.bubble.ai{padding:12px 14px;background:var(--surface);border:1px solid var(--hairline);border-radius:4px var(--r-m) var(--r-m) var(--r-m)}
.bubble.me{margin-left:auto;background:var(--ink);color:var(--on-ink);padding:12px 14px;border-radius:var(--r-m) 4px var(--r-m) var(--r-m)}
.bubble.me .zh{color:var(--ink-3)}
.bubble .spk{color:var(--ink-3);width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.bubble .spk:active{background:var(--surface-2)}
.typing{display:inline-flex;gap:5px;padding:6px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-4);animation:tp 1.1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.chat-foot{flex:none;border-top:1px solid var(--hairline);padding:12px 20px 34px;background:var(--bg)}
.holdbtn{
  width:100%;height:52px;border-radius:var(--r-m);background:var(--ink);color:var(--on-ink);
  font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:9px;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.holdbtn.rec{background:var(--surface-2);color:var(--ink);border:1.5px solid var(--hairline-strong)}
.type-row{display:flex;gap:8px;margin-top:10px}
.type-row .input{flex:1;min-height:44px}
.degrade{
  margin:0 0 12px;padding:10px 12px;background:var(--warn-soft);border-radius:var(--r-s);
  font-size:13px;line-height:19px;color:var(--warn);display:flex;gap:8px;align-items:center;
}
.eq{display:inline-flex;align-items:flex-end;gap:3px;height:22px}
.eq i{width:3.5px;border-radius:2px;background:var(--accent);animation:eq 1s ease-in-out infinite}
.eq i:nth-child(1){height:8px;animation-delay:0s}
.eq i:nth-child(2){height:16px;animation-delay:.15s}
.eq i:nth-child(3){height:22px;animation-delay:.3s}
.eq i:nth-child(4){height:13px;animation-delay:.45s}
.eq i:nth-child(5){height:7px;animation-delay:.6s}
@keyframes eq{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
.eq.static i{animation:none;transform:scaleY(.35)}

/* ---------- 影子跟读 ---------- */
.sh-stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 28px 40px;text-align:center}
.sh-sent{font-family:var(--font-serif);font-size:24px;line-height:38px;font-weight:500}
.sh-state{margin-top:22px;font-size:13px;color:var(--ink-3);display:flex;align-items:center;justify-content:center;gap:8px;min-height:22px}
.sh-words{font-family:var(--font-serif);font-size:22px;line-height:38px;margin-top:4px}
.sh-words .w-ok{color:var(--ink)}
.sh-words .w-err{color:var(--err);border-bottom:2px solid var(--err)}
.sh-words .w-miss{color:var(--ink-4);text-decoration:line-through}
.score-pill{
  display:inline-flex;align-items:baseline;gap:6px;margin:0 auto;
  border:1px solid var(--hairline-strong);border-radius:999px;padding:8px 18px;
}
.score-pill .n{font-family:var(--font-serif);font-size:26px;font-weight:600}
.sh-actions{display:flex;gap:10px;margin-top:26px;justify-content:center}
.sh-actions .sb{
  padding:12px 14px;border-radius:var(--r-m);border:1px solid var(--hairline-strong);
  font-size:14px;font-weight:500;background:var(--surface);display:flex;align-items:center;gap:6px;
  white-space:nowrap;flex:1;justify-content:center;
}
.sh-actions .sb:active{background:var(--surface-2)}
.sh-actions .sb.pri{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.sh-report{
  margin-top:30px;padding:16px;border:1px solid var(--hairline);border-radius:var(--r-m);
  background:var(--surface);text-align:left;
}

/* ---------- 录音直译 ---------- */
.cap-head{padding:8px 0 2px;display:flex;align-items:center;justify-content:space-between}
.cap-levels{display:flex;align-items:flex-end;gap:4px;height:26px}
.cap-levels i{width:5px;background:var(--accent);border-radius:2px;animation:eq 1s ease-in-out infinite}
.cap-levels i:nth-child(1){height:9px;animation-delay:0s}
.cap-levels i:nth-child(2){height:17px;animation-delay:.12s}
.cap-levels i:nth-child(3){height:26px;animation-delay:.24s}
.cap-levels i:nth-child(4){height:14px;animation-delay:.36s}
.cap-levels i:nth-child(5){height:8px;animation-delay:.48s}
.cap-list{padding:14px 0 120px}
.cap-card{padding:13px 0;border-bottom:1px solid var(--hairline);animation:cardin 240ms var(--ease)}
.cap-time{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cap-en{font-family:var(--font-serif);font-size:17px;line-height:26px;margin-top:4px}
.cap-zh{font-size:13px;line-height:20px;color:var(--ink-2);margin-top:3px}
.cap-en.typing-state{color:var(--ink-2)}
.cap-fab{
  position:absolute;left:50%;bottom:44px;transform:translateX(-50%);
  width:72px;height:72px;border-radius:50%;background:var(--ink);color:var(--on-ink);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-pop);
}
.cap-fab:active{opacity:.85}
.cap-empty{padding:80px 36px 0;text-align:center}
.cap-empty .t{font-family:var(--font-serif);font-size:22px;font-weight:600}
.cap-empty .d{font-size:14px;line-height:22px;color:var(--ink-3);margin-top:8px}

/* ---------- 完成摘要 / 笔记 ---------- */
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:18px;border-top:1px solid var(--hairline)}
.sum-cell{padding:16px 4px;border-bottom:1px solid var(--hairline)}
.sum-cell .n{font-family:var(--font-serif);font-size:34px;line-height:40px;font-weight:600}
.sum-cell .l{font-size:12px;color:var(--ink-3);margin-top:2px}
.sum-cell.warn .n{color:var(--warn)}
.sum-cell.err .n{color:var(--err)}
.note-stream{
  margin-top:14px;padding:14px;background:var(--surface);border:1px solid var(--hairline);
  border-radius:var(--r-m);font-size:15px;line-height:25px;min-height:120px;
}
.note-body p{margin-bottom:10px}
.insight{margin-top:12px;padding:12px 14px;background:var(--accent-soft);border-radius:var(--r-m);font-size:13px;line-height:20px;color:var(--accent)}

/* ---------- Onboarding / 分享 ---------- */
.ob-stage{flex:1;display:flex;flex-direction:column;padding:0 28px 44px}
.ob-opt{
  display:flex;align-items:center;gap:12px;padding:16px;border:1px solid var(--hairline-strong);
  border-radius:var(--r-m);margin-top:12px;cursor:pointer;background:var(--surface);
}
.ob-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.ob-opt .t{font-size:16px;font-weight:600}
.ob-opt .d{font-size:13px;color:var(--ink-3);margin-top:2px}
.ob-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--hairline-strong);flex:none;display:flex;align-items:center;justify-content:center;color:var(--surface)}
.ob-opt.on .ob-check{background:var(--accent);border-color:var(--accent)}
.share-card{
  margin:14px 12px 30px;background:var(--surface);border-radius:var(--r-l);
  box-shadow:var(--shadow-pop);overflow:hidden;display:flex;flex-direction:column;
}
.share-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--hairline)}
.share-app{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-weight:600;font-size:17px}
.share-preview{padding:14px 16px;border-bottom:1px solid var(--hairline)}
.share-preview .p{font-family:var(--font-serif);font-size:15px;line-height:24px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.share-act{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--hairline);cursor:pointer}
.share-act:active{background:var(--surface-2)}
.share-act .ic{width:36px;height:36px;border-radius:var(--r-s);background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none}
.share-act .t{font-size:15px;font-weight:600}

/* ---------- 词典卡 ---------- */
.dict-head{display:flex;align-items:flex-start;gap:10px;margin-top:6px}
.dict-word{font-family:var(--font-serif);font-size:28px;line-height:36px;font-weight:600;flex:1}
.dict-pho{font-family:var(--font-mono);font-size:13px;color:var(--ink-3);margin-top:3px}
.sense{margin-top:14px;font-size:16px;line-height:24px}
.sense .pos{color:var(--ink-3);font-style:italic;margin-right:6px;font-size:14px}
.src-card{
  margin-top:16px;padding:11px 13px;background:var(--surface-2);border-radius:var(--r-s);cursor:pointer;
}
.src-card .f{font-size:11px;letter-spacing:.08em;color:var(--ink-3)}
.src-card .q{font-family:var(--font-serif);font-size:15px;line-height:23px;margin-top:3px}
.src-card:active{background:var(--hairline)}
.type-badge{

.aa-row{display:flex;align-items:center;justify-content:space-between;min-height:52px;gap:14px}
.aa-seg{min-width:170px}
.aa-steps{display:flex;align-items:center;gap:14px}
.aa-steps button{width:36px;height:36px;border-radius:50%;border:1px solid var(--hairline-strong);display:flex;align-items:center;justify-content:center;font-size:15px}
.aa-steps button:active{background:var(--surface-2)}
.aa-fs{font-size:17px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.sheet-title{font-family:var(--font-serif);font-size:20px;font-weight:600;margin:4px 0 12px}
.menu-item{display:flex;align-items:center;gap:12px;min-height:50px;font-size:16px;cursor:pointer}
.menu-item:active{opacity:.7}
.menu-item svg{color:var(--ink-2)}

/* ---------- 导入抽屉 ---------- */
.import-tabs{display:flex;gap:2px;margin:2px 0 14px;border-bottom:1px solid var(--hairline)}
.import-tabs button{
  padding:9px 13px;font-size:14px;font-weight:500;color:var(--ink-3);
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.import-tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.lib-hero{display:flex;gap:14px;padding:14px;background:var(--surface-2);border-radius:var(--r-m);cursor:pointer}
.lib-hero:active{opacity:.85}
.lib-hero .t{font-family:var(--font-serif);font-size:18px;font-weight:600;line-height:24px}
.lib-hero .m{font-size:12px;color:var(--ink-3);margin-top:4px}
.exam-chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.exam-chips .chip{font-size:12px;padding:5px 11px}

/* ---------- 导出抽屉 ---------- */
.md-preview{
  font-family:var(--font-mono);font-size:11.5px;line-height:19px;color:var(--ink-2);
  background:var(--surface-2);border-radius:var(--r-s);padding:12px;max-height:180px;overflow:auto;white-space:pre-wrap;
}

/* ---------- 通知横幅内容 ---------- */
.banner .brow2{display:flex;gap:8px;margin-top:10px}
.banner .bbtn{
  height:34px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;

}
.banner .bbtn.later{background:none;color:var(--ink-2);border:1px solid var(--hairline-strong)}
.banner .bico{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}

.qk-top{display:flex;align-items:center;justify-content:space-between;padding:58px 20px 0}
.qk-src{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.qk-stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px 50px}
.qk-done{text-align:center}
.qk-done .big{font-family:var(--font-serif);font-size:30px;line-height:40px;font-weight:600;color:var(--ok)}
.qk-done .sub{font-size:15px;color:var(--ink-2);margin-top:8px}

.statusdot{width:8px;height:8px;border-radius:50%;flex:none}

.statusdot.warn{background:var(--warn)}
.statusdot.err{background:var(--err)}
.mono{font-family:var(--font-mono)}

@media (prefers-reduced-motion: reduce){

/* ---------- toast / 撤销 toast ---------- */
var toastTimer=null;
/* toast 让位：sheet 开着时上移到 sheet 上方，关了复位（offsetHeight 不受 transform 影响，过渡中也是最终高度） */
function toastPos(){
  var el=$("toastEl"),root=$("sheetRoot");
  var sh=root.classList.contains("on")?root.querySelector(".sheet"):null;
  el.style.bottom=sh?(sh.offsetHeight+12)+"px":"";
}
function toast(msg,opts){
  opts=opts||{};
  var el=$("toastEl");
  el.innerHTML='<span>'+esc(msg)+'</span>'+(opts.action?'<button class="undo" data-act="'+opts.act+'">'+esc(opts.action)+'</button>':'')+'<i class="tl" id="toastTl"></i>';
  el.classList.add("on");
  toastPos();
  if(toastTimer)clearTimeout(toastTimer);
  var dur=opts.action?5000:2200;
  var tl=$("toastTl");
  if(tl){tl.style.transition="none";tl.style.transform="scaleX(1)";void tl.offsetWidth;tl.style.transition="transform "+dur+"ms linear";tl.style.transform="scaleX(0)";}
  toastTimer=setTimeout(function(){el.classList.remove("on");},dur);
}
function hideToast(){if(toastTimer)clearTimeout(toastTimer);$("toastEl").classList.remove("on");}

/* sheet 下拉跟手关闭（>120px 释放关闭） */
(function(){
  var sy=0,dy=0,dragging=false,sheet=$("sheetEl");
  $("sheetGrab").addEventListener("pointerdown",function(e){
    if(!S.sheet)return;dragging=true;sy=e.clientY;dy=0;
    sheet.style.transition="none";
    e.preventDefault();
  });
  window.addEventListener("pointermove",function(e){
    if(!dragging)return;
    dy=Math.max(0,e.clientY-sy);
    sheet.style.transform="translateY("+dy+"px)";
  });
  window.addEventListener("pointerup",function(){
    if(!dragging)return;dragging=false;
    sheet.style.transition="";
    sheet.style.transform="";
    if(dy>120)closeSheet();
  });
})();

/* ---------- 阅读页（push） ---------- */
function tokenize(si){
  var s=ARTICLE.sentences[si].en;
  var out=[];
  var chunk=null;
  ARTICLE.chunks.forEach(function(c){if(c.sent===si&&!chunk)chunk=c;});
  var idx=-1;
  if(chunk){
    var m=s.toLowerCase().indexOf(chunk.text.toLowerCase());
    if(m>-1)idx=m;
  }
  var re=/[A-Za-z]+(?:['\u2019][A-Za-z]+)?|[^A-Za-z]+/g;
  var t;
  while((t=re.exec(s))){
    var w=t[0],start=t.index;
    if(idx>-1&&start>=idx&&start<idx+chunk.text.length){
      out.push({w:w,cls:"ck",chunk:chunk});
    }else if(/[A-Za-z]/.test(w)){
      var bare=w.toLowerCase().replace(/[^a-z']/g,"");
      var cls="";
      if(S.reader.chunkMark&&ARTICLE.known.indexOf(bare)>-1)cls="known";
      out.push({w:w,cls:cls,word:bare});
    }else{
      out.push({w:w,cls:"pu pu"});
    }
  }
  return out;
}
function sentHTML(si){
  var toks=tokenize(si);
  var en=toks.map(function(t){
    if(t.cls==="ck")return '<span class="tok ck" data-act="tokChunk" data-chunk="'+esc(t.chunk.word)+'" data-sent="'+si+'">'+esc(t.w)+'</span>';
    if(t.cls==="known")return '<span class="tok known" data-act="tokWord" data-word="'+esc(t.word)+'" data-sent="'+si+'">'+esc(t.w)+'</span>';
    if(t.cls==="pu")return esc(t.w);
    return '<span class="tok" data-act="tokWord" data-word="'+esc(t.word)+'" data-sent="'+si+'">'+esc(t.w)+'</span>';
  }).join("");
  var zhHtml=S.reader.mask
    ?'<div class="sent-zh" data-zh="'+si+'" data-act="revealZh" data-sent="'+si+'">'+esc(ARTICLE.sentences[si].zh)+'</div>'
    :'<div class="sent-zh" data-zh="'+si+'" data-act="tapSent" data-sent="'+si+'">'+esc(ARTICLE.sentences[si].zh)+'</div>';
  var enHtml='<span class="sent-en'+(S.reader.mode==="zh"?" rd-hidden-en":"")+'" data-act="tapSent" data-sent="'+si+'">'+en+'</span>';
  var zhPart=(S.reader.mode==="en")?"":zhHtml;
  return '<div class="sent'+(S.reader.playingIdx===si?" playing":"")+'" data-sent-wrap="'+si+'">'+enHtml+zhPart+'</div>';
}

/* 句级播放：点句=单句朗读，再点=从该句连播 */
var playTimer=null;
function stopPlay(){
  S.reader.playing=false;S.reader.playingIdx=-1;
  if(playTimer){clearTimeout(playTimer);playTimer=null;}
  try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){}
  rerenderReader();
}
function playFrom(i,single){
  stopPlay();
  S.reader.playing=true;S.reader.playingIdx=i;S.reader.sent=i;
  rerenderReader();
  var step=function(){
    if(!S.reader.playing)return;
    var el=topPushEl();
    if(!el||el.dataset.page!=="reader"){stopPlay();return;}
    if(S.reader.playingIdx>=ARTICLE.sentences.length){stopPlay();return;}
    speak(ARTICLE.sentences[S.reader.playingIdx].en,S.reader.rate);
    var dur=(single?2400:2600)/S.reader.rate;
    playTimer=setTimeout(function(){
      if(single){stopPlay();return;}
      S.reader.playingIdx++;
      if(S.reader.playingIdx>=ARTICLE.sentences.length){stopPlay();return;}
      S.reader.sent=S.reader.playingIdx;
      rerenderReader();
      step();
    },dur);
  };
  step();
}
function gotoSent(i){
  var el=topPushEl();
  if(!el)return;
  var w=el.querySelector('[data-sent-wrap="'+i+'"]');
  if(w){w.scrollIntoView({behavior:"smooth",block:"center"});}
  S.reader.sent=Math.max(0,Math.min(i,ARTICLE.sentences.length-1));
  rerenderReader();
}

function rvApplyGrade(g){
  var rv=S.review,c=rv.queue[rv.pos];
  rv.results.push({id:c.id,word:(c.v&&c.v.word)||c.word||"",mode:c.mode,judged:c.judged,grade:g});
  var sug=JUDGE_SUGGEST[c.judged||"wrong"];
  var useG=g||sug;
  /* SRS 待写记录（§6.2 定稿）：评分只挂账，完成时一次性落账；撤销 = 丢弃本卡待写记录。
     开发契约：Rust 侧撤销 = 快照整条 SRS 行回滚，与快速复习同源。 */
  rv.srs=rv.srs||{};
  rv.srs[c.id]={grade:useG,dueNext:SRS_DAYS[useG]};
  S.review.lastGrade={pos:rv.pos};
  toast("已记 · "+GRADE_INTERVALS[useG].label+"后再见",{action:"撤销",act:"rvUndo"});
  if(rv._advTimer)clearTimeout(rv._advTimer);
  rv._advTimer=setTimeout(function(){
    if(rv._undone)return; /* 已撤销：不推进 */
    if(rv.pos>=rv.queue.length-1){
      rv.finished=true;
      Object.keys(rv.srs).forEach(function(id){
        var v=VOCAB.filter(function(x){return x.id===id;})[0];
        if(v)v.due=rv.srs[id].dueNext;
      });
      S.due=0;S.cleared=S.totalDue;S.streak++;
      refreshPush();renderTab("today");renderTabbar();
    }else{
      rv.pos++;
      refreshPush();
    }
  },350);
}

function captionHTML(){

    });
    if(cp.typing){

    }
    h+='</div>';
  }
  h+='</div>';
  if(!cp.rec&&cp.cards.length===0){
    h+='<button class="cap-fab" data-act="capStart" aria-label="开始录音">'+ic("mic",28)+'</button>';
  }else if(!cp.rec&&cp.cards.length>0){
    h+='<button class="cap-fab" data-act="capStart" aria-label="继续录音">'+ic("mic",28)+'</button>';
  }
  return h;

function capSecs(){
  var cp=S.caption;if(!cp)return 0;
  var x=cp.secs||0;
  if(cp.t0)x+=(Date.now()-cp.t0)/1000;
  return Math.round(x);
}
function mmss(x){var m=Math.floor(x/60),ss=x%60;return(m<10?"0":"")+m+":"+(ss<10?"0":"")+ss;}
function capClockStart(){
  var cp=S.caption;if(!cp)return;
  if(cp.clock)clearInterval(cp.clock);
  cp.clock=setInterval(function(){
    var c2=S.caption;if(!c2||!c2.rec)return;
    var el=topPushEl();
    if(el&&el.dataset.page==="caption"){var t=el.querySelector("#capElapsed");if(t)t.textContent=capSecs();}
  },1000);
}
function capStart(){
  var cp=S.caption;
  cp.rec=true;cp.cards=cp.cards||[];
  if(!cp.t0)cp.t0=Date.now();
  capClockStart();
  refreshPush();
  cp.timer=setInterval(function(){
    var cp2=S.caption;
    if(!cp2||!cp2.rec)return;
    cp2.cycle=(cp2.cycle||0)+1;var myCycle=cp2.cycle; /* 令牌：句切换即作废上一轮打字 interval，防僵尸写状态 */
    var idx=cp2.cards.length;
    if(idx<CAPTION_SCRIPT.length){
      if(cp2.partial){
        cp2.cards.push({t:CAPTION_SCRIPT[idx].t,en:CAPTION_SCRIPT[idx].en,zh:CAPTION_SCRIPT[idx].zh});
        cp2.partial="";cp2.typing=false;
        var elx=topPushEl();
        if(elx&&elx.dataset.page==="caption"){var tcx=elx.querySelector("#capTypingCard");if(tcx&&tcx.parentNode)tcx.parentNode.removeChild(tcx);}
      }else{
        cp2.typing=true;cp2.partial="";
        var target=CAPTION_SCRIPT[idx].en;
        var n=0;
        var inner=setInterval(function(){
          var c3=S.caption;if(!c3||!c3.rec||c3.cycle!==myCycle){clearInterval(inner);return;}
          n+=3;c3.partial=target.slice(0,n);
          var el=topPushEl();
          if(el&&el.dataset.page==="caption"){
            /* 打字卡只由 refreshPush 从状态渲染（2204 行），interval 只改文字——直插 DOM 与重渲染竞争会出两张卡 */
            var tx=el.querySelector("#capTypingText");
            if(!tx&&c3.typing){refreshPush();el=topPushEl();tx=el&&el.querySelector("#capTypingText");}
            if(tx)tx.textContent=c3.partial;
            var lb=el.querySelector("#capList");
            if(lb)lb.scrollTop=lb.scrollHeight;
          }
          if(n>=target.length){clearInterval(inner);}
        },70);
      }
      refreshPush();
    }else{
      /* 两句完后续录：停在「正在说」的打字态（V11 实色）——同样只走状态渲染，改完滚到底 */
      if(!cp2.typing){cp2.typing=true;cp2.partial="";}
      cp2.partial+="and then we can ship it ";
      refreshPush();
      var el2=topPushEl();
      if(el2&&el2.dataset.page==="caption"){var l2=el2.querySelector("#capList");if(l2)l2.scrollTop=l2.scrollHeight;}
    }
  },1400);
}
function capStop(){
  var cp=S.caption;
  cp.secs=capSecs();cp.t0=null;
  if(cp.typing&&cp.partial&&cp.partial.trim()){
    cp.cards.push({t:mmss(cp.secs),en:cp.partial.trim(),zh:"…"});
  }
  cp.rec=false;cp.typing=false;cp.partial="";
  if(cp.timer){clearInterval(cp.timer);cp.timer=null;}
  if(cp.clock){clearInterval(cp.clock);cp.clock=null;}
  refreshPush();
  openSheet("export");
}

function noteStreamStart(){
  S.noteDone=false;
  if(S.noteStreamed===undefined||S.noteDoneFull)S.noteStreamed="";
  var full=NOTE_TEXT;
  clearInterval(S.noteIv);
  S.noteIv=setInterval(function(){
    if(S.noteStop)return;
    S.noteStreamed=full.slice(0,S.noteStreamed.length+3);
    if(S.noteStreamed.length>=full.length){S.noteDone=true;clearInterval(S.noteIv);}
    var el=topPushEl();
    if(el&&el.dataset.page==="notes"){
      var box=el.querySelector(".note-stream");
      if(box)box.innerHTML=S.noteDone?("<p>"+esc(NOTE_TEXT)+"</p>"):(esc(S.noteStreamed)+'<span class="caret" style="height:15px"></span>');
      if(S.noteDone){
        box.classList.add("note-body");
        box.insertAdjacentHTML("afterend",'');
        refreshPush();
      }
    }
  },60);
}

/* ---------- 按住说话（document 委托，重渲染不丢事件） ---------- */
var holdStart=0,holding=false,holdValid=false;
document.addEventListener("pointerdown",function(e){
  var h=e.target.closest("[data-hold]");
  if(!h)return;
  e.preventDefault();
  holding=true;holdValid=false;holdStart=Date.now();
  if(S.chat){S.chat.recording=true;refreshPush();}
});
document.addEventListener("pointerup",function(e){
  if(!holding)return;
  holding=false;
  var dur=Date.now()-holdStart;
  if(S.chat&&S.chat.recording){
    S.chat.recording=false;refreshPush();
    if(dur<350){toast("轻点了 · 按住说话，松开结束");}
    else{holdValid=true;processHoldTurn();}
  }
});
document.addEventListener("pointercancel",function(){
  if(!holding)return;
  holding=false;
  if(S.chat&&S.chat.recording){S.chat.recording=false;refreshPush();}
});
function processHoldTurn(){
  var c=S.chat;if(!c)return;
  var nx=c.script[c.idx];
  if(!nx){openSheet("summary");return;}
  if(nx.who==="me"){
    c.idx++;chatAppend(nx);
    var ai=c.script[c.idx];
    if(ai&&ai.who==="ai"){c.idx++;setTimeout(function(){chatAiReplyStep(ai);},420);}
  }else{
    c.idx++;setTimeout(function(){chatAiReplyStep(nx);},200);
  }
  refreshPushAfter();
}

/* ---------- 左滑删除（行内滑动出「删除」） ---------- */
document.addEventListener("pointerdown",function(e){
  var m=e.target.closest(".swipe-main,.vmain");
  if(!m)return;
  if(swipe.open&&swipe.open!==m){closeSwipeRow();}
  swipe.el=m;swipe.startX=e.clientX;swipe.dx=0;swipe.opened=false;
  m.classList.add("drag");
  var startY=e.clientY;
  function move(ev){
    var dx=ev.clientX-swipe.startX;
    var dy=ev.clientY-startY;
    if(Math.abs(dy)>Math.abs(dx)+8){cleanup();return;}
    swipe.dx=Math.max(-88,Math.min(0,dx));
    m.style.transform="translateX("+swipe.dx+"px)";
  }
  function up(){
    cleanup();
    if(swipe.dx<-48){m.style.transform="translateX(-76px)";swipe.open=m;}
    else{m.style.transform="";}
    if(swipe.dx<-10){swipe.suppress=true;setTimeout(function(){swipe.suppress=false;},80);}
  }
  function cleanup(){
    m.classList.remove("drag");
    window.removeEventListener("pointermove",move);
    window.removeEventListener("pointerup",up);
    window.removeEventListener("pointercancel",up);
  }
  window.addEventListener("pointermove",move);
  window.addEventListener("pointerup",up);
  window.addEventListener("pointercancel",up);
});

  "vocab":function(){switchTab("vocab");},
  "shelf":function(){switchTab("shelf");},
  "import":function(){switchTab("shelf");setTimeout(function(){openSheet("import");},260);},
  "me":function(){switchTab("me");},
  "onboarding":function(){openPush("onboarding");},
  "share":function(){openPush("share");}
};
function applyHash(){
  var p;
  try{p=new URLSearchParams(location.hash.slice(1));}catch(e){p=new URLSearchParams();}
  var theme=p.get("theme");
  if(!theme&&p.has("dark"))theme="dark";
  if(!theme&&p.has("light"))theme="light";
  applyTheme(theme==="dark"?"dark":"light");
  resetForDemo();
  var demo=p.get("demo");
  var st=$("capState");
  if(demo&&DEMOS[demo]){DEMOS[demo]();if(st)st.textContent=demo;}
  else{switchTab("today");if(st)st.textContent="今天";}
  fitPhone();
}
window.addEventListener("hashchange",applyHash);
renderTabs();
applyHash();
})();
</script>
