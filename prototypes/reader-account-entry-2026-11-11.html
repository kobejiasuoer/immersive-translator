<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阅读室账号入口 · 交互原型 2026-11-11</title>
<style>
/* =====================================================================
   阅读室账号入口原型。令牌 1:1 取自 styles.css「.reader-root」四主题
   （纸书 / 深色 / 护眼 / 纯黑），顶栏骨架照 reader.css「外壳重构
   2026-10-26」的 .shell-brand / .shell-tabs / .shell-tools。
   .demo 条、日志行、登录窗外框只用于演示，不落地。
   ===================================================================== */
.win {
  --canvas: #F6F3EC; --surface: #FCFAF5; --surface-2: rgba(28,27,24,.045);
  --border: rgba(28,27,24,.09); --border-strong: rgba(28,27,24,.16);
  --ink-1: #171614; --ink-2: #4A4740; --ink-3: #6B665F; --ink-4: #ACA69B;
  --accent: #1f6b57; --accent-hover: #185646; --accent-fg: #fff;
  --accent-soft: #e3f0ea; --accent-softer: #f1f6f2; --accent-line: #b9d8cc;
  --warn: #B45309; --warn-soft: rgba(180,83,9,.11); --err: #B91C1C;
  --shadow-float: 0 6px 16px rgba(23,22,20,.08), 0 1px 2px rgba(23,22,20,.05);
  --shadow-pop: 0 12px 32px rgba(23,22,20,.16);
  --toast-bg: var(--ink-1); --toast-fg: var(--canvas);
}
.win[data-theme="dark"], .win[data-theme="oled"] {
  --canvas: #0E1014; --surface: #171A20; --surface-2: rgba(255,255,255,.05);
  --border: rgba(255,255,255,.09); --border-strong: rgba(255,255,255,.17);
  --ink-1: #F4F2ED; --ink-2: #B9B5AC; --ink-3: #98A69C; --ink-4: #4D4B45;
  --accent: #73c6aa; --accent-hover: #86d3ba; --accent-fg: #112a20;
  --accent-soft: #263d34; --accent-softer: #21332c; --accent-line: #436c5b;
  --warn: #E59A3C; --warn-soft: rgba(229,154,60,.16); --err: #F06868;
  --shadow-float: 0 8px 20px rgba(0,0,0,.4);
  --shadow-pop: 0 14px 36px rgba(0,0,0,.55);
}
.win[data-theme="oled"] { --canvas: #0a0a0b; --surface: #111514; }
.win[data-theme="sepia"] {
  --canvas: #EEF1EF; --surface: #F7F9F8; --surface-2: rgba(20,30,26,.045);
  --border: rgba(20,30,26,.09); --border-strong: rgba(20,30,26,.16);
  --ink-1: #131B18; --ink-2: #3D4A45; --ink-3: #5F6F65; --ink-4: #9CA9A3;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font: 14px/1.6 "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  background: #d6dad7; color: #1f2329;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 12px; overflow: auto;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
.ico { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- 演示控制条（非产品 UI） ---------- */
.demo { width: var(--win-w, 1360px); max-width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 12.5px; color: #3d4540; }
.demo-group { display: inline-flex; align-items: center; gap: 4px; }
.demo-group > b { font-weight: 600; margin-right: 4px; color: #1f2329; }
.demo-group button { padding: 2px 11px; border-radius: 999px; background: #fff; border: 1px solid #c3cac5; font-size: 12px; }
.demo-group button[aria-pressed="true"] { background: #1f2329; color: #fff; border-color: #1f2329; }
.demo-log { width: var(--win-w, 1360px); max-width: 100%; font: 12px/1.5 "Cascadia Code", Consolas, monospace; color: #4a524d; min-height: 18px; }
.demo-log span { color: #1f6b57; }

/* ---------- 窗口外壳 ---------- */
.win {
  width: var(--win-w, 1360px); height: 820px; flex: none;
  background: var(--canvas); color: var(--ink-1);
  border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.18);
  position: relative; display: flex; flex-direction: column; overflow: hidden;
  transition: background-color .25s;
}
.titlebar { height: 30px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 12px; color: var(--ink-3); border-bottom: 1px solid var(--border); }
.titlebar .wc { display: flex; gap: 24px; font-size: 13px; }

/* ---------- 顶栏三段（照 reader.css 9276 段） ---------- */
.topbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 14px 28px 10px; position: relative; z-index: 30; flex: none; }
.seg { display: inline-flex; align-items: center; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; }
.shell-brand { justify-self: start; gap: 10px; padding: 5px 14px 5px 5px; font-weight: 600; }
.shell-tabs { justify-self: center; gap: 2px; padding: 4px; }
.shell-tools { justify-self: end; gap: 6px; padding: 4px 6px; }
.monogram { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font: italic 17px/1 "Instrument Serif", "Source Serif 4", Georgia, serif; display: grid; place-items: center; }
.folio { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; padding: 3px 6px; border-radius: 99px; }
.folio:hover { background: var(--border); }
.folio .caret { opacity: .45; font-size: 10px; }
.tab { height: 32px; padding: 0 14px; border-radius: 999px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px; }
.tab:hover { color: var(--ink-1); }
.tab[aria-current="page"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.tab .count { font: 600 10.5px/1.4 "Cascadia Code", Consolas, monospace; padding: 1px 6px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.ghost { height: 28px; padding: 0 10px; border-radius: 99px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 5px; }
.ghost:hover, .ghost[aria-expanded="true"] { background: var(--border); color: var(--ink-1); }
.theme-trigger { height: 28px; padding: 0 8px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; border: 1px solid transparent; }
.theme-trigger:hover { background: var(--accent-softer); border-color: var(--border); }
.theme-trigger .lbl { color: var(--ink-3); }
.theme-trigger .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--border-strong); }
.theme-trigger .ico { width: 12px; height: 12px; color: var(--ink-3); }
.tools-sep { width: 1px; height: 16px; background: var(--border-strong); margin: 0 2px; }

/* ---------- 新增：账号入口 ---------- */
.acct { position: relative; display: inline-flex; }
.acct-trigger { height: 28px; display: inline-flex; align-items: center; gap: 5px; border-radius: 8px; font-size: 12px; font-weight: 600; transition: background .15s, box-shadow .15s; }
.acct-trigger.is-guest { padding: 0 8px 0 9px; background: var(--accent-soft); color: var(--accent); }
.acct-trigger.is-guest:hover, .acct-trigger.is-guest[aria-expanded="true"] { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); }
.acct-trigger.is-guest .chev { width: 11px; height: 11px; opacity: .7; }
.acct-trigger.is-guest.is-expired { background: var(--warn-soft); color: var(--warn); }
.acct-trigger.is-guest.is-expired:hover, .acct-trigger.is-guest.is-expired[aria-expanded="true"] { background: color-mix(in srgb, var(--warn) 20%, var(--surface)); }
.acct-trigger.is-member { width: 28px; padding: 0; justify-content: center; border-radius: 50%; }
.acct-trigger.is-member:hover, .acct-trigger.is-member[aria-expanded="true"] { box-shadow: 0 0 0 3px var(--accent-soft); }
.avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); font: 600 12.5px/1 "Segoe UI", sans-serif; flex: none; }
.avatar.lg { width: 38px; height: 38px; font-size: 16px; }
.acct-head.expired h3 { display: flex; align-items: center; gap: 6px; color: var(--warn); }
.acct-head.expired h3 .ico { width: 16px; height: 16px; }
.avatar-arrive { animation: arrive .42s cubic-bezier(.16,1,.3,1); }
@keyframes arrive { from { transform: scale(.55); box-shadow: 0 0 0 0 var(--accent-soft); } 60% { box-shadow: 0 0 0 7px var(--accent-soft); } to { transform: scale(1); box-shadow: 0 0 0 0 transparent; } }

/* 账号菜单（几何照 .reader-theme-menu：12px 圆角、强描边、浮层阴影） */
.menu { position: absolute; top: calc(100% + 10px); right: -6px; width: 292px; padding: 6px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; box-shadow: var(--shadow-float); z-index: 40; animation: pop .14s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.acct-head { padding: 10px 10px 12px; }
.acct-head.guest h3 { font-size: 14px; font-weight: 600; }
.acct-head.guest p { margin-top: 4px; font-size: 12.5px; line-height: 1.6; color: var(--ink-2); }
.acct-head.guest small { display: block; margin-top: 8px; font-size: 11.5px; color: var(--ink-3); text-align: center; }
.acct-id { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 11px; align-items: center; }
.acct-id .name { display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; }
.acct-id .mail { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plan { font-size: 10.5px; font-weight: 600; padding: 0 6px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 16px; border-radius: 8px; font-size: 13px; font-weight: 600; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink-1); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { background: var(--err); border-color: var(--err); color: #fff; }
.btn.sm { height: 28px; padding: 0 12px; font-size: 12.5px; }
.btn.block { width: 100%; margin-top: 12px; }
.menu-sep { height: 1px; background: var(--border); margin: 5px 4px; }
.mi { width: 100%; display: grid; grid-template-columns: 18px minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; font-size: 13px; text-align: left; color: var(--ink-1); }
.mi:hover, .mi:focus-visible { background: var(--surface-2); outline: none; }
.mi .ico { color: var(--ink-3); }
.mi .hint { font-size: 11.5px; color: var(--ink-3); }
.mi kbd { font: 11px/1.5 "Segoe UI", sans-serif; color: var(--ink-3); padding: 0 5px; border: 1px solid var(--border-strong); border-radius: 4px; }
.mi .due { font: 600 10.5px/1.4 "Cascadia Code", Consolas, monospace; padding: 1px 6px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.mi.quiet { color: var(--ink-2); }
.confirm { padding: 12px 10px 8px; }
.confirm h3 { font-size: 14px; font-weight: 600; }
.confirm p { margin-top: 6px; font-size: 12.5px; line-height: 1.65; color: var(--ink-2); }
.confirm .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

/* ---------- 书架页（简化） ---------- */
.body { flex: 1; min-height: 0; overflow: auto; }
.shelf { max-width: 1080px; margin: 0 auto; padding: 18px 28px 48px; }
.shelf h2 { font-size: 22px; font-weight: 700; letter-spacing: .01em; }
.sync-tip { display: grid; grid-template-columns: auto minmax(0,1fr) auto auto; align-items: center; gap: 12px; margin-top: 14px; padding: 10px 10px 10px 14px; border: 1px solid var(--accent-line); border-radius: 12px; background: var(--accent-softer); animation: pop .2s ease-out; }
.sync-tip > .ico { width: 18px; height: 18px; color: var(--accent); }
.sync-tip p { font-size: 13px; color: var(--ink-2); }
.sync-tip p b { color: var(--ink-1); font-weight: 600; }
.icon-x { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-3); }
.icon-x:hover { background: var(--surface-2); color: var(--ink-1); }
.topgrid { display: grid; grid-template-columns: 1fr 1fr 300px; gap: 16px; margin-top: 18px; }
.bookcard { display: flex; gap: 16px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; }
.cover { width: 104px; height: 146px; flex: none; border-radius: 8px; padding: 12px 11px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; font: 15px/1.25 "Source Serif 4", Georgia, serif; }
.cover small { font: 10.5px "Segoe UI", sans-serif; opacity: .8; }
.cover.a { background: #1f6b57; } .cover.b { background: #3c4a7a; }
.bookmeta { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.bookmeta b { font: 600 16px/1.35 "Source Serif 4", Georgia, serif; }
.bookmeta span { font-size: 12.5px; color: var(--ink-3); }
.bar { margin-top: auto; height: 4px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.stats { display: grid; gap: 12px; }
.stat { padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; }
.stat h4 { font-size: 12px; font-weight: 500; color: var(--ink-3); }
.stat b { display: block; margin-top: 2px; font-size: 15px; }
.stat .btn { margin-top: 10px; }

/* ---------- 阅读设置抽屉（简化）+ 底部新增入口 ---------- */
.drawer { position: absolute; top: 30px; right: 0; bottom: 0; width: 380px; background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow-pop); z-index: 50; display: flex; flex-direction: column; animation: slide .18s ease-out; }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 600; }
.drawer .rows { flex: 1; overflow: auto; padding: 6px 16px; }
.drawer .r { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.drawer .r span:last-child { color: var(--ink-3); font-size: 12.5px; }
.drawer .sec { margin-top: 14px; font-size: 12px; color: var(--ink-3); }
.drawer-foot { padding: 14px 16px; border-top: 1px solid var(--border); background: var(--surface-2); display: flex; align-items: center; gap: 12px; }
.drawer-foot p { flex: 1; font-size: 12px; line-height: 1.55; color: var(--ink-2); }

/* ---------- 现有登录窗（示意外框，不改动） ---------- */
.login-win { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); width: 400px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: 0 24px 60px rgba(0,0,0,.28); z-index: 60; overflow: hidden; animation: pop .16s ease-out; }
.login-win .tb { height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 14px; font-size: 12px; color: var(--ink-3); border-bottom: 1px solid var(--border); }
.login-win .tb em { font-style: normal; font-size: 11px; padding: 0 6px; border-radius: 4px; background: #fff3c4; color: #6b5200; }
.login-win .in { padding: 22px 26px 26px; }
.login-win h3 { font-size: 17px; }
.login-win .sub { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.login-win label { display: block; margin-top: 18px; font-size: 12px; color: var(--ink-2); }
.login-win input { width: 100%; height: 36px; margin-top: 6px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--canvas); color: var(--ink-1); font: 14px "Segoe UI", sans-serif; letter-spacing: .02em; }
.login-win .btn { width: 100%; margin-top: 18px; height: 36px; }

/* ---------- 提示条（照 .reader-root .toast） ---------- */
.toast { position: absolute; top: 74px; left: 50%; transform: translateX(-50%); padding: 8px 16px; border-radius: 10px; background: var(--toast-bg); color: var(--toast-fg); font-size: 13px; z-index: 70; box-shadow: var(--shadow-pop); animation: pop .16s ease-out; white-space: nowrap; }

/* ---------- 焦点与窄窗 ---------- */
.win button:focus-visible, .win input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.win[data-narrow] .theme-trigger .lbl { display: none; }
.win[data-narrow] .folio .name { display: none; }
.win[data-narrow] .topgrid { grid-template-columns: 1fr 1fr; }
.win[data-narrow] .stats { grid-column: 1 / -1; grid-template-columns: 1fr 1fr; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="demo" role="toolbar" aria-label="演示控制（非产品界面）">
  <div class="demo-group"><b>账号状态</b>
    <button data-auth="guest">未登录</button><button data-auth="member">已登录</button><button data-auth="expired">登录失效</button>
  </div>
  <div class="demo-group"><b>主题</b>
    <button data-theme-set="light">纸书</button><button data-theme-set="dark">深色</button><button data-theme-set="sepia">护眼</button><button data-theme-set="oled">纯黑</button>
  </div>
  <div class="demo-group"><b>窗宽</b>
    <button data-w="1360">1360</button><button data-w="1000">1000</button>
  </div>
  <div class="demo-group"><button id="demo-reset">恢复书架提示</button></div>
</div>
<div class="demo-log" id="log" aria-live="polite">点右上角的「登录」或头像试试；也可以打开齿轮里的阅读设置看底部入口。</div>

<div class="win" id="win" data-theme="light">
  <div class="titlebar"><span>沉浸口语 · 阅读室</span><span class="wc" aria-hidden="true"><span>—</span><span>☐</span><span>✕</span></span></div>

  <header class="topbar">
    <div class="seg shell-brand">
      <button class="monogram" title="回到书架" aria-label="回到书架">I</button>
      <button class="folio" aria-haspopup="dialog"><svg class="ico" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg><span>书架</span><span class="caret" aria-hidden="true">▾</span></button>
    </div>
    <nav class="seg shell-tabs" aria-label="主导航">
      <button class="tab" aria-current="page"><svg class="ico" viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg>阅读</button>
      <button class="tab"><svg class="ico" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>口语</button>
      <button class="tab"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>笔记与复习<span class="count">3</span></button>
    </nav>
    <div class="seg shell-tools">
      <button class="ghost" aria-label="全文检索" title="全文检索"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="theme-trigger" id="theme-trigger" aria-label="阅读主题"><span class="lbl">主题</span><span class="dot" id="theme-dot"></span><span class="name" id="theme-name">纸书</span><svg class="ico" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="ghost" id="gear" aria-label="阅读设置" title="阅读设置" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      <span class="tools-sep" aria-hidden="true"></span>
      <div class="acct" id="acct"></div>
    </div>
  </header>

  <div class="body">
    <div class="shelf">
      <h2>书架</h2>
      <div id="tip-slot"></div>
      <div class="topgrid">
        <div class="bookcard">
          <div class="cover a"><span>Pride and Prejudice</span><small>Jane Austen</small></div>
          <div class="bookmeta"><b>Pride and Prejudice</b><span>读到第 12 章，共 61 章</span><span>B2 · 约 3 小时读完</span><div class="bar"><i style="width:42%"></i></div></div>
        </div>
        <div class="bookcard">
          <div class="cover b"><span>The Old Man and the Sea</span><small>Ernest Hemingway</small></div>
          <div class="bookmeta"><b>The Old Man and the Sea</b><span>读到第 1 节，共 8 节</span><span>B1 · 约 2 小时读完</span><div class="bar"><i style="width:8%"></i></div></div>
        </div>
        <div class="stats">
          <div class="stat"><h4>今日阅读</h4><b>12 / 20 分钟</b></div>
          <div class="stat"><h4>今日复习</h4><b>3 张到期</b><button class="btn sm primary">开始复习</button></div>
        </div>
      </div>
    </div>
  </div>

  <div id="drawer-slot"></div>
  <div id="login-slot"></div>
  <div id="toast-slot"></div>
</div>

<script>
(() => {
  const USER = { email: "yang@example.com", nickname: null, plan: "FREE" };
  const THEMES = { light: ["纸书", "#F6F3EC"], dark: ["深色", "#0E1014"], sepia: ["护眼", "#EEF1EF"], oled: ["纯黑", "#0a0a0b"] };
  const q = new URLSearchParams(location.search);
  const TIP_KEY = "proto-acct-tip-dismissed";
  const S = {
    auth: q.get("auth") || "guest",
    theme: q.get("theme") || "light",
    w: q.get("w") || "1360",
    menu: q.get("menu") === "1",
    confirm: q.get("confirm") === "1",
    drawer: q.get("drawer") === "1",
    login: q.get("login") || null,
    tipDismissed: q.has("tip") ? q.get("tip") === "0" : localStorage.getItem(TIP_KEY) === "1",
    arrive: false,
  };

  const $ = (sel, el = document) => el.querySelector(sel);
  const win = $("#win");
  const I = {
    user: '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
    chev: '<svg class="ico chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
    card: '<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M15 9h3M15 13h3M6 16a3 3 0 0 1 6 0"/></svg>',
    gear: '<svg class="ico" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
    hist: '<svg class="ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>',
    scan: '<svg class="ico" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/></svg>',
    cc: '<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h4M15 15h2M7 11h2M13 11h4"/></svg>',
    cards: '<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>',
    out: '<svg class="ico" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>',
    cloud: '<svg class="ico" viewBox="0 0 24 24"><path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 0 0 4.5 13 3 3 0 0 0 6 19z"/></svg>',
    x: '<svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    alert: '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>',
  };
  const initial = () => (USER.nickname || USER.email).trim().charAt(0).toUpperCase();
  const displayName = () => USER.nickname || USER.email.split("@")[0];

  function log(call, note) {
    $("#log").innerHTML = `调用 <span>${call}</span>${note ? "　" + note : ""}`;
  }
  let toastTimer = 0;
  function toast(text) {
    $("#toast-slot").innerHTML = `<div class="toast" role="status">${text}</div>`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("#toast-slot").innerHTML = ""; }, 2600);
  }

  // ---------- 账号入口 ----------
  function triggerHtml() {
    const exp = S.menu ? "true" : "false";
    const common = `id="acct-btn" aria-haspopup="menu" aria-expanded="${exp}" aria-controls="acct-menu"`;
    if (S.auth === "guest") {
      return `<button class="acct-trigger is-guest" ${common} title="登录、设置与工具">${I.user}<span>登录</span>${I.chev}</button>`;
    }
    // 失效时 Rust 返回 { loggedIn: false, user: null, notice }：拿不到邮箱，只能给「重新登录」。
    if (S.auth === "expired") {
      return `<button class="acct-trigger is-guest is-expired" ${common} title="登录已失效">${I.alert}<span>重新登录</span>${I.chev}</button>`;
    }
    return `<button class="acct-trigger is-member" ${common} aria-label="账号：${USER.email}" title="${USER.email}">
      <span class="avatar${S.arrive ? " avatar-arrive" : ""}">${initial()}</span></button>`;
  }

  function headHtml() {
    if (S.auth === "guest") {
      return `<div class="acct-head guest">
        <h3>登录沉浸云</h3>
        <p>生词本、阅读进度和口语记录跨设备同步，还能用云端口语评分和朗读。</p>
        <button class="btn primary block" role="menuitem" data-act="login">登录 / 注册</button>
        <small>不登录也能使用全部本地功能</small>
      </div>`;
    }
    if (S.auth === "expired") {
      return `<div class="acct-head guest expired">
        <h3>${I.alert}登录已失效</h3>
        <p>书架已切回这台电脑上未登录时的内容。重新登录后回到账号书架，这期间在本机新增的内容会并入账号。</p>
        <button class="btn primary block" role="menuitem" data-act="login">重新登录</button>
      </div>`;
    }
    return `<div class="acct-head">
      <div class="acct-id"><span class="avatar lg">${initial()}</span>
        <div style="min-width:0"><div class="name">${displayName()}<span class="plan">${USER.plan}</span></div><div class="mail">${USER.email}</div></div>
      </div>
    </div>`;
  }

  const mi = (act, icon, label, right = "", cls = "") =>
    `<button class="mi ${cls}" role="menuitem" data-act="${act}">${icon}<span>${label}</span>${right}</button>`;

  function menuHtml() {
    if (S.confirm) {
      return `<div class="menu" id="acct-menu" role="dialog" aria-modal="false" aria-labelledby="confirm-t">
        <div class="confirm">
          <h3 id="confirm-t">退出登录？</h3>
          <p>退出后，阅读室会切回这台电脑上未登录时的书架。账号里的书、生词和笔记不会删除，重新登录即可回来。</p>
          <div class="row"><button class="btn sm" data-act="cancel-logout">取消</button><button class="btn sm danger" data-act="do-logout">退出登录</button></div>
        </div></div>`;
    }
    const member = S.auth === "member";
    return `<div class="menu" id="acct-menu" role="menu" aria-label="账号与应用">
      ${headHtml()}
      <div class="menu-sep"></div>
      ${member ? mi("account", I.card, "账号与额度", '<span class="hint">兑换码</span>') : ""}
      ${mi("settings", I.gear, "设置", '<span class="hint">模型、语音、快捷键</span>')}
      ${mi("history", I.hist, "翻译历史")}
      <div class="menu-sep"></div>
      ${mi("ocr", I.scan, "截图翻译", "<kbd>Ctrl+Shift+E</kbd>")}
      ${mi("live", I.cc, "录音直译")}
      ${mi("quick", I.cards, "快速复习", '<span class="due">3</span>')}
      ${member ? `<div class="menu-sep"></div>${mi("logout", I.out, "退出登录", "", "quiet")}` : ""}
    </div>`;
  }

  function renderAcct(focus) {
    $("#acct").innerHTML = triggerHtml() + (S.menu ? menuHtml() : "");
    S.arrive = false;
    if (focus === "first") $("#acct-menu [role=menuitem], #acct-menu button")?.focus();
    if (focus === "trigger") $("#acct-btn").focus();
  }

  function openMenu(byKeyboard) { S.menu = true; S.confirm = false; renderAcct(byKeyboard ? "first" : null); }
  function closeMenu(returnFocus) { if (!S.menu) return; S.menu = false; S.confirm = false; renderAcct(returnFocus ? "trigger" : null); }

  const ACTIONS = {
    login() { closeMenu(); openLogin(); log("openLoginWindow()", "打开现有登录窗，不改动"); },
    account() { closeMenu(); log('settingsOpenTab("account")', "设置窗定位到「账号」页"); toast("已打开设置 · 账号"); },
    settings() { closeMenu(); log("openSettings()", "打开现有设置窗"); toast("已打开设置"); },
    history() { closeMenu(); log("openHistory()"); toast("已打开翻译历史"); },
    ocr() { closeMenu(); log("openOcrOverlay()", "与 Ctrl+Shift+E 同一路径"); toast("进入截图框选"); },
    live() { closeMenu(); log('invoke("open_live_caption")', "需新增命令：现在只有托盘能打开录音直译"); toast("已打开录音直译"); },
    quick() { closeMenu(); log('invoke("open_quick_review")'); toast("已打开快速复习"); },
    logout() { S.confirm = true; renderAcct(); $("#acct-menu [data-act=cancel-logout]").focus(); },
    "cancel-logout"() { S.confirm = false; renderAcct("first"); },
    "do-logout"() { S.auth = "guest"; closeMenu(true); renderAll(); log("authLogout()", "auth-state-changed 广播后阅读室自动切回游客书架"); toast("已退出登录，当前是本机书架"); },
  };

  $("#acct").addEventListener("click", (e) => {
    const act = e.target.closest("[data-act]");
    if (act) { ACTIONS[act.dataset.act]?.(); return; }
    if (e.target.closest("#acct-btn")) S.menu ? closeMenu() : openMenu(e.detail === 0);
  });

  $("#acct").addEventListener("keydown", (e) => {
    if (e.key === "Escape" && S.menu) { e.preventDefault(); closeMenu(true); return; }
    if (e.target.id === "acct-btn" && (e.key === "ArrowDown" || e.key === "Enter" || e.key === " ")) {
      if (!S.menu) { e.preventDefault(); openMenu(true); }
      return;
    }
    if (!S.menu || S.confirm) return;
    const items = [...document.querySelectorAll("#acct-menu [role=menuitem]")];
    const i = items.indexOf(document.activeElement);
    let next = -1;
    if (e.key === "ArrowDown") next = (i + 1) % items.length;
    else if (e.key === "ArrowUp") next = (i - 1 + items.length) % items.length;
    else if (e.key === "Home") next = 0;
    else if (e.key === "End") next = items.length - 1;
    else if (e.key === "Tab") { closeMenu(); return; }
    if (next >= 0) { e.preventDefault(); items[next].focus(); }
  });

  document.addEventListener("pointerdown", (e) => { if (S.menu && !e.target.closest("#acct")) closeMenu(); });

  // ---------- 书架首访提示 ----------
  function renderTip() {
    const show = S.auth === "guest" && !S.tipDismissed;
    $("#tip-slot").innerHTML = show ? `<div class="sync-tip" role="note">
      ${I.cloud}
      <p><b>生词和阅读进度目前只保存在这台电脑上。</b>登录后自动同步，换台设备也能接着学。</p>
      <button class="btn sm primary" data-tip="login">登录</button>
      <button class="icon-x" data-tip="dismiss" aria-label="不再提示" title="不再提示">${I.x}</button>
    </div>` : "";
  }
  $("#tip-slot").addEventListener("click", (e) => {
    const t = e.target.closest("[data-tip]");
    if (!t) return;
    if (t.dataset.tip === "login") { openLogin(); log("openLoginWindow()", "书架提示条入口"); }
    else { S.tipDismissed = true; localStorage.setItem(TIP_KEY, "1"); renderTip(); log("localStorage.setItem(…)", "关掉即永久不再出现；账号菜单里始终能登录"); }
  });

  // ---------- 阅读设置抽屉（底部新增「设置」入口） ----------
  function renderDrawer() {
    $("#gear").setAttribute("aria-expanded", S.drawer ? "true" : "false");
    $("#drawer-slot").innerHTML = S.drawer ? `<aside class="drawer" role="dialog" aria-label="阅读设置">
      <header><span>阅读设置</span><button class="icon-x" data-dr="close" aria-label="关闭阅读设置">${I.x}</button></header>
      <div class="rows">
        <div class="sec">显示</div>
        <div class="r"><span>译文遮罩</span><span>关闭</span></div>
        <div class="r"><span>字号</span><span>19</span></div>
        <div class="r"><span>行距</span><span>标准</span></div>
        <div class="r"><span>正文字体</span><span>衬线</span></div>
        <div class="sec">朗读</div>
        <div class="r"><span>朗读引擎</span><span>Edge 云音色</span></div>
        <div class="r"><span>语速</span><span>1.0×</span></div>
        <div class="r"><span>跟读评测</span><span>开启</span></div>
      </div>
      <footer class="drawer-foot">
        <p>模型服务、语音、快捷键和账号在「设置」里调整。</p>
        <button class="btn sm" data-dr="settings">打开设置</button>
      </footer>
    </aside>` : "";
  }
  $("#gear").addEventListener("click", () => { S.drawer = !S.drawer; renderDrawer(); });
  $("#drawer-slot").addEventListener("click", (e) => {
    const b = e.target.closest("[data-dr]");
    if (!b) return;
    if (b.dataset.dr === "close") { S.drawer = false; renderDrawer(); $("#gear").focus(); }
    else { log("openSettings()", "阅读设置抽屉底部入口"); toast("已打开设置"); }
  });

  // ---------- 现有登录窗（示意） ----------
  function openLogin() { S.login = "email"; renderLogin(); $("#login-slot input")?.focus(); }
  function renderLogin() {
    if (!S.login) { $("#login-slot").innerHTML = ""; return; }
    const code = S.login === "code";
    $("#login-slot").innerHTML = `<div class="login-win" role="dialog" aria-label="账号登录">
      <div class="tb"><span>账号登录 <em>现有登录窗 · 示意</em></span><button class="icon-x" data-lg="close" aria-label="关闭">${I.x}</button></div>
      <div class="in">
        <h3>登录沉浸云</h3>
        <p class="sub">登录后同步生词本、阅读进度与偏好设置</p>
        <label>邮箱地址<input value="${USER.email}" ${code ? "disabled" : ""}></label>
        ${code ? '<label>验证码<input value="482913" inputmode="numeric"></label>' : ""}
        <button class="btn primary" data-lg="${code ? "submit" : "send"}">${code ? "登录" : "发送验证码"}</button>
      </div></div>`;
  }
  $("#login-slot").addEventListener("click", (e) => {
    const b = e.target.closest("[data-lg]");
    if (!b) return;
    if (b.dataset.lg === "close") { S.login = null; renderLogin(); return; }
    if (b.dataset.lg === "send") { S.login = "code"; renderLogin(); log("authSendOtp(email)"); return; }
    S.login = null; S.auth = "member"; S.arrive = true;
    renderLogin(); renderAll();
    log("auth-state-changed { loggedIn: true }", "阅读室监听到事件，登录按钮换成头像");
    toast(`已登录 ${USER.email}`);
  });

  // ---------- 演示控制 ----------
  function syncDemo() {
    document.querySelectorAll("[data-auth]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.auth === S.auth)));
    document.querySelectorAll("[data-theme-set]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeSet === S.theme)));
    document.querySelectorAll("[data-w]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.w === S.w)));
  }
  function renderAll() {
    win.dataset.theme = S.theme;
    document.documentElement.style.setProperty("--win-w", S.w + "px");
    win.toggleAttribute("data-narrow", Number(S.w) < 1100);
    $("#theme-dot").style.background = THEMES[S.theme][1];
    $("#theme-name").textContent = THEMES[S.theme][0];
    renderAcct(); renderTip(); renderDrawer(); renderLogin(); syncDemo();
  }
  document.querySelector(".demo").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.auth) { S.auth = b.dataset.auth; S.menu = false; S.confirm = false; }
    if (b.dataset.themeSet) S.theme = b.dataset.themeSet;
    if (b.dataset.w) S.w = b.dataset.w;
    if (b.id === "demo-reset") { S.tipDismissed = false; localStorage.removeItem(TIP_KEY); }
    renderAll();
  });

  renderAll();
})();
</script>
</body>
</html>
