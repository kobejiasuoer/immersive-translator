  if(!Number.isInteger(sid)||!flat[sid])return;clearHighlights();pinnedId=sid;lastPanelTrigger=trigger||document.activeElement;setPanel('sentence');$('sentence-'+sid).classList.add('inspected');$('panel-footer').hidden=false;$('return-reading').innerHTML=icon('back')+'读懂了，回到原文';
  const data=xrays[sid];$('panel-title').innerHTML=icon('lens')+'读懂这句';
  $('panel-content').innerHTML=`<p class="panel-intro">先抓主干，再把细节接上。</p><blockquote class="source-quote" lang="en">${escapeHTML(flat[sid].en)}</blockquote>${data?`<h2 class="section-label">先读这一层</h2><p class="spine" lang="en">${data.spine}</p><p class="explain-note">${escapeHTML(data.note)}</p><ul class="clause-list">${data.parts.map(([en,cn],i)=>`<li class="clause" tabindex="0" data-clause="${i}"><p class="clause-en" lang="en">${escapeHTML(en)}</p><p class="clause-cn">${escapeHTML(cn)}</p></li>`).join('')}</ul><details class="chinese-help"><summary>${icon('chevron')}需要中文提示？</summary><p>${escapeHTML(data.zh)}</p></details>`:`<p class="section-label">先慢慢听一遍</p><p class="explain-note">这份交互原型为开篇的倒装句、镀金描写和议员的长句准备了完整解读。你也可以先听这句，或收藏后回看。</p>`}`;
  $('panel-footer').innerHTML=`<button class="quiet-button" id="hear-sentence">${icon('sound')}听这一句</button><button class="quiet-button" id="save-sentence"></button>`;
  const refreshSave=()=>{$('save-sentence').innerHTML=icon(saved.has('s:'+sid)?'check':'bookmark')+(saved.has('s:'+sid)?'已收藏这句':'收藏这句');};refreshSave();
  $('hear-sentence').onclick=()=>speakOne(flat[sid].en);$('save-sentence').onclick=()=>{const id='s:'+sid;if(saved.has(id)){saved.delete(id);status('已取消收藏');}else{saved.set(id,{kind:'sentence',text:flat[sid].en,sid});status('这句话已加入本篇收获');}updateSaved();refreshSave();};
  $('panel-content').querySelectorAll('.clause').forEach(li=>{const part=data.parts[Number(li.dataset.clause)][0];li.onmouseenter=()=>markClause(part);li.onmouseleave=()=>markClause(null);li.onfocus=()=>markClause(part);li.onblur=()=>markClause(null);});
  $('close-panel').focus({preventScroll:true});
}
function openHarvest(trigger){if(panelMode==='harvest'){closePanel();return;}clearHighlights();lastPanelTrigger=trigger;setPanel('harvest');pinnedId=null;renderHarvest();$('close-panel').focus({preventScroll:true});}
function renderHarvest(){
  $('panel-title').innerHTML=icon('leaf')+'本篇收获';$('panel-footer').hidden=true;$('return-reading').innerHTML=icon('back')+'回到原文';
  if(!saved.size){$('panel-content').innerHTML=`<div class="empty-harvest">${icon('bookmark')}<h2>留下值得再读的词句。</h2><p>点词看释义后，可以收藏。<br>读到喜欢的一句，也可以在解读中留下。<br><br>没有必做任务，按自己的节奏读。</p></div>`;return;}
  $('panel-content').innerHTML=`<p class="panel-intro">你在这篇文章里留下的 ${saved.size} 个词句。</p>`+Array.from(saved.entries()).map(([id,item])=>`<article class="saved-row"><div class="saved-type">${item.kind==='word'?'词与表达':'原文摘句'}</div><div class="saved-row-header"><span class="${item.kind==='word'?'saved-word':'saved-sentence'}" lang="en">${escapeHTML(item.text)}</span><button class="icon-button" data-remove="${escapeHTML(id)}" aria-label="取消收藏 ${escapeHTML(item.text)}">${icon('bookmark')}</button></div>${item.entry?`<p>${escapeHTML(item.entry.cn)}</p>`:''}<button class="saved-context" data-locate="${item.sid}" title="回到原文中的这句话" lang="en">${item.kind==='word'?escapeHTML(flat[item.sid].en):'回到原文'} ${icon('chevron')}</button></article>`).join('');
  $('panel-content').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{saved.delete(b.dataset.remove);updateSaved();status('已取消收藏');});
  $('panel-content').querySelectorAll('[data-locate]').forEach(b=>b.onclick=()=>{const sid=Number(b.dataset.locate);closePanel(false);$('sentence-'+sid).scrollIntoView({block:'center',behavior:'smooth'});$('scrollpane').focus({preventScroll:true});});
}
$('harvest-trigger').onclick=e=>openHarvest(e.currentTarget);$('end-harvest').onclick=e=>openHarvest(e.currentTarget);
$('prose').addEventListener('pointerover',e=>{const sentence=e.target.closest('.sentence');if(!sentence)return;const p=sentence.closest('.paragraph');const b=p.querySelector('.gutter-help');b.dataset.sid=sentence.dataset.sid;b.setAttribute('aria-label','解读这句：'+flat[Number(sentence.dataset.sid)].en);b.style.top=Math.max(0,sentence.getClientRects()[0].top-p.getBoundingClientRect().top-4)+'px';});
$('prose').addEventListener('click',e=>{if(selectionClick){selectionClick=false;return;}const selection=window.getSelection();if(selection&&!selection.isCollapsed)return;const help=e.target.closest('.gutter-help');if(help){openSentence(Number(help.dataset.sid),help);return;}const word=e.target.closest('.word');if(!word)return;const sentence=word.closest('.sentence');showWord(word.dataset.word,Number(sentence.dataset.sid),word);});
$('prose').addEventListener('mouseup',e=>{const selection=window.getSelection();if(!selection||selection.isCollapsed)return;const sentence=e.target.closest('.sentence'),start=selection.anchorNode?.parentElement?.closest('.sentence');if(!sentence||start!==sentence)return;const text=selection.toString().trim();if(!text||text.length>400)return;selectionClick=true;setTimeout(()=>selectionClick=false,0);const sid=Number(sentence.dataset.sid);if(text.split(/\s+/).length>=10){openSentence(sid,sentence.closest('.paragraph').querySelector('.gutter-help'));selection.removeAllRanges();}else showWord(text,sid,null,selection.getRangeAt(0).getBoundingClientRect());});
function refreshPlayer(){document.querySelectorAll('.sounding').forEach(s=>s.classList.remove('sounding'));if(playing)$('sentence-'+playIndex)?.classList.add('sounding');$('play').innerHTML=icon(playing?'pause':'play');$('play').setAttribute('aria-label',playing?'暂停朗读':'开始朗读');$('play-label').textContent=playing?'正在朗读':'听原文';$('play-position').textContent=`${playIndex+1} / ${flat.length} 句`;$('play-progress').value=String(playIndex);$('prev').disabled=playIndex===0;$('next').disabled=playIndex===flat.length-1;}
function stopSpeech(){speechEpoch++;if('speechSynthesis'in window)speechSynthesis.cancel();playing=false;refreshPlayer();}
function makeUtterance(text){if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){status('当前浏览器不支持朗读');return null;}const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=rate;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang.startsWith('en'))||null;return u;}
function speakOne(text){stopSpeech();const u=makeUtterance(text);if(!u)return;u.onerror=()=>status('朗读暂不可用，请检查系统语音');speechSynthesis.speak(u);}
function playCurrent(){const u=makeUtterance(flat[playIndex].en);if(!u)return;const token=++speechEpoch;playing=true;refreshPlayer();const el=$('sentence-'+playIndex);const rect=el.getBoundingClientRect(),view=$('scrollpane').getBoundingClientRect();if(rect.top<view.top+20||rect.bottom>view.bottom-100)el.scrollIntoView({block:'center',behavior:'smooth'});u.onend=()=>{if(token!==speechEpoch||!playing)return;if(playIndex<flat.length-1){playIndex++;playCurrent();}else{playing=false;refreshPlayer();status('这段已经听完了');}};u.onerror=e=>{if(token!==speechEpoch)return;playing=false;refreshPlayer();if(e.error!=='interrupted'&&e.error!=='canceled')status('朗读暂不可用，请检查系统语音');};speechSynthesis.speak(u);}
$('play').onclick=()=>{if(playing)stopSpeech();else playCurrent();};
function jumpSpeech(idx){const resume=playing;stopSpeech();playIndex=Math.max(0,Math.min(flat.length-1,idx));refreshPlayer();if(resume)playCurrent();}
$('prev').onclick=()=>jumpSpeech(playIndex-1);$('next').onclick=()=>jumpSpeech(playIndex+1);$('play-progress').onchange=e=>jumpSpeech(Number(e.target.value));
$('speed').onclick=()=>{const rates=[.8,1,1.2,1.5];rate=rates[(rates.indexOf(rate)+1)%rates.length];$('speed').textContent=rate.toFixed(1)+'×';$('speed').setAttribute('aria-label','朗读语速 '+rate+' 倍');if(playing)jumpSpeech(playIndex);};
$('tell-story').onclick=()=>{$('after-read').hidden=false;$('after-read').scrollIntoView({block:'start',behavior:'smooth'});$('story-draft').focus({preventScroll:true});};
$('cancel-story').onclick=()=>{$('after-read').hidden=true;$('tell-story').focus({preventScroll:true});};
$('hear-question').onclick=()=>speakOne('Why do you think the Prince is crying?');
$('save-story').onclick=()=>{
  const draft=$('story-draft').value.trim();
  if(!draft){$('story-draft').focus();status('先写下一点你的理解');return;}
  try{localStorage.setItem('reader-focus-prototype-draft',draft);$('draft-feedback').hidden=false;$('draft-feedback').textContent='这段想法已保存在本机。可以继续修改。';status('已留下这段想法');}
  catch{status('暂时无法保存，请先保留输入内容');}
};
try{const draft=localStorage.getItem('reader-focus-prototype-draft');if(draft)$('story-draft').value=draft;}catch{}
document.addEventListener('pointerdown',e=>{
  if(!e.target.closest('.menu,#settings-trigger,#shelf-trigger'))closeMenus();
  if(!e.target.closest('.word-pop,.word,.sentence'))closeWord();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!$('settings-menu').hidden||!$('shelf-menu').hidden)closeMenus(true);
    else if(!$('word-pop').hidden)closeWord();
    else if(panelMode)closePanel();
    return;
  }
  if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,button,summary,[contenteditable=true]'))return;
  if(e.code==='Space'){e.preventDefault();$('play').click();}
});
$('scrollpane').addEventListener('scroll',closeWord,{passive:true});
window.addEventListener('resize',closeWord);
window.addEventListener('pagehide',stopSpeech);
refreshPlayer();
// 单文件场景链接便于评审；不在阅读界面增加演示控制条。
const scene=new URLSearchParams(location.search).get('scene');
if(scene==='sentence')openSentence(1,document.querySelector('.gutter-help'));
else if(scene==='word'){const w=document.querySelector('[data-word="gilded"]');showWord('gilded',1,w);}
else if(scene==='end')$('reading-end').scrollIntoView({block:'start'});
</script>
</body>
</html>
