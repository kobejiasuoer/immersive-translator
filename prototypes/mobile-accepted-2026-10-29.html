<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef1ee"><title>沉浸口语 · 移动端交互优化版</title><style>
/* 令牌 1:1 取自桌面端「护眼」灰绿板（reader-room / notes-review 优化稿 2026-10-26）。
   手机端只改形态（底部 Tab、抽屉、拇指区），不换颜色、字体和命名。
   --voice 是桌面口语页麦克风的靛蓝，只用在「你的声音」：麦克风、你说的话、录音态。 */
:root{
  --accent:#1f6b57; --accent-hover:#185646; --accent-soft:#e3f0ea; --accent-line:#b9d8cc;
  --bg:#eef1ee; --surface:#fff; --surface-2:#f6f8f6;
  --border:#e1e6e2; --border-strong:#c9d1cc;
  --text-1:#1f2329; --text-2:#48505a; --text-3:#5f6873; --text-4:#8f98a3;
  --ok:#2f8f5b; --warn:#a1620f; --warn-soft:#fbf1e1; --bad:#b4423a; --bad-soft:#fbeae8;
  --tape:#e9dfc2; --tape-line:#cdbf93;
  --voice:#4c5ff0; --voice-soft:#eef0fe; --voice-hl:#dde2fd;
  --font-ui:-apple-system,"PingFang SC","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --font-en:"Source Serif 4",Georgia,"Times New Roman",serif;
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-pill:999px;
  --ease:cubic-bezier(.32,.72,0,1);
  --prose-size:18px; --prose-lh:1.78;
}
.phone[data-theme="sepia"]{
  --bg:#f4efe4; --surface:#fbf8f1; --surface-2:#efe9db;
  --border:#e3dccb; --border-strong:#cfc5b0;
  --text-1:#2b251d; --text-2:#544b3d; --text-3:#756a59; --text-4:#9c907d;
  --accent:#236451; --accent-soft:#e2ede6; --accent-line:#b8d1c3;
}
.phone[data-theme="dark"]{
  --bg:#161a18; --surface:#202623; --surface-2:#28302c;
  --border:#313a35; --border-strong:#434f48;
  --text-1:#e7ece9; --text-2:#b7c2bc; --text-3:#88968e; --text-4:#5d6b63;
  --accent:#3ca385; --accent-hover:#4bb596; --accent-soft:#1d3830; --accent-line:#2b594b;
  --warn:#d49035; --warn-soft:#382b18; --bad:#d9655c; --bad-soft:#3a201e;
  --tape:#4a422f; --tape-line:#6b5f43;
  --voice:#6b7cff; --voice-soft:#23294a; --voice-hl:#2d3663;
}
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
button:focus-visible,[role=button]:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:15px;height:15px}.ico.lg{width:22px;height:22px}
.en{font-family:var(--font-en)}
.muted{color:var(--text-3)}

/* ---------- 看板：索引 | 手机 | 桌面对照 ---------- */
body{font:14px/1.6 var(--font-ui);color:var(--text-1);background:#dfe4e0;min-height:100vh}
.board{display:grid;grid-template-columns:268px 410px minmax(340px,1fr);gap:36px;max-width:1360px;margin:0 auto;padding:32px 28px 48px;align-items:start}
.board>*{position:sticky;top:20px}
.intro{max-height:calc(100vh - 40px);overflow-y:auto;padding-right:6px;scrollbar-width:thin}
.intro h1{font-size:18.5px;line-height:1.38;font-weight:700}
.intro p{margin-top:6px;font-size:12.5px;color:var(--text-2);line-height:1.6}
.idx{margin-top:16px;display:grid;gap:2px}
.idx h2{font-size:11.5px;font-weight:600;color:var(--text-3);margin:12px 10px 3px;display:flex;justify-content:space-between;align-items:center}
.idx h2:first-child{margin-top:0}
.idx h2 span{font-size:10.5px;padding:1px 6px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.idx button{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--r-sm);font-size:13px;color:var(--text-2)}
.idx button:hover{background:rgba(255,255,255,.55)}
.idx button.on{background:var(--surface);color:var(--text-1);font-weight:600;box-shadow:0 0 0 1px var(--border)}
.idx button small{color:var(--text-4);font-size:11px;font-weight:500}
.idx button small.new{color:var(--accent);background:var(--accent-soft);padding:0 5px;border-radius:4px}
.replay-row{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.replay{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-pill);border:1px solid var(--border-strong);background:var(--surface);font-size:12.5px;font-weight:600}
.replay:hover{background:var(--surface-2)}
@media (max-width:1120px){
  .board{grid-template-columns:410px minmax(300px,1fr)}
  .intro{grid-column:1/-1;position:static;max-height:none}
  .idx{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px}
  .idx h2{grid-column:1/-1}
}
@media (max-width:780px){
  .board{grid-template-columns:1fr;padding:16px 12px}
  .board>*{position:static}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---------- 手机壳与外壳（桌面三段外壳的手机形态） ---------- */
.phone{width:410px;height:864px;border:10px solid #22262b;border-radius:56px;background:var(--bg);color:var(--text-1);position:relative;overflow:hidden;box-shadow:0 30px 60px rgba(31,35,41,.22),0 2px 6px rgba(31,35,41,.25);margin:0 auto;transition:background .25s,color .25s}
.sb{position:absolute;top:0;left:0;right:0;height:50px;z-index:30;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 7px 34px;font-weight:600;font-size:15px;pointer-events:none}
.sb .r{display:flex;gap:6px;align-items:center}
.sb svg{fill:currentColor}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--text-1);opacity:.85;z-index:40;pointer-events:none}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.view.push{animation:pushIn .34s var(--ease)}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:none}}
.vbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;padding:0 18px 120px;scrollbar-width:none}
.vbody::-webkit-scrollbar{display:none}

/* 根页页头：桌面左上「I 书架」胶囊 → 手机左上同一枚 monogram，点它开账号与同步 */
.rhead{flex:none;display:flex;align-items:center;gap:10px;padding:58px 18px 12px}
.seal{width:34px;height:34px;border-radius:50%;background:var(--text-1);color:var(--surface);display:grid;place-items:center;font:italic 700 17px var(--font-en);position:relative;flex:none}
.seal i{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}
.seal i.ing{background:var(--surface);border-color:var(--text-4);animation:spin 1s linear infinite;border-top-color:transparent}
.seal i.off{background:var(--warn)}
@keyframes spin{to{transform:rotate(360deg)}}
.rtitle{font-size:24px;font-weight:700;letter-spacing:.02em;flex:1}
.rhead-acts{display:flex;gap:8px;align-items:center}
.ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);background:var(--surface);border:1px solid var(--border);flex:none;position:relative}
.ibtn .dot-bdg{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}

/* 推入页页头：返回 · 标题 · 动作 */
.nhead{flex:none;display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:6px;padding:54px 12px 8px;min-height:100px}
.nhead .nt{text-align:center;min-width:0}
.nhead .nt b{display:block;font-size:15.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nhead .nt small{display:block;font-size:12px;color:var(--text-3);line-height:1.3}
.nhead .act{display:flex;gap:4px;justify-self:end;align-items:center}
.back{width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.back:hover{background:var(--surface-2)}

/* 底部 Tab：桌面中间导航岛「阅读 / 口语 / 笔记与复习」原样落到拇指区 */
.tabbar{position:absolute;left:14px;right:14px;bottom:24px;z-index:20;display:flex;gap:2px;padding:5px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--border);box-shadow:0 8px 24px rgba(31,35,41,.12)}
.tabbar button{flex:1 1 auto;padding:0 10px;display:flex;align-items:center;justify-content:center;gap:6px;height:46px;border-radius:var(--r-pill);color:var(--text-2);font-size:14px;white-space:nowrap}
.tabbar button.on{background:var(--text-1);color:var(--surface);font-weight:600}
.tabbar .bdg{font-size:11.5px;line-height:18px;min-width:20px;padding:0 6px;border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent);font-weight:600;text-align:center}
.tabbar button.on .bdg{background:rgba(255,255,255,.18);color:var(--surface)}

/* ---------- 基元（与桌面 folio 同名同值） ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 20px;border-radius:var(--r-pill);font-weight:600;font-size:14.5px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-1);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.voice{background:var(--voice);border-color:var(--voice);color:#fff}
.btn.sm{height:34px;padding:0 14px;font-size:13px;font-weight:500}
.btn.xs{height:28px;padding:0 10px;font-size:12px;font-weight:500}
.btn.block{width:100%}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:20px;padding:0 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.grey{background:var(--surface-2);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--border)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.voice{background:var(--voice-soft);color:var(--voice)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--text-2);white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--border)}
.seg button{height:32px;padding:0 14px;border-radius:var(--r-pill);font-size:13px;color:var(--text-2);white-space:nowrap}
.seg button.on{background:var(--text-1);color:var(--surface);font-weight:600}
.seg.soft{background:var(--surface-2);width:100%;display:flex}
.seg.soft button{flex:1;text-align:center}
.seg.soft button.on{background:var(--surface);color:var(--text-1);box-shadow:0 0 0 1px var(--border)}
.sw{width:40px;height:24px;border-radius:12px;background:var(--border-strong);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(16px)}
.ring{flex:none}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 10px}
.sec-h b{font-size:15px}
.sec-h span,.sec-h button{font-size:12.5px;color:var(--text-3)}
.sec-h button.lk{color:var(--accent);font-weight:600}
.dash{border-bottom:1.5px dashed var(--accent-line);cursor:pointer}
.dash:hover{border-bottom-color:var(--accent)}
.inp{width:100%;height:44px;padding:0 14px;border-radius:var(--r-md);border:1px solid var(--border-strong);background:var(--surface);font-size:14.5px;color:var(--text-1)}
.inp:focus{border-color:var(--accent);outline:none}
textarea.inp{height:auto;padding:10px 14px;line-height:1.55;resize:vertical}

/* ---------- 新增：登录与跨端接力模块 ---------- */
.login-wrap{padding:66px 22px 36px;display:flex;flex-direction:column;min-height:100%}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.login-seal{width:46px;height:46px;border-radius:50%;background:var(--text-1);color:var(--surface);display:grid;place-items:center;font:italic 700 23px var(--font-en);box-shadow:0 6px 16px rgba(31,35,41,.16)}
.login-brand h1{font-size:22px;font-weight:700;line-height:1.25}
.login-brand p{font-size:12.5px;color:var(--text-3)}
.login-relay-preview{padding:13px 14px;margin-bottom:16px;background:linear-gradient(180deg,var(--accent-soft),var(--surface));border-color:var(--accent-line)}
.login-relay-preview .hd{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);font-weight:600}
.login-relay-preview .qt{font:14.5px/1.5 var(--font-en);color:var(--text-1);margin-top:6px;padding-left:10px;border-left:2.5px solid var(--accent)}
.login-relay-preview .ft{font-size:11.5px;color:var(--text-3);margin-top:6px;display:flex;gap:10px}
.login-card{padding:18px 16px}
.field{margin-top:12px}
.field:first-child{margin-top:0}
.field label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.field label span{font-weight:400;color:var(--text-3)}
.code-row{display:flex;gap:8px}
.code-row .inp{flex:1;letter-spacing:.12em;font-weight:600;font-variant-numeric:tabular-nums}
.otp-pills{display:flex;gap:6px;margin-top:8px;align-items:center;font-size:12px;color:var(--text-3)}
.otp-pills button{color:var(--accent);font-weight:600;text-decoration:underline}
.qr-box{text-align:center;padding:10px 6px 4px}
.qr-frame{width:168px;height:168px;margin:8px auto 12px;padding:14px;border-radius:16px;border:1.5px dashed var(--accent-line);background:var(--surface-2);display:grid;place-items:center;position:relative}
.qr-scanline{position:absolute;left:12px;right:12px;height:2px;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%,100%{top:18px}50%{top:146px}}
.login-foot{margin-top:auto;padding-top:16px;text-align:center;font-size:12px;color:var(--text-3)}
.login-foot .guest-row{display:flex;justify-content:center;gap:16px;margin-bottom:10px;font-size:13px}
.login-foot .guest-row button{color:var(--text-2);font-weight:500}

/* ---------- 书架：接力卡是全应用唯一的「跨端」造型，原句用衬线 ---------- */
.relay{padding:16px 16px 14px;position:relative;overflow:hidden}
.relay-src{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-3)}
.relay-src b{color:var(--text-1);font-weight:600}
.relay-q{margin:10px 0 2px;padding:2px 0 2px 12px;border-left:3px solid var(--accent);font:17px/1.55 var(--font-en);color:var(--text-1)}
.relay-at{font-size:12.5px;color:var(--text-3);padding-left:15px}
.relay-bar{display:flex;align-items:center;gap:10px;margin:12px 0 14px}
.relay-bar b{font-size:13px;font-variant-numeric:tabular-nums}
.pbar{flex:1;height:5px;border-radius:3px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.relay-cta{display:flex;gap:8px}
.relay-cta .primary{flex:1}
.relay.arrive .relay-q{animation:quoteIn .7s var(--ease) both}
@keyframes quoteIn{from{opacity:0;transform:translateY(6px);border-left-color:var(--surface)}to{opacity:1;transform:none}}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2) 0,#e9ede9 50%,var(--surface-2) 100%);background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.today{display:grid;grid-template-columns:1fr 1fr;margin-top:10px}
.today>div{display:flex;gap:10px;align-items:center;padding:12px 14px}
.today>div+div{border-left:1px solid var(--border)}
.today b{display:block;font-size:14px;line-height:1.3}
.today small{display:block;font-size:12px;color:var(--text-3);line-height:1.35}
.today .lk{color:var(--accent);font-weight:600}
.book{display:flex;gap:14px;padding:14px}
.book+.book{border-top:1px solid var(--border)}
.cover{width:62px;height:86px;border-radius:6px;flex:none;background:linear-gradient(160deg,#2a7a63,#174d3f);color:#fff;padding:8px 7px;font:700 11px/1.15 var(--font-en);box-shadow:0 4px 10px rgba(23,77,63,.25)}
.cover.c2{background:linear-gradient(160deg,#3d5a80,#233854)}
.cover.c3{background:linear-gradient(160deg,#7a5c38,#4d371e)}
.book .bt{font:700 16px/1.3 var(--font-en)}
.book .meta{font-size:12.5px;color:var(--text-3);margin:2px 0 8px}
.row-li{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%}
.row-li+.row-li{border-top:1px solid var(--border)}
.row-li .tx{flex:1;min-width:0}
.row-li .tx b{display:block;font-size:14px;font-weight:600;line-height:1.35}
.row-li .tx small{display:block;font-size:12.5px;color:var(--text-3);line-height:1.4}
.row-li .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.row-li .chev{color:var(--text-4)}

/* ---------- 阅读页 ---------- */
.rmeta{display:flex;align-items:center;justify-content:space-between;padding:0 18px 10px;font-size:12.5px;color:var(--text-3);border-bottom:1px solid var(--border);flex:none}
.rmeta .mk{display:flex;align-items:center;gap:8px;color:var(--text-1);font-weight:600;font-size:13px}
.view.reading,.view.reading .rmeta{background:var(--surface)}
.resume{position:sticky;top:10px;z-index:4;display:flex;align-items:center;gap:8px;margin:10px 0 4px;box-shadow:0 0 0 1px var(--accent-line),0 6px 16px rgba(31,35,41,.08);padding:9px 12px;border-radius:var(--r-md);background:var(--accent-soft);color:var(--accent);font-size:13px}
.resume b{font-weight:700}
.resume .x{margin-left:auto;color:var(--accent);opacity:.7}
.ch-kick{font-size:12.5px;color:var(--text-3);margin-top:18px}
.ch-title{font:700 26px/1.25 var(--font-en);margin-top:4px}
.ch-sub{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px;font-size:14px;color:var(--text-3)}
.prose{font-family:var(--font-en);font-size:var(--prose-size);line-height:var(--prose-lh);color:var(--text-1)}
.prose p{margin-bottom:14px}
.s{border-radius:4px;cursor:pointer;transition:background .2s}
.s.on{background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.s.on.play{background:var(--voice-hl);box-shadow:0 0 0 3px var(--voice-hl)}
.cn{display:block;font:14px/1.6 var(--font-ui);color:var(--text-2);margin:2px 0 6px}
.cn .custom-tag{font-size:11px;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:4px;margin-left:6px}
.playbar{position:absolute;left:18px;right:18px;bottom:30px;z-index:15;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--border);box-shadow:0 8px 24px rgba(31,35,41,.12)}
.playbar .pp{width:42px;height:42px;border-radius:50%;background:var(--text-1);color:var(--surface);display:grid;place-items:center;flex:none}
.playbar .sk{width:36px;height:36px;display:grid;place-items:center;color:var(--text-2);flex:none}
.playbar .pos{font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.playbar .spd{height:30px;padding:0 10px;border-radius:var(--r-pill);border:1px solid var(--border);font-size:12.5px;font-variant-numeric:tabular-nums;flex:none}

/* ---------- 口语 ---------- */
.ch-card{padding:16px}
.ch-card h3{font-size:17px;line-height:1.35}
.ch-card p{font-size:13px;color:var(--text-2);margin-top:3px}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.wd{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--border);font-size:12px;color:var(--text-3);white-space:nowrap;flex:none}
.wd b{font:700 14px var(--font-en);color:var(--text-1)}
.wd .ck{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--border-strong);display:grid;place-items:center;flex:none}
.wd.done{background:var(--accent-soft);border-color:transparent}
.wd.done b{color:var(--accent)}
.wd.done .ck{background:var(--accent);border-color:var(--accent);color:#fff}
.wd.next{border-color:var(--voice);box-shadow:0 0 0 1px var(--voice)}
.used{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-2);margin-bottom:14px}
.lv{font-size:12px;padding:0 8px;line-height:20px;border-radius:6px;border:1px solid var(--border);color:var(--text-3);white-space:nowrap}

/* ---------- 生词造句闯关 & 场景对话（桌面口语页的手机形态） ---------- */
.view.drill{background:var(--surface)}
.dtop{flex:none;padding:0 18px 10px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.dtop .used{margin:2px 0 8px}
.wrail{display:flex;gap:6px;overflow-x:auto;margin:0 -18px;padding:0 18px 2px;scrollbar-width:none}
.wrail::-webkit-scrollbar{display:none}
.thread{padding:16px 18px 210px}
.aimeta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--text-3);margin-bottom:6px}
.aimeta button{display:inline-flex;align-items:center;gap:4px;color:var(--text-3);font-size:12px}
.aimeta button.on{color:var(--accent);font-weight:600}
.ai{font:17.5px/1.62 var(--font-en);color:var(--text-1)}
.ai strong{font-weight:700}
.ai-blind{padding:14px;border-radius:var(--r-md);background:repeating-linear-gradient(-45deg,var(--surface-2) 0 8px,var(--bg) 8px 16px);border:1px dashed var(--border-strong);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--text-2)}
.ai-cn{font-size:13.5px;color:var(--text-2);margin-top:4px}
.hintbox{display:flex;gap:8px;margin:12px 0 4px;padding:10px 12px;border:1px dashed var(--border-strong);border-radius:var(--r-md);background:var(--surface-2);font-size:13px;color:var(--text-2);line-height:1.55}
.hintbox b{color:var(--text-1)}
.you{margin:22px 0 0 34px}
.you-meta{text-align:right;font-size:12px;color:var(--text-3);margin-bottom:4px}
.you-meta em{font-style:normal;color:var(--voice)}
.bub{padding:11px 14px;border-radius:16px 16px 4px 16px;background:var(--voice-soft);font:16.5px/1.6 var(--font-en)}
.bub .hit{color:var(--accent);font-weight:700}
.bub .wav{text-decoration:underline wavy #c98a2b;text-underline-offset:4px;cursor:pointer}
.bub.live{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--voice)}
.caret{display:inline-block;width:2px;height:17px;background:var(--voice);vertical-align:-3px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.verdict{display:flex;justify-content:flex-end;margin-top:6px}
.verdict span{font-size:12.5px;padding:2px 10px;border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent)}
.next-ai{margin-top:22px}
.sysline{margin-top:20px;text-align:center;font-size:12.5px;color:var(--text-3)}
.dock{position:absolute;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px 30px}
.dock-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.dock-row .l{display:flex;gap:6px}
.dock-row .r{display:flex;justify-content:flex-end}
.mic{width:64px;height:64px;border-radius:50%;background:var(--voice);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(76,95,240,.32);position:relative}
.mic.rec::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--voice);opacity:.35;animation:pulse 1.4s ease-out infinite}
@keyframes pulse{from{transform:scale(.92);opacity:.5}to{transform:scale(1.18);opacity:0}}
.mic .stop{width:20px;height:20px;border-radius:5px;background:#fff}
.dock-cap{text-align:center;font-size:12px;color:var(--text-3);margin-top:8px}
.wave{display:flex;gap:3px;align-items:center;justify-content:center;height:26px;margin-bottom:8px}
.wave i{width:3px;border-radius:2px;background:var(--voice);animation:wv 1s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.lnk{font-size:13px;font-weight:600;color:var(--text-1);white-space:nowrap}

/* ---------- 本轮复盘 ---------- */
.rc-hero{text-align:center;padding:18px 16px 16px}
.rc-hero .big{font-size:40px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.rc-hero .big span{font-size:22px;color:var(--text-3)}
.rc-hero p{font-size:13px;color:var(--text-2);margin-top:4px}
.score{display:flex;gap:16px;align-items:center;padding:14px 16px}
.bars{flex:1;display:grid;gap:8px}
.bars>div{display:grid;grid-template-columns:34px 1fr 28px;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2)}
.bars .pbar i{background:var(--ok)}
.bars em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.fix{padding:14px 16px}
.fix .was{font:15px/1.5 var(--font-en);color:var(--bad);text-decoration:line-through;text-decoration-color:rgba(180,66,58,.45)}
.fix .now{font:700 16px/1.5 var(--font-en);margin-top:4px}
.fix .why{font-size:12.5px;color:var(--text-2);margin-top:6px}
.fix-act{display:flex;align-items:center;gap:8px;margin-top:12px}
.synced{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ok)}
.dock2{position:absolute;left:0;right:0;bottom:0;z-index:15;display:flex;gap:10px;padding:12px 18px 30px;background:var(--bg);border-top:1px solid var(--border)}
.dock2 .btn{flex:1;height:48px}

/* ---------- 新增：生词本记录模块 ---------- */
.wb-summary{display:grid;grid-template-columns:repeat(3,1fr);padding:12px 8px;text-align:center;margin-bottom:12px}
.wb-summary>div+div{border-left:1px solid var(--border)}
.wb-summary b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.wb-summary small{font-size:11.5px;color:var(--text-3);display:flex;align-items:center;justify-content:center;gap:4px}
.wb-summary .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.wb-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.wb-search{flex:1;position:relative}
.wb-search input{height:36px;padding:0 12px 0 32px;font-size:13px;border-radius:var(--r-pill)}
.wb-search svg{position:absolute;left:11px;top:10px;color:var(--text-3)}
.wb-item{padding:14px;border-top:1px solid var(--border);cursor:pointer;transition:background .15s}
.wb-item:first-child{border-top:0}
.wb-item:hover{background:var(--surface-2)}
.wb-top{display:flex;align-items:baseline;gap:8px}
.wb-top .hw{font:700 18px/1.25 var(--font-en);color:var(--text-1)}
.wb-top .ph{font-size:12.5px;color:var(--text-3)}
.wb-top .st-pill{margin-left:auto;font-size:11.5px;padding:1px 8px;border-radius:var(--r-pill);font-weight:600}
.st-new{background:#fbf4dc;color:#946c00}
.st-fam{background:var(--accent-soft);color:var(--accent)}
.st-spk{background:var(--voice-soft);color:var(--voice)}
.wb-def{font-size:13.5px;color:var(--text-2);margin-top:3px}
.wb-ctx{margin-top:8px;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface-2);font:14px/1.5 var(--font-en);color:var(--text-2)}
.wb-ctx b{color:var(--accent);font-weight:700}
.wb-log{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:11.5px;color:var(--text-3)}
.wb-log span{display:inline-flex;align-items:center;gap:4px}
.timeline{margin-top:12px;border-left:1.5px solid var(--border-strong);margin-left:7px;padding-left:14px;display:grid;gap:12px}
.tl-node{position:relative;font-size:12.5px;line-height:1.5}
.tl-node::before{content:"";position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--surface)}
.tl-node.v::before{background:var(--voice)}
.tl-node b{display:block;color:var(--text-1);font-size:13px}
.tl-node small{color:var(--text-3)}

/* ---------- 笔记与复习 ---------- */
.due{padding:18px 16px 16px;background:linear-gradient(180deg,var(--accent-soft),var(--surface));border-color:var(--accent-line)}
.due h3{font-size:20px;font-weight:600;line-height:1.35}
.due h3 .n{font:700 24px var(--font-en)}
.due p{font-size:13px;color:var(--text-2);margin:2px 0 12px}
.due .modes{display:flex;gap:6px;margin-bottom:14px}
.stage{padding:14px 16px}
.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);margin:10px 0 12px}
.stack i{display:block;height:100%}
.legend{display:grid;gap:6px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend .dot{width:8px;height:8px;border-radius:50%;flex:none}
.legend em{font-style:normal;margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:10px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border)}
.heat i.l1{background:var(--accent-line);box-shadow:none}
.heat i.l2{background:#7fb3a1;box-shadow:none}
.heat i.now{box-shadow:inset 0 0 0 2px var(--accent)}
.heat i.now.l2{box-shadow:inset 0 0 0 2px var(--accent-hover)}
.note{padding:14px 2px;border-top:1px solid var(--border)}
.note:first-of-type{border-top:0}
.note-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--text-3)}
.note-s{font:16px/1.6 var(--font-en);margin-top:6px}
.note-s .w{font-weight:700;color:var(--accent)}
.tape{display:inline-block;min-width:96px;height:1.2em;vertical-align:-3px;border-radius:4px;cursor:pointer;background:repeating-linear-gradient(-45deg,var(--tape) 0 6px,#f1e9d2 6px 12px);box-shadow:inset 0 0 0 1px var(--tape-line)}
.ans{display:inline-block;padding:0 6px;border-radius:5px;background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line);color:var(--accent);font-weight:700}
.rail-x{display:flex;gap:6px;overflow-x:auto;margin:14px -18px 4px;padding:0 18px;scrollbar-width:none}
.rail-x::-webkit-scrollbar{display:none}
.rail-x .chip small{opacity:.7}
.warnbox{margin-top:12px;padding:10px 12px;border-radius:var(--r-md);background:var(--warn-soft);color:var(--warn);font-size:13px;line-height:1.5;display:flex;align-items:center;justify-content:space-between;gap:8px}
.warnbox u{cursor:pointer;white-space:nowrap;font-weight:600}

/* ---------- 复习中 ---------- */
.rv-top{flex:none;display:flex;align-items:center;gap:12px;padding:56px 18px 12px}
.rv-top .pbar{height:6px}
.rv-top .ct{font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}
.rv-card{margin:6px 18px 0;padding:18px 16px}
.rv-s{font:20px/1.75 var(--font-en);margin-top:12px}
.rv-s .tape{min-width:120px;height:1.25em}
.rv-ex{margin-top:14px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--border);font-size:13.5px;color:var(--text-2);line-height:1.6}
.rv-ex .def{color:var(--text-3);font-size:12.5px;margin-top:2px}
.rv-acts{display:flex;gap:14px;margin-top:12px;font-size:13px;color:var(--text-2)}
.rv-acts button{display:inline-flex;align-items:center;gap:4px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades button{padding:10px 4px;border-radius:var(--r-md);border:1px solid var(--border-strong);background:var(--surface);text-align:center}
.grades b{display:block;font-size:14.5px}
.grades small{display:block;font-size:11.5px;color:var(--text-3)}
.grades button:hover{background:var(--surface-2)}
.think{text-align:center;font-size:13px;color:var(--text-3);margin-bottom:10px}
.done-box{text-align:center;padding:40px 24px 0}
.done-box h3{font-size:22px;margin-top:14px}
.done-box p{text-wrap:balance;font-size:13.5px;color:var(--text-2);margin-top:6px;line-height:1.6}
.tally{display:grid;grid-template-columns:repeat(3,1fr);margin:22px 0 0}
.tally div{padding:12px 0}
.tally div+div{border-left:1px solid var(--border)}
.tally b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.tally small{font-size:12px;color:var(--text-3)}

/* ---------- 底部抽屉：桌面右栏 / 句子浮层的手机形态 ---------- */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(31,35,41,.36)}
.scrim.in{animation:fade .22s ease}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;max-height:80%;display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(31,35,41,.22)}
.sheet.in{animation:up .32s var(--ease)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--border-strong);margin:8px auto 2px;flex:none}
.sh-head{flex:none;padding:8px 18px 12px;border-bottom:1px solid var(--border)}
.sh-head .q{font:17px/1.6 var(--font-en)}
.sh-body{flex:1;min-height:0;overflow-y:auto;padding:14px 18px 34px;scrollbar-width:none}
.sh-body::-webkit-scrollbar{display:none}
.mask{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 12px;border-radius:var(--r-md);font-size:13.5px;color:var(--text-2);background:repeating-linear-gradient(-45deg,var(--surface-2) 0 8px,var(--bg) 8px 16px);border:1px solid var(--border);width:100%}
.mask.open{background:var(--surface-2);color:var(--text-1)}
.sh-acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.sh-acts .btn{height:34px;padding:0 13px;font-size:13px;font-weight:500}
.sh-tabs{display:flex;gap:2px;padding:3px;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--border);margin-bottom:14px}
.sh-tabs button{flex:1;height:32px;border-radius:var(--r-pill);font-size:13.5px;color:var(--text-2);text-align:center}
.sh-tabs button.on{background:var(--surface);color:var(--text-1);font-weight:600;box-shadow:0 0 0 1px var(--border)}
.trunk{padding:12px 14px;border-radius:var(--r-md);background:var(--accent-soft);border:1px solid var(--accent-line)}
.trunk small{font-size:12px;color:var(--accent);font-weight:600}
.trunk div{font:700 16px/1.45 var(--font-en);margin-top:2px}
.parts{margin-top:14px;display:grid;gap:12px}
.part .k{display:inline-block;font-size:11.5px;font-weight:600;color:#fff;background:var(--accent);border-radius:5px;padding:0 7px;line-height:19px}
.part .k.mod{background:#4b5a9a}
.part .v{font:700 15px/1.4 var(--font-en);margin-top:4px}
.part .d{font-size:12.5px;color:var(--text-2)}
.part.sub{margin-left:14px;padding-left:12px;border-left:1.5px solid var(--border-strong)}
.dict .hw{font:700 24px var(--font-en)}
.dict .ph{font-size:13px;color:var(--text-3);margin-left:6px}
.dict .ps{font-size:14px;color:var(--text-2);margin-top:4px}
.dict .eg{margin-top:12px;padding:10px 12px;border-radius:var(--r-md);background:var(--surface-2);font:15px/1.6 var(--font-en)}
.dict .eg small{display:block;font:12px var(--font-ui);color:var(--text-3);margin-top:4px}
.vlist .row-li{padding:11px 2px}
.ph-pills{display:flex;gap:6px;margin:10px 0}
.ph-pills span{font:600 14px var(--font-en);padding:2px 10px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.ph-pills span.bad{background:var(--warn-soft);color:var(--warn)}
.acct{display:flex;gap:12px;align-items:center}
.av{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:19px;font-weight:600;flex:none}
.syncrow{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:var(--r-md);background:var(--accent-soft);color:var(--accent);font-size:13px}
.syncrow b{display:block;font-size:13.5px}
.syncrow small{display:block;font-size:12px;opacity:.85}
.syncrow .btn{margin-left:auto}
.list-h{font-size:12px;font-weight:600;color:var(--text-3);margin:18px 2px 6px}
.lst{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.lst .row-li{padding:11px 12px}
.ok-ic{color:var(--ok)}

/* ---------- 提示条 ---------- */
.toast{position:absolute;left:18px;right:18px;top:60px;z-index:60;display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:var(--r-md);background:var(--text-1);color:var(--surface);font-size:13px;line-height:1.5;box-shadow:0 10px 30px rgba(31,35,41,.25)}
.toast.in{animation:drop .3s var(--ease)}
@keyframes drop{from{transform:translateY(-14px);opacity:0}}
.toast .ico{color:#9fd3bf}

/* ---------- 右侧：这一屏在 Windows 上长什么样 ---------- */
.desk{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 22px 22px}
.desk-k{font-size:12.5px;color:var(--text-3)}
.desk h2{font-size:18px;line-height:1.35;margin-top:2px}
.desk .lead{font-size:13.5px;color:var(--text-2);line-height:1.65;margin-top:6px}
.win{margin-top:16px;border:1px solid var(--border-strong);border-radius:12px;background:var(--bg);overflow:hidden}
.win-bar{height:22px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:5px;padding:0 9px}
.win-bar i{width:7px;height:7px;border-radius:50%;background:var(--border-strong)}
.win-bar span{font-size:10.5px;color:var(--text-3);margin-left:6px}
.win-in{padding:8px;display:grid;gap:7px}
.w-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.w-pill{height:20px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;gap:4px;padding:0 6px;font-size:10px;color:var(--text-2);white-space:nowrap;transition:box-shadow .2s,background .2s}
.w-pill.brand{justify-self:start}
.w-pill.tools{justify-self:end;width:46px}
.w-pill .sl{width:12px;height:12px;border-radius:50%;background:var(--text-1);flex:none}
.w-tabs{display:flex;gap:2px;padding:2px}
.w-tabs span{padding:0 7px;line-height:15px;border-radius:8px;font-size:10px}
.w-tabs span.on{background:var(--text-1);color:#fff}
.w-main{display:grid;gap:7px;height:182px}
.w-b{border-radius:8px;background:var(--surface);border:1px solid var(--border);position:relative;padding:6px 7px;font-size:10px;color:var(--text-3);overflow:hidden;transition:box-shadow .2s,background .2s}
.w-b .ln{height:5px;border-radius:3px;background:var(--surface-2);margin-top:5px}
.w-b .ln.g{background:var(--accent-line)}
.w-b .ln.v{background:var(--voice-hl)}
.w-dock{position:absolute;left:30%;right:30%;bottom:6px;height:12px;border-radius:6px;background:var(--text-1)}
.on-m{box-shadow:0 0 0 2px var(--accent)!important;background:var(--accent-soft)!important;color:var(--accent)!important}
.w-tabs.on-m{border-radius:10px}
.map{margin-top:16px;display:grid}
.map-h,.map-r{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.map-h{font-size:12px;font-weight:600;color:var(--text-3);padding:0 0 6px}
.map-r{padding:9px 0;border-top:1px solid var(--border);font-size:13px;line-height:1.55}
.map-r div:first-child{color:var(--text-2)}
.map-r div:last-child{color:var(--text-1)}
.desk-why{margin-top:14px;padding:11px 13px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--border);font-size:13px;color:var(--text-2);line-height:1.6}
.desk-why b{color:var(--text-1)}

/* 沿用原型的灰绿令牌、衬线英文与圆角组件。 */
.v2-welcome-body{padding:62px 20px 26px;display:flex;flex-direction:column;gap:0}
.v2-welcome-brand{display:flex;align-items:center;gap:12px}
.v2-welcome-brand .login-seal{width:43px;height:43px;font-size:22px;box-shadow:none}
.v2-welcome-brand b{display:block;font-size:21px;letter-spacing:.025em}
.v2-welcome-brand small{display:block;color:var(--text-3);font-size:12px;margin-top:3px}
.v2-welcome-intro{margin:22px 0 18px}
.v2-eyebrow{display:block;font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:600}
.v2-welcome-intro h1{font-size:38px;line-height:1.06;font-weight:500;letter-spacing:-.035em;margin:9px 0 9px}
.v2-welcome-intro>p{font-size:13px;line-height:1.7;color:var(--text-2);max-width:310px}
.v2-starter-card{padding:15px 15px 12px}
.v2-starter-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px}
.v2-starter-card h2{font-size:21px;font-weight:500;margin-top:11px;margin-bottom:8px}
.v2-starter-sentence{font-size:18px;line-height:1.5;margin-bottom:4px}
.v2-starter-sentence>span{background:var(--accent-soft);color:var(--accent);border-bottom:1.5px solid var(--accent-line);padding:1px 3px}
.v2-starter-card>p.muted{font-size:12px;line-height:1.6}
.v2-first-steps{display:flex;justify-content:space-between;gap:6px;margin-top:13px;border-top:1px solid var(--border);padding-top:10px;font-size:11px;color:var(--text-2)}
.v2-first-steps b{font-size:10px;font-weight:600;color:var(--accent);margin-right:2px;font-variant-numeric:tabular-nums}
.v2-welcome-actions{display:flex;flex-direction:column;margin-top:16px}
.v2-welcome-actions .btn{height:46px;font-size:14px}
.v2-welcome-actions .btn.block+.btn.block{margin-top:9px}
.v2-local-caption{font-size:11.5px;line-height:1.65;color:var(--text-3);margin:8px 0 10px;text-align:left}
.v2-welcome-actions>.v2-local-caption{text-align:center;margin:6px 0 10px}
.v2-link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:6px 4px;font-size:12.5px;line-height:1.4;color:var(--accent);text-align:center}
.v2-full-link{width:100%}
.v2-danger{color:var(--bad)}
.v2-legal-foot{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:0 8px;color:var(--text-3);font-size:11px;line-height:1.5}
.v2-legal-foot button{display:inline-flex;align-items:center;min-height:44px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border-strong);padding:0 3px}
.v2-legal-foot>p{width:100%;text-align:center;margin-bottom:-8px}
.v2-onboard-body{padding-top:17px;padding-bottom:42px}
.v2-goal-intro{margin:5px 0 20px}
.v2-goal-intro h2{font-size:23px;font-weight:650;margin:9px 0}
.v2-goal-intro p{font-size:13px;line-height:1.7}
.v2-goal-options{display:flex;flex-direction:column;gap:11px;margin-bottom:18px}
.v2-goal-option{display:grid;grid-template-columns:34px 1fr 18px;gap:12px;align-items:center;padding:16px 13px;min-height:83px;text-align:left}
.v2-goal-option.on{background:var(--accent-soft);border-color:var(--accent-line)}
.v2-goal-icon{height:34px;width:34px;border-radius:50%;background:var(--surface-2);color:var(--accent);display:grid;place-items:center}
.v2-goal-option>span>b{display:block;font-size:14px;margin-bottom:4px;font-weight:600}
.v2-goal-option>span>small{display:block;color:var(--text-3);font-size:12px;line-height:1.55}
.v2-goal-option>i{color:var(--accent);font-style:normal}
.v2-inline-note{padding:12px 13px;margin:14px 0;font-size:12.5px;line-height:1.8;color:var(--text-2);background:var(--surface-2);border-radius:var(--r-md);border:1px solid var(--border)}
.v2-inline-note+.btn{margin-top:0}
.v2-auth-body{padding-top:15px;padding-bottom:32px}
.v2-auth-intro{display:flex;gap:9px;align-items:flex-start;padding:0 3px 17px}
.v2-auth-intro>svg{color:var(--accent);flex:none;margin-top:3px;width:18px;height:18px}
.v2-auth-intro>p{font-size:13px;line-height:1.75;color:var(--text-2)}
.v2-auth-card{padding:15px}
.v2-auth-tabs{margin-bottom:17px}
.v2-auth-tabs button{min-height:44px;padding:0 9px;font-size:13px}
.v2-auth-card .field label,.v2-form .field label{font-size:12px;line-height:1.5;align-items:center;min-height:24px}
.v2-auth-card .field label>span,.v2-form .field label>span{max-width:70%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:11px}
.v2-auth-card>.btn.primary{margin-top:15px}
.v2-auth-card .inp,.v2-form .inp{height:46px}
.v2-code-row{gap:8px;align-items:center}
.v2-code-row .inp{min-width:0;letter-spacing:.08em}
.v2-code-row .btn{width:112px;padding:0 8px;flex:none;font-size:12px;min-height:46px}
.v2-code-row .btn:disabled{opacity:.5;cursor:default}
.v2-field-link{color:var(--accent);font-size:12px;min-height:36px;padding-left:10px}
.v2-password-wrap{position:relative}
.v2-password-wrap .inp{padding-right:50px}
.v2-password-wrap .ibtn{position:absolute;right:2px;top:1px;width:44px;height:44px;border:0;background:none}
.v2-form-error{display:flex;gap:7px;align-items:flex-start;color:var(--bad);background:var(--bad-soft);padding:10px 11px;border-radius:var(--r-sm);font-size:12px;line-height:1.65;margin-top:11px}
.v2-form-error svg{flex:none;margin-top:3px}
.v2-login-legal{margin-top:18px}
.v2-guide-lines{padding-bottom:14px}
.v2-guide-lines p{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.8;margin:10px 0;color:var(--text-2)}
.v2-guide-lines p b{display:grid;place-items:center;flex:none;width:22px;height:22px;background:var(--accent-soft);color:var(--accent);border-radius:50%;font-size:11px;margin-top:2px}
.v2-pair-intro{text-align:center;padding:6px 0 17px}
.v2-pair-intro>svg{display:block;width:50px;height:50px;margin:8px auto 14px;color:var(--accent);stroke-width:1.5}
.v2-pair-intro h3{font-size:15px;margin-bottom:10px;font-weight:600}
.v2-pair-intro p{font-size:12.5px;line-height:1.85;color:var(--text-3);word-break:break-word}
.v2-pair-device{padding:16px;margin:0 0 15px;background:var(--surface-2)}
.v2-pair-device>b{display:flex;align-items:center;gap:8px;font-size:14px;margin:13px 0 5px}
.v2-pair-device>small{display:block;font-size:13px;word-break:break-word;color:var(--text-2)}
.v2-pair-device>p{font-size:12px;line-height:1.8;color:var(--text-3);margin-top:13px}
.v2-policy-section{margin-bottom:21px}
.v2-policy-section h3{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:7px}
.v2-policy-section h3 svg{color:var(--accent)}
.v2-policy-section p{font-size:12.5px;line-height:1.9;color:var(--text-2)}
.v2-account-head{gap:11px;margin-bottom:17px;align-items:center}
.v2-account-head>div{min-width:0;flex:1}
.v2-account-head>div>b{display:block;font-size:16px}
.v2-account-head small{display:block;font-size:12px;color:var(--text-3);word-break:break-word;margin-top:4px;line-height:1.6}
.v2-account-head .av{width:43px;height:43px;flex:none}
.v2-account-sync{padding:13px 12px;display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;background:var(--accent-soft);border-color:var(--accent-line)}
.v2-account-sync>span{color:var(--accent);margin-top:2px}
.v2-account-sync>div{min-width:0}
.v2-account-sync b{font-size:13px;display:block;font-weight:600;line-height:1.5}
.v2-account-sync small{display:block;font-size:11.5px;line-height:1.75;color:var(--text-2);margin-top:3px}
.v2-account-counts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:16px 0 20px;text-align:center;font-size:11px;color:var(--text-3)}
.v2-account-counts b{display:block;font-size:20px;font-weight:500;color:var(--text-1);font-family:var(--font-en);margin-bottom:3px}
.v2-reading-sample{border:1px solid var(--border);border-radius:var(--r-md);padding:15px;background:var(--surface-2)}
.v2-reading-sample small{display:block;font-size:12px;color:var(--text-3);margin-top:5px}
.v2-theme-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.v2-theme-choice{display:flex;flex-direction:column;align-items:center;gap:7px;min-height:78px;padding:10px 5px;border-radius:var(--r-md);border:1px solid var(--border);font-size:11px;color:var(--text-2)}
.v2-theme-choice.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.v2-theme-choice>i{width:36px;height:23px;border:1px solid rgba(0,0,0,.08);border-radius:5px}
.v2-swatch-green{background:#eef1ee}.v2-swatch-sepia{background:#f4efe4}.v2-swatch-dark{background:#161a18}
.v2-setting-seg button{min-height:44px;font-size:12px;padding:0 9px}
.v2-setting-bottom{margin-top:19px;margin-bottom:17px}
.v2-library-body,.v2-feeds-body{padding-top:7px}
.v2-filter-row{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 16px}
.v2-filter-row .chip{min-height:44px;font-size:12px;padding:0 13px}
.v2-book-card{padding:15px;margin-bottom:13px}
.v2-book-summary{display:flex;align-items:flex-start;gap:13px}
.v2-book-summary>.cover{width:58px;height:86px;border-radius:6px;flex:none;line-height:1.3;font-size:12px;text-align:left;padding:10px 8px;overflow:hidden}
.v2-book-summary>.cover>span{display:block}
.v2-book-summary>div:last-child{min-width:0;flex:1}
.v2-book-summary h2{font-size:18px;font-weight:600;line-height:1.35;letter-spacing:-.015em;margin-bottom:5px}
.v2-book-summary p{font-size:11.5px;color:var(--text-3);line-height:1.6}
.v2-book-meta{display:flex;align-items:center;gap:5px 9px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--text-3)}
.v2-book-meta .tag{font-size:10px}
.v2-book-actions{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:14px}
.v2-book-actions .btn{height:44px;flex:1;padding:0 13px;font-size:12.5px}
.v2-book-actions .v2-link{min-height:44px;flex:none;font-size:11.5px;padding:0 4px}
.v2-book-added{font-size:11.5px;line-height:1.6;color:var(--accent);margin-top:10px}
.v2-preview-prose{padding:3px 0 14px}
.v2-preview-prose h3{font-size:21px;line-height:1.4;font-weight:500;margin:9px 0 12px}
.v2-preview-prose p.en{font-size:17px;line-height:1.85;margin-bottom:14px;overflow-wrap:break-word}
.v2-preview-prose+.btn.block,.v2-preview-prose~.btn.block{margin-top:9px}
.v2-feed-row{align-items:flex-start;gap:10px;padding:15px 13px}
.v2-feed-row>.ic{width:28px;height:28px;margin-top:3px;background:var(--accent-soft);color:var(--accent);border-radius:50%;flex:none}
.v2-feed-row>.tx{flex:1;min-width:0}
.v2-feed-row .tx>b{font-size:13px;font-weight:600;line-height:1.45;white-space:normal}
.v2-feed-row .tx>small{font-size:11.5px;line-height:1.7;margin-top:5px}
.v2-feed-row>.btn{padding:0 10px;min-width:60px;height:44px;font-size:11.5px;flex:none;margin-top:4px}
.v2-feed-description{font-size:13px;line-height:1.85;color:var(--text-2);margin-bottom:13px}
.v2-import-body{padding-top:10px}
.v2-import-tabs{margin-bottom:15px}
.v2-import-tabs button{min-height:44px;font-size:12px}
.v2-import-form{padding:15px}
.v2-import-form textarea{min-height:160px;max-height:330px;font-size:14px;line-height:1.8;font-family:var(--font-en)}
.v2-import-form .field>label{font-size:12px;min-height:22px}
.v2-import-form .field>label>span{font-size:11px}
.v2-import-form>.btn{margin-top:12px}
.v2-share-guide{display:flex;gap:9px;padding:14px 0 0;align-items:flex-start;color:var(--text-2)}
.v2-share-guide svg{flex:none;margin-top:3px;color:var(--accent)}
.v2-share-guide p{font-size:12px;line-height:1.85}
.v2-import-loading{color:var(--accent);font-size:12px;line-height:1.7;padding:13px 0 3px}
.v2-import-preview-body{padding-top:9px}
.v2-import-preview{padding:17px}
.v2-import-preview>h1{font-size:23px;line-height:1.4;font-weight:500;margin:12px 0 17px;overflow-wrap:break-word}
.v2-import-preview .v2-preview-prose{padding-bottom:0}
.v2-preview-actions{display:flex;flex-direction:column;gap:10px;margin-top:17px}
.v2-search-body{padding-top:8px}
.v2-search-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:13px}
.v2-search-input{display:block;position:relative;flex:1;min-width:0}
.v2-search-input>svg{position:absolute;left:13px;top:15px;color:var(--text-3);pointer-events:none}
.v2-search-input>.inp{height:46px;padding-left:37px;border-radius:var(--r-pill);font-size:13px}
.v2-search-clear{display:grid;place-items:center;width:44px;height:44px;flex:none;background:var(--surface);border:1px solid var(--border);border-radius:50%;color:var(--text-3)}
.v2-search-start{margin:18px 1px 23px;color:var(--text-3);font-size:12.5px;line-height:1.85}
.v2-search-suggestions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.v2-search-suggestions .chip{min-height:44px;font-family:var(--font-en);font-size:14px}
.v2-search-total{font-size:12px;color:var(--text-3);line-height:1.7;padding:0 1px;margin:8px 0 4px}
.v2-search-result{align-items:flex-start;padding:14px;gap:10px}
.v2-search-result>.tx{min-width:0;flex:1}
.v2-search-result .tx>b{font-size:15px;line-height:1.65;font-weight:500;white-space:normal;overflow-wrap:break-word}
.v2-search-result .tx>small{font-size:12px;line-height:1.65;margin-top:5px;white-space:normal;overflow-wrap:break-word}
.v2-search-result .tx>.v2-result-source{font-size:10.5px;line-height:1.65;margin-top:7px;color:var(--text-3)}
.v2-search-result>svg{flex:none;align-self:center;color:var(--text-4)}
.v2-search-mark{background:var(--accent-soft);color:var(--accent);border-radius:2px;padding:0 1px}
.v2-more-results{margin-top:9px;font-size:12px;height:44px;color:var(--accent)}
.v2-empty{padding:23px 16px;text-align:center;color:var(--text-3)}
.v2-empty h3{font-size:15px;line-height:1.55;color:var(--text-2);font-weight:600;margin-bottom:9px}
.v2-empty p{font-size:12px;line-height:1.85;margin-bottom:15px}
.v2-empty .btn{font-size:12px;max-width:100%}
@media(max-width:370px){.v2-welcome-body{padding-left:16px;padding-right:16px}.v2-welcome-intro h1{font-size:35px}.v2-first-steps{font-size:10.5px;gap:4px}.v2-code-row .btn{width:103px}.v2-auth-card{padding:13px}.v2-goal-option{gap:9px;padding:14px 11px}.v2-book-card{padding:13px}.v2-book-summary{gap:11px}.v2-book-summary h2{font-size:17px}.v2-book-actions .btn{padding:0 10px}.v2-book-actions .v2-link{flex-basis:100%;min-height:36px}.v2-feed-row{padding:13px 11px;gap:8px}.v2-feed-row>.ic{display:none}.v2-theme-options{gap:6px}.v2-filter-row .chip{padding:0 11px}}
@media(max-height:800px) and (min-width:600px){.v2-welcome-body{padding-top:58px}.v2-welcome-intro{margin:17px 0 14px}.v2-welcome-intro h1{font-size:35px}.v2-starter-card{padding:13px}.v2-starter-card h2{font-size:20px;margin-top:9px}.v2-welcome-actions{margin-top:13px}.v2-welcome-actions>.v2-local-caption{font-size:10.5px;margin:5px 0 8px}}

/* Keep the original gray-green surfaces and reserve indigo for the learner's voice. */
.v2-sp-home .card { margin-bottom: 12px; }
.v2-sp-overline { color: var(--text-3); font-size: 11.5px; line-height: 1.5; margin-bottom: 8px; }
.v2-sp-start, .v2-sp-resume { padding: 18px 16px 10px; }
.v2-sp-start h3, .v2-sp-resume h3 { font-size: 20px; line-height: 1.4; margin-bottom: 6px; }
.v2-sp-start p, .v2-sp-resume p { color: var(--text-2); font-size: 13px; line-height: 1.65; margin-bottom: 14px; }
.v2-sp-resume { background: var(--accent-soft); border-color: var(--accent-line); }
.v2-sp-word-choices { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.v2-sp-word-choice { display: flex; align-items: center; gap: 8px; min-height: 44px; max-width: 100%; padding: 8px 12px; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--surface); }
.v2-sp-word-choice b { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; text-align: left; }
.v2-sp-word-choice svg { flex: none; color: var(--voice); }
.v2-sp-text-action { display: flex; justify-content: center; align-items: center; min-height: 44px; width: 100%; color: var(--accent); font-size: 13px; padding: 10px 8px; }
.v2-sp-empty { padding: 22px 18px; color: var(--text-3); line-height: 1.7; font-size: 13px; }
.v2-sp-empty .btn { margin-top: 14px; }
.v2-sp-scene-list .row-li, .v2-sp-results .row-li { min-height: 72px; }
.v2-sp-scene-list .tx small { margin-top: 5px; }
.v2-sp-scene-list .tag { flex: none; max-width: 70px; white-space: normal; text-align: center; }
.v2-sp-end { min-width: 44px; min-height: 44px; color: var(--text-2); font-size: 13px; }
.v2-sp-progress { display: flex; align-items: center; gap: 12px; padding: 2px 18px 12px; flex: none; }
.v2-sp-progress .pbar { flex: 1; }
.v2-sp-progress > span { white-space: nowrap; color: var(--text-3); font-size: 11.5px; }
.v2-practice .vbody { padding: 0 16px 166px; }
.v2-sp-notice { display: flex; gap: 8px; padding: 9px 10px; margin-bottom: 12px; background: var(--surface-2); border-radius: 10px; color: var(--text-3); font-size: 12px; line-height: 1.55; }
.v2-sp-notice svg { flex: none; margin-top: 2px; }
.v2-sp-prompt { padding: 16px; }
.v2-sp-target { font-size: 28px; line-height: 1.3; color: var(--accent); overflow-wrap: anywhere; margin-bottom: 12px; }
.v2-sp-question { font-size: 21px; line-height: 1.5; overflow-wrap: anywhere; }
.v2-sp-prompt-tools { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 7px; }
.v2-sp-audio-link { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 7px 2px; color: var(--accent); font-size: 12.5px; }
.v2-sp-cn { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 3px; color: var(--text-2); font-size: 13px; line-height: 1.65; }
.v2-sp-hints { margin: 12px 0; border: 1px dashed var(--border-strong); background: var(--surface-2); border-radius: var(--r-md); overflow: hidden; }
.v2-sp-hint-toggle { display: flex; gap: 8px; align-items: center; padding: 11px 12px; width: 100%; min-height: 46px; font-size: 13px; text-align: left; }
.v2-sp-hint-toggle small { margin-left: auto; color: var(--text-3); font-size: 10.5px; }
.v2-sp-hint-line { border-top: 1px dashed var(--border); padding: 11px 12px; }
.v2-sp-hint-line small, .v2-sp-draft label { display: block; color: var(--text-3); font-size: 11.5px; margin-bottom: 5px; }
.v2-sp-hint-line p { font-size: 13px; line-height: 1.6; }
.v2-sp-hint-line p.en { font-size: 17px; overflow-wrap: anywhere; }
.v2-sp-hint-line .btn { margin-top: 8px; }
.v2-sp-compact { min-height: 44px; height: auto; padding: 9px 12px; font-size: 12.5px; font-weight: 500; }
.v2-sp-draft { margin: 16px 0 4px; }
.v2-sp-answer-input { color: var(--voice); font-size: 18px; line-height: 1.55; padding: 13px; resize: vertical; min-height: 118px; max-height: 210px; }
.v2-sp-answer-input:focus { border-color: var(--voice); outline-color: var(--voice); }
.v2-sp-error { color: var(--bad); font-size: 12px; line-height: 1.55; margin: 7px 0; min-height: 0; }
.v2-sp-error:empty { display: none; }
.v2-sp-skip { display: block; padding: 10px 12px; min-height: 44px; margin: 7px auto 0; color: var(--text-3); font-size: 12px; }
.v2-sp-dock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 15; padding: 13px 16px 27px; background: var(--surface); border-top: 1px solid var(--border); }
.v2-sp-dock > p { text-align: center; color: var(--text-3); font-size: 11.5px; line-height: 1.5; margin-top: 9px; }
.v2-sp-mic-row { display: grid; grid-template-columns: 1fr 64px 1fr; align-items: center; gap: 10px; }
.v2-sp-mic-row .btn { padding-left: 10px; padding-right: 10px; }
.v2-sp-mic { position: relative; width: 64px; height: 64px; border-radius: 50%; background: var(--voice); color: #fff; display: grid; place-items: center; box-shadow: 0 5px 14px rgba(76, 95, 240, .18); }
.v2-sp-recording::before { content: ''; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--voice); opacity: .3; animation: pulse 1.4s ease-out infinite; }
.v2-sp-stop { width: 19px; height: 19px; background: #fff; border-radius: 4px; }
.v2-sp-timer { font-variant-numeric: tabular-nums; text-align: center; color: var(--voice); font-weight: 600; font-size: 17px; }
.v2-sp-wave { display: flex; gap: 4px; justify-content: center; align-items: center; height: 30px; margin-bottom: 8px; }
.v2-sp-wave i { width: 3px; border-radius: 3px; background: var(--voice); animation: wv 1s ease-in-out infinite; }
.v2-sp-actions { display: flex; gap: 8px; }
.v2-sp-actions .btn { flex: 1; min-width: 0; white-space: normal; text-align: center; }
.v2-sp-checking { display: flex; align-items: center; flex-wrap: wrap; justify-content: center; gap: 10px; padding-top: 24px; }
.v2-sp-checking > p { width: 100%; margin-top: 0; }
.v2-sp-checking b { font-size: 14px; font-weight: 500; }
.v2-sp-spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
.v2-sp-feedback { margin-top: 16px; }
.v2-sp-answer { color: var(--voice); background: var(--voice-soft); padding: 13px 14px; border-radius: 14px 14px 5px 14px; font-size: 18px; line-height: 1.55; overflow-wrap: anywhere; }
.v2-sp-verdict { display: flex; gap: 8px; padding: 12px 3px; font-size: 12.5px; line-height: 1.6; color: var(--text-2); }
.v2-sp-verdict svg { flex: none; margin-top: 3px; }
.v2-sp-good { color: var(--accent); }
.v2-sp-correction { padding: 16px; margin: 10px 0 14px; }
.v2-sp-correction > small { color: var(--text-3); font-size: 11px; }
.v2-sp-original { color: var(--voice); font-size: 16px; line-height: 1.55; margin: 4px 0 12px; overflow-wrap: anywhere; }
.v2-sp-improved { font-size: 18px; line-height: 1.55; margin-top: 4px; overflow-wrap: anywhere; }
.v2-sp-explain { color: var(--text-2); font-size: 12.5px; line-height: 1.65; margin: 10px 0 14px; }
.v2-sp-save { display: flex; align-items: center; gap: 7px; justify-content: center; width: 100%; min-height: 44px; padding: 9px 2px; color: var(--accent); font-size: 12px; margin-top: 7px; }
.v2-sp-retry { margin-top: 10px; }
.v2-sp-no-fix { padding: 15px; margin: 12px 0; }
.v2-sp-no-fix b { font-size: 14px; }
.v2-sp-no-fix p { font-size: 12.5px; color: var(--text-3); line-height: 1.65; margin: 7px 0 12px; }
.v2-sp-previous { margin-bottom: 12px; border-left: 2px solid var(--border-strong); padding-left: 12px; }
.v2-sp-previous small { font-size: 11px; color: var(--text-3); }
.v2-sp-previous p { color: var(--voice); font-size: 14px; line-height: 1.5; margin-top: 4px; }
.v2-sp-retry-guide { padding: 12px; margin-top: 12px; background: var(--accent-soft); border-radius: 12px; }
.v2-sp-retry-guide small { color: var(--text-3); font-size: 11px; }
.v2-sp-retry-guide p { font-size: 17px; line-height: 1.55; margin-top: 5px; }
.v2-sp-recap-body { padding-bottom: 126px; }
.v2-sp-recap-hero { text-align: center; padding: 18px 14px; }
.v2-sp-recap-icon { width: 42px; height: 42px; border: 1px solid var(--accent-line); border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin: 0 auto 12px; }
.v2-sp-recap-hero h3 { font-size: 19px; line-height: 1.4; }
.v2-sp-recap-hero p { color: var(--text-3); font-size: 12.5px; margin: 8px 0 16px; }
.v2-sp-summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); padding-top: 14px; border-top: 1px solid var(--border); }
.v2-sp-summary-grid > div + div { border-left: 1px solid var(--border); }
.v2-sp-summary-grid b { display: block; font-size: 23px; font-weight: 600; }
.v2-sp-summary-grid small { color: var(--text-3); font-size: 11.5px; }
.v2-sp-result-icon { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--surface-2); flex: none; }
.v2-sp-results .tx small { margin-top: 4px; }
.v2-sp-collect { margin-top: 10px; }
.v2-sp-history-meta { color: var(--text-3); font-size: 12px; line-height: 1.6; margin-bottom: 14px; }
.v2-sp-history-turn { padding: 16px; margin-bottom: 12px; }
.v2-sp-history-turn > small { color: var(--text-3); font-size: 11px; }
.v2-sp-history-question { font-size: 17px; line-height: 1.55; margin: 6px 0 16px; }
.v2-sp-permission-icon { width: 50px; height: 50px; border-radius: 15px; display: grid; place-items: center; color: var(--voice); background: var(--voice-soft); margin-bottom: 14px; }
.v2-sp-sheet-copy { font-size: 13px; line-height: 1.65; color: var(--text-2); margin-top: 8px; }
.v2-sp-permission-option { display: flex; gap: 9px; padding: 12px 0 18px; font-size: 13px; line-height: 1.65; color: var(--text-2); }
.v2-sp-permission-option svg { flex: none; margin-top: 3px; }
.v2-sp-sheet-secondary { margin-top: 10px; }
.v2-sp-seg button { min-height: 44px; }
.v2-sp-pron-word { font-size: 28px; line-height: 1.35; overflow-wrap: anywhere; }
.v2-sp-pron-ph { color: var(--text-3); font-size: 14px; margin-top: 6px; }
.v2-sp-pron-actions { margin-top: 15px; }
.v2-sp-pron-sentence { padding: 14px; margin: 15px 0; background: var(--surface-2); border-radius: 12px; }
.v2-sp-pron-sentence small { color: var(--text-3); font-size: 11px; }
.v2-sp-pron-sentence p { font-size: 18px; line-height: 1.55; margin-top: 7px; overflow-wrap: anywhere; }
@media (max-width: 360px) {
  .v2-sp-mic-row { gap: 6px; grid-template-columns: 1fr 60px 1fr; }
  .v2-sp-mic { width: 60px; height: 60px; }
  .v2-sp-mic-row .btn { font-size: 11.5px; padding-left: 7px; padding-right: 7px; }
  .v2-sp-hint-toggle small { font-size: 10px; }
  .v2-sp-prompt { padding: 14px; }
  .v2-sp-question { font-size: 20px; }
}

.v2-learning-body{padding-bottom:24px}

.v2-due-card>p{font-size:12.5px;line-height:1.7;color:var(--text-2)}
.v2-review-modes{display:flex;gap:6px;margin-top:17px;flex-wrap:wrap}

.v2-due-card .v2-mode-description{margin:8px 0 15px;font-size:12px;color:var(--text-3)}

.v2-resume-review{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px;padding:13px 12px;border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r-md);margin-bottom:12px;text-align:left}
.v2-resume-review span,.v2-resume-review b{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--accent)}

.v2-reinforcement>p{font-size:12.5px;line-height:1.7;color:var(--text-2);margin:5px 0}
.v2-learning-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:16px 0 10px;font-size:13px}

.v2-reinforcement .v2-learning-title{margin-top:0}
.v2-wait-word{width:100%;min-height:48px;display:flex;align-items:center;gap:9px;text-align:left;border-top:1px solid var(--border);font-size:15px}
.v2-wait-word .en{flex:1;min-width:0;overflow-wrap:anywhere}
.v2-wait-word small{font-size:11px;color:var(--text-3)}
.v2-next-review{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px;margin-top:12px;text-align:left;min-height:70px}

.v2-next-review small{display:block;font-size:11.5px;line-height:1.7;color:var(--text-3);margin-top:5px}
.v2-schedule-list button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:68px;padding:12px 0;text-align:left;border-top:1px solid var(--border)}
.v2-schedule-list button:first-child{border-top:0}
.v2-schedule-list b{display:block;font-size:18px;line-height:1.5;overflow-wrap:anywhere}
.v2-schedule-list small{display:block;font-size:12px;line-height:1.7;color:var(--text-3);margin-top:4px}
.v2-word-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:0;margin-top:14px}
.v2-word-stats button{min-height:80px;padding:14px 6px;text-align:center;display:flex;flex-direction:column;gap:5px;align-items:center}
.v2-word-stats button+button{border-left:1px solid var(--border)}
.v2-word-stats small{font-size:11.5px;color:var(--text-2)}
.v2-word-stats b{font-size:28px;line-height:1;color:var(--accent)}
.v2-reminder-row{width:100%;min-height:48px;display:flex;align-items:center;gap:9px;padding:12px 0;border-top:1px solid var(--border);margin-top:20px;color:var(--text-2);font-size:12.5px;text-align:left}
.v2-reminder-row span{flex:1}
.v2-reminder-row>svg:last-child{margin-left:auto}
.v2-review-preview{padding:0 14px}
.v2-review-preview button{min-height:64px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;border-top:1px solid var(--border)}
.v2-review-preview button:first-child{border-top:0}
.v2-review-preview button>span:first-child{min-width:0}
.v2-review-preview b,.v2-review-preview small{display:block;overflow-wrap:anywhere}
.v2-review-preview b{font-size:16px}
.v2-review-preview small{font-size:11.5px;margin-top:3px;color:var(--text-3)}
.v2-word-search{display:flex;align-items:center;gap:7px;padding:0 12px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-md);min-height:48px}

.v2-word-search button{min-width:44px;min-height:44px;display:grid;place-items:center;margin-right:-9px;color:var(--text-3)}
.v2-word-tools{display:flex;align-items:center;justify-content:space-between;gap:9px;margin:10px 0 12px}
.v2-word-tools label{font-size:11.5px;color:var(--text-3);display:flex;align-items:center;gap:7px}
.v2-word-tools select{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);min-height:44px;padding:7px;font:12px var(--font-ui);color:var(--text-2);max-width:132px}
.v2-word-tools .btn{font-size:12px;padding:8px 10px}
.v2-learning-filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.v2-learning-filters .chip{font-size:11.5px;padding:8px 10px;min-height:44px}
.v2-clear-filters{min-height:44px;padding:7px 9px;font-size:12px;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.v2-result-count{font-size:11.5px;color:var(--text-3);margin:15px 0 8px}
.v2-word-list{padding:0 14px}
.v2-word-item{display:block;width:100%;text-align:left;padding:16px 0;border-top:1px solid var(--border)}
.v2-word-item:first-child{border-top:0}
.v2-word-line{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;width:100%}
.v2-word-line>b{font-size:21px;line-height:1.35;letter-spacing:-.3px;flex:1;min-width:0;overflow-wrap:anywhere}
.v2-word-line>svg{flex:none;margin-top:5px;color:var(--text-3)}
.v2-word-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:5px}
.v2-word-meta>.en{font-size:12px;line-height:1.7;color:var(--text-3);overflow-wrap:anywhere}
.v2-word-meta .tag{font-size:10.5px;line-height:1.45;white-space:nowrap}
.v2-word-definition{display:block;font-size:13px;line-height:1.75;color:var(--text-2);margin-top:9px}
.v2-word-origin{display:block;font-size:11px;line-height:1.65;color:var(--text-3);margin-top:7px}

.v2-word-context .btn{margin-top:12px;font-size:12px;padding:8px}
.v2-word-personal{padding:12px 14px}
.v2-word-personal p{font-size:13px;line-height:1.8;color:var(--text-2);white-space:pre-wrap}

.v2-word-practice{margin-top:20px}
.v2-word-remove{margin-top:10px;color:var(--text-3);font-size:12.5px}

.v2-review-wave i:nth-child(3){height:26px;animation-delay:.4s}

function v2ReaderTerms(doc){
  const list=[...(doc?.terms||[])];
  for(const word of INITIAL_WORDBOOK){if(doc?.sents.some(sentence=>sentence[0].toLowerCase().includes(word.w.toLowerCase()))&&!list.some(term=>term.w.toLowerCase()===word.w.toLowerCase()))list.push({w:word.w,ph:word.ph,pos:word.pos,type:word.type});}
  return list;
}
function v2RegexEscape(text){return String(text).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function v2MarkedSentence(doc,index){
  const text=doc.sents[index][0],terms=v2ReaderTerms(doc).sort((a,b)=>b.w.length-a.w.length);
  if(!terms.length)return esc(text);
  const pattern=new RegExp('\\b(?:'+terms.map(term=>v2RegexEscape(term.w)).join('|')+')\\b','gi');
  let html='',cursor=0;
  for(const match of text.matchAll(pattern)){const term=terms.find(item=>item.w.toLowerCase()===match[0].toLowerCase());html+=esc(text.slice(cursor,match.index))+`<span class="v2-inline-term" data-act="read-lookup" data-w="${esc(term.w)}" data-doc="${esc(doc.id)}" data-index="${index}" role="button" tabindex="0">${esc(match[0])}</span>`;cursor=match.index+match[0].length;}
  return html+esc(text.slice(cursor));
}

/* 欢迎、账号与内容获取。所有状态由共享渲染器保存；不启动页面。 */
const V2_DEMO_PASSWORD = 'Learn2026';
let v2SessionPassword = '';
function v2LoginState() {
  const lg = APP.ui.login;
  if (!lg.intent) lg.intent = 'new';
  if (lg.mode === 'pwd') lg.mode = 'password';
  return lg;
}
function v2Intent(intent) { return ({save:'upgrade',returning:'relay',computer:'relay'})[intent] || intent; }
function v2Books() { return Array.isArray(BOOKS) ? BOOKS : Object.values(BOOKS); }
function v2Feeds() { return Array.isArray(FEEDS) ? FEEDS : Object.values(FEEDS); }
function v2Book(id) { return v2Books().find(b => b.id === id); }
function v2Feed(id) { return v2Feeds().find(f => f.id === id); }
function v2Button(label, act, attrs='', style='') {
  return `<button class="btn ${style}" data-act="${act}" ${attrs}>${label}</button>`;
}
function v2Hint(text, cls='') { return `<div class="v2-inline-note ${cls}">${text}</div>`; }
function v2Error(text) { return text ? `<p class="v2-form-error" role="alert">${I('info','sm')}${esc(text)}</p>` : ''; }
function v2ValidAccount(value) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value) || /^\+?\d{9,15}$/.test(value.replace(/[\s-]/g,'')); }
function v2AccountInput(lg, prefix='login') {
  return `<div class="field"><label for="v2-${prefix}-account">邮箱或手机号</label><input class="inp" id="v2-${prefix}-account" type="text" inputmode="${/^\+?\d/.test(lg.account) ? 'tel' : 'email'}" autocomplete="username" data-inp="login-account" value="${esc(lg.account)}" placeholder="name@example.com / 手机号"></div>`;
}
function v2AuthAccount() { return v2LoginState().account.trim(); }
function v2OtpWait() { if (APP.ui.demo.otpExpired) return 0; return Math.max(0, Math.ceil(((v2LoginState().sentUntil || 0) - now()) / 1000)); }
function v2SendLabel() { const lg=v2LoginState(); return lg.sending ? '发送中…' : v2OtpWait() ? `${v2OtpWait()} 秒后重发` : lg.sentAt ? '重新获取' : '获取验证码'; }
function v2SetAuthError(text, field='') { const lg=v2LoginState(); lg.error=text; lg.errorField=field; }
function v2OtpFields(prefix='login') {
  const lg=v2LoginState(), waiting=v2OtpWait()>0 || lg.sending;
  return `${v2AccountInput(lg,prefix)}<div class="field"><label for="v2-${prefix}-code">验证码${lg.sentAt ? `<span>请查看 ${esc(lg.sentAccount)}</span>` : '<span>6 位数字</span>'}</label><div class="code-row v2-code-row"><input class="inp" id="v2-${prefix}-code" data-inp="login-code" value="${esc(lg.code)}" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="输入验证码"><button class="btn" data-act="send-code" ${waiting?'disabled':''}>${v2SendLabel()}</button></div><button class="v2-link" data-act="auth-code-help">收不到验证码？</button></div>`;
}
function beginLogin(intent='upgrade') {
  const lg=v2LoginState();
  lg.intent=v2Intent(intent);
  lg.origin=lg.intent==='upgrade' ? captureSource(sourceLabel()) : null;
  lg.firstUse=!APP.started;
  lg.error=''; lg.errorField=''; lg.qrStep=0; lg.codeRequest=null; lg.sending=false;

function v2StartGuest() {
  APP.started=true; APP.persona='guest'; APP.sync='local';
  APP.profile={name:'学习者',account:''};
  APP.ui.goalOrigin=null;
  switchTab('read'); nav('goal',{first:true});

function v2CompleteLogin(account) {
  const lg=v2LoginState(), selectedIntent=v2Intent(lg.intent), intent=lg.mode==='qr' && selectedIntent!=='upgrade'?'relay':selectedIntent, origin=lg.origin;
  const localProgress=JSON.parse(JSON.stringify(APP.progress)), localReader={...APP.reader};
  const localBooks=[...APP.library.books], localDocs=[...APP.library.docs], localImports=[...APP.importedDocs];
  APP.started=true; APP.persona='member';
  if (intent==='relay' || lg.mode==='qr') {
    seedReturningData();
    const usefulProgress=Object.fromEntries(Object.entries(localProgress).filter(([id,p])=>p.lastAt || p.completed || p.index>0 || intent==='upgrade' && id===localReader.docId));
    APP.progress={...APP.progress,...usefulProgress};
    APP.library.books=[...new Set([...APP.library.books,...localBooks])];
    APP.library.docs=[...new Set([...APP.library.docs,...localDocs])];
    const mergedImports=new Map(APP.importedDocs.map(d=>[d.id,d]));
    localImports.forEach(d=>mergedImports.set(d.id,d)); APP.importedDocs=[...mergedImports.values()];
    if (intent==='upgrade') APP.reader=localReader;
  }
  APP.profile={name:account.includes('@') ? account.split('@')[0].slice(0,16) : '学习者',account};
  APP.persona='member'; APP.sync=APP.offline ? 'pending' : 'synced'; APP.lastSyncedAt=now();
  lg.error=''; lg.code=''; lg.password=''; lg.sentUntil=0; lg.sentAt=0; lg.codeRequest=null; lg.tickRequest=null; lg.sending=false; lg.origin=null;
  if (intent==='upgrade' && origin) {
    restoreSource(origin);
    toast(APP.offline ? '已登录，本机记录已保留，联网后继续同步' : '本机学习记录已保留，可以继续刚才的学习');
  } else if (intent==='relay') {

function v2TickOtp(appRef, token, routeKey) {
  setTimeout(()=>{
    if (APP!==appRef || APP.ui.login.tickRequest!==token || currentRoute().key!==routeKey || currentRoute().name!=='login') return;
    if (v2OtpWait()>0) v2TickOtp(appRef,token,routeKey); else APP.ui.login.tickRequest=null;
    render();
  },1000);
}
function v2SendCode() {
  const lg=v2LoginState(), account=v2AuthAccount();
  if (!v2ValidAccount(account)) { v2SetAuthError('请填写有效的邮箱或手机号。','account'); return; }
  if (APP.offline) { v2SetAuthError('当前无法连接。记录仍保存在本机，你可以先继续体验。'); return; }
  if (v2OtpWait()>0 || lg.sending) return;
  const appRef=APP, token=uid('code-request'), routeKey=currentRoute().key;
  lg.codeRequest=token; lg.sending=true; lg.error='';
  setTimeout(()=>{
    if (APP!==appRef || APP.ui.login.codeRequest!==token || currentRoute().key!==routeKey || currentRoute().name!=='login') return;
    lg.sending=false; lg.sentAccount=account; lg.sentAt=now(); lg.sentUntil=now()+30000; lg.codeExpiresAt=now()+300000;
    lg.codeRequest=null; lg.tickRequest=token; APP.ui.demo.otpExpired=false; lg.error='';
    toast('验证码已发送，请查看邮箱或短信','mail'); persist(); render(); v2TickOtp(appRef,token,routeKey);
  },450);
}
function v2VerifyOtp() {
  const lg=v2LoginState();
  if (!v2ValidAccount(v2AuthAccount())) { v2SetAuthError('请填写有效的邮箱或手机号。','account'); return false; }
  if (APP.ui.demo.otpExpired) {v2SetAuthError('验证码已过期，请重新获取。','code');lg.sentUntil=0;return false;}
  if (!lg.sentAt || lg.sentAccount!==v2AuthAccount()) { v2SetAuthError('请先向这个账号获取验证码。','code'); return false; }
  if (APP.ui.demo.otpExpired || now()>(lg.codeExpiresAt||0)) { v2SetAuthError('验证码已过期，请重新获取。','code'); lg.sentUntil=0; return false; }
  if (!/^\d{6}$/.test(lg.code)) { v2SetAuthError('请输入完整的 6 位验证码。','code'); return false; }
  if (lg.code!=='284910') { v2SetAuthError('验证码不正确，请检查后重试。','code'); return false; }
  if (APP.offline) { v2SetAuthError('当前无法验证，请联网后重试。你的输入已保留。'); return false; }
  return true;
}

function v2SearchState() {const s=APP.ui.search;if(!s.limits)s.limits={docs:6,words:6,notes:6};return s;}
function v2SearchContains(q,...values) {return values.some(v=>String(v||'').toLowerCase().includes(q));}
function v2SearchResults(q) {
  const docs=[];
  allDocs().forEach(d=>{
    const titleHit=v2SearchContains(q,d.title,d.cn,d.source);
    const matches=d.sents.map((s,index)=>({kind:'doc',docId:d.id,index,en:s[0],cn:s[1],doc:d})).filter(x=>v2SearchContains(q,x.en,x.cn));
    if (titleHit && !matches.some(x=>x.index===0)) docs.push({kind:'doc',docId:d.id,index:0,en:d.title,cn:d.cn||'按标题或来源匹配',doc:d});
    docs.push(...matches);
  });
  const words=APP.words.filter(w=>v2SearchContains(q,w.w,w.pos,w.cn,w.note,w.sent,w.src));
  const notes=APP.notes.filter(n=>v2SearchContains(q,n.title,n.text,n.original,n.improved,n.explanation,n.scene,n.src)).map(n=>({...n,kind:n.type==='correction'?'correction':'note'}));
  APP.words.filter(w=>w.note && v2SearchContains(q,w.note,w.w)).forEach(w=>notes.push({kind:'word-note',id:`note-${w.id}`,wordId:w.id,title:w.w,text:w.note,createdAt:w.createdAt}));

function v2Highlight(text,q) {
  const source=String(text||''), lower=source.toLowerCase(), at=lower.indexOf(q);
  let start=source.length>155 && at>65 ? at-45 : 0, chunk=source.slice(start,start+160), prefix=start?'…':'';

  const index=chunk.toLowerCase().indexOf(q);
  return prefix+(index<0?esc(chunk):`${esc(chunk.slice(0,index))}<mark class="v2-search-mark">${esc(chunk.slice(index,index+q.length))}</mark>${esc(chunk.slice(index+q.length))}`)+(start+160<source.length?'…':'');
}
