function v2SpUI() {
  if (!APP.ui.speaking) APP.ui.speaking = { customScenes: [], sceneDraft: { title: '', goal: '' } };
  return APP.ui.speaking;
}
function v2SpMicAllowed() { return ['granted', 'allowed'].includes(APP.ui.permissions.mic) && !APP.ui.demo.micDenied; }
function v2SpNorm(value) {
  return String(value || '').replace(/[’‘]/g, "'").toLowerCase().replace(/[^a-z0-9'\s]/g, ' ').replace(/\s+/g, ' ').trim();
}
function v2SpTokens(value) { return v2SpNorm(value).match(/[a-z]+(?:'[a-z]+)?/g) || []; }
function v2SpHasWord(answer, word) {
  const needle = v2SpNorm(word);
  return !!needle && (' ' + v2SpNorm(answer) + ' ').includes(' ' + needle + ' ');
}
function v2SpTime(seconds) {
  const value = Math.max(0, Math.floor(seconds || 0));
  return Math.floor(value / 60) + ':' + String(value % 60).padStart(2, '0');
}
function v2SpCurrentTurn(p = APP.practice) { return p && p.turns.find(t => t.id === p.feedbackTurnId); }
function v2SpSession(id) {
  const session = APP.sessions.find(s => s.id === id);
  if (!session) return null;
  session.turns = session.turns || [];
  session.turns.forEach((turn, index) => {
    if (!turn.id) turn.id = session.id + '-turn-' + (index + 1);
  });
  session.savedCorrections = session.savedCorrections || {};
  if (!session.steps) session.steps = session.turns.map((turn, index) => ({ id: turn.stepId || turn.id, title: '第 ' + (index + 1) + ' 次回答', status: 'answered', matched: !!turn.matched }));
  if (!session.summary) session.summary = { total: session.steps.length, answered: session.turns.length, matched: session.steps.filter(step => step.matched).length, skipped: 0, pending: 0 };
  return session;
}
function v2SpSummary(p) {
  const steps = p && p.steps || [];
  const answered = steps.filter(s => s.status === 'answered').length;
  const matched = steps.filter(s => s.matched).length;
  const skipped = steps.filter(s => s.status === 'skipped').length;
  return { total: steps.length, answered, matched, skipped, pending: steps.length - answered - skipped };
}
function v2SpWordExample(word, doc, index, item) {
  const examples = {
    'take a break': 'I need to take a break.', 'clear my head': 'A short walk helps me clear my head.',
    'quiet': 'I like a quiet place to read.', 'dreamy': 'The garden looks dreamy in the morning.',
    'volunteers': 'Two volunteers helped at the event.', 'standardize': 'We need to standardize the process.',
    'inconsistent with': 'This address is inconsistent with the map.', 'sank upon one knee': 'He sank upon one knee beside the chair.'
  };
  if (examples[v2SpNorm(word)]) return examples[v2SpNorm(word)];
  if (item && item.sent && v2SpHasWord(item.sent, word)) return item.sent;
  const source = doc && doc.sents.find(s => v2SpHasWord(s[0], word));

        { key: 'custom-detail', title: '补充一个具体细节', prompt: 'Could you share one specific detail?', cn: '补充一个具体细节，例如行动、时间或原因。', thought: '让对方知道具体准备怎么做。', pattern: 'We can ____ next week.', example: 'We can start with a small test next week.', test: 'custom' },

function openPronunciation(word = '', docId = null, sentence = null) {
  const p = APP.practice && !APP.practice.finished ? APP.practice : null;
  if (p && p.status === 'recording') v2SpStopRecording(true);
  const step = p ? p.steps[p.index] : null;
  const doc = getDoc(docId || (p && p.docId) || APP.reader.docId);
  const index = Number.isInteger(sentence) ? sentence : step && Number.isInteger(step.sentence) ? step.sentence : p ? p.sentence : doc ? getProgress(doc.id).index : 0;
  const text = step ? step.test === 'word' ? step.example : step.prompt : doc && doc.sents[index] ? doc.sents[index][0] : word;
  const term = word || (p && p.word) || (doc && (doc.terms || []).find(t => v2SpHasWord(text, t.w)) || {}).w || '';
  openSheet('pronunciation', { word: term, text, docId: doc && doc.id, sentence: index, practiceId: p && p.id });
}
SHEETS.pronunciation = params => {
  const item = params.word ? findWord(params.word) : null;
  const info = params.word ? lexiconInfo(params.word, params.docId, params.sentence) : null;
  const ph = item && item.ph || info && info.ph || '';
  const points = { 'guide': '留意末尾的 /d/：舌尖轻抵上齿龈，给单词一个清楚的收尾。', 'quiet': 'quiet 有两个音节。先听词音，分开模仿，再自然连起来。', 'take a break': '把重音放在 break 上；take a 可以轻轻连起来读。', 'clear my head': 'clear 和 head 是重点；my 轻一些，整组表达连起来说。', 'dreamy': '重音放在第一个音节；末尾的音轻一些，跟着示范模仿。' };
  const point = points[v2SpNorm(params.word)] || '先听词音里的重音，再把表达放回整句。照着示范模仿一次，最后用自己的速度重说。';
  const p = APP.practice && APP.practice.id === params.practiceId ? APP.practice : null;
  const turn = p && v2SpCurrentTurn(p);
  return `<div class="sh-head"><div class="v2-sp-overline">当前表达的发音强化</div><h3 class="en v2-sp-pron-word">${esc(params.word || '跟读这句')}</h3>${ph ? `<p class="v2-sp-pron-ph">${esc(ph)}</p>` : ''}</div><div class="sh-body"><p class="v2-sp-sheet-copy">${esc(point)}</p>${params.word ? `<div class="v2-sp-actions v2-sp-pron-actions"><button class="btn" data-act="v2-sp-pron-audio" data-v="word">${I('spk', 'sm')}听词音</button><button class="btn" data-act="v2-sp-pron-audio" data-v="slow">${I('wave', 'sm')}慢速示范</button></div>` : ''}<div class="v2-sp-pron-sentence"><small>回到这句里读</small><p class="en">${esc(params.text)}</p><button class="v2-sp-audio-link" data-act="v2-sp-pron-audio" data-v="sentence">${I('spk', 'sm')}听整句</button></div>${turn ? `<button class="btn block" data-act="v2-sp-turn-audio" data-id="${p.id}" data-v="${turn.id}" data-w="answer">${I('spk', 'sm')}听我刚才的回答</button>` : ''}<button class="btn voice block v2-sp-sheet-secondary" data-act="v2-sp-pron-repeat">${I('mic', 'sm')}${p ? '回去重说这句' : '跟读这个表达'}</button></div>`;
};

function ensureReviewForWord(word) {

}

}
function v2ReviewWaiting() {
  return APP.reviews.filter(r => {

function v2ScheduledReviews() {

function v2LearningMarkdown() {
  const md = text => String(text || "").replace(/[\\`*_[\]]/g, "\\$&");
  const lines = ["# 我的学习记录", "", `导出时间：${timeLabel(now())}`, "", "## 生词本", ""];
  for (const w of APP.words) {
    lines.push(`### ${md(w.w)}`, "", `${md(w.ph)} ${md(w.pos)}`, "", `阶段：${md(w.stage)}${w.paused ? "（已暂停复习）" : ""}`, "", `来源：${md(w.src || "手动记录")}`, "", `> ${String(w.sent || "").replace(/\n/g, "\n> ")}`, "");
    if (w.cn) lines.push(md(w.cn), "");
    if (w.note) lines.push(`助记：${md(w.note)}`, "");
    if (w.example) lines.push(`我的例句：${md(w.example)}`, "");
    lines.push(`复习安排：${md(v2WordStatus(w))}`, "");
  }
  lines.push("## 学习笔记", "");
  for (const n of APP.notes) {
    if (n.type === "correction") lines.push(`### ${md(n.scene || "口语纠偏")}`, "", `原话：${md(n.original)}`, "", `建议：${md(n.improved)}`, "", `原因：${md(n.explanation)}`, "");
    else lines.push(`### ${md(n.title || "学习笔记")}`, "", String(n.text || n.content || ""), "");
  }
  return lines.join("\n");
}
function v2ExportDownload(format) {
  const v = v2LearningState();
  try {
    const json = format === "json", content = json ? JSON.stringify({ version: 2, exportedAt: new Date(now()).toISOString(), words: APP.words, notes: APP.notes, reviews: APP.reviews }, null, 2) : v2LearningMarkdown();
    const date = new Date(now()).toLocaleDateString("sv-SE", { timeZone: "Asia/Shanghai" });
    const filename = `immersive-learning-${date}.${json ? "json" : "md"}`;
    const blob = new Blob([content], { type: json ? "application/json;charset=utf-8" : "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    v.export = { status: "success", message: `已生成 ${filename} 并发起下载。若未保存，可以再次下载。`, format };
    toast("文件已生成，下载已开始");
  } catch (error) {
    v.export = { status: "error", message: "下载没有开始，请重试或改用复制 Markdown。", format, action: "v2-export-download" };
  }
}
async function v2ExportCopy() {

  }

}

  const state={bubble,buttons:[...nav.querySelectorAll('button[data-act="tab"]')],visible:false,ready:false,tab:null,target:null,animation:null,drag:null,frame:0,needsSettle:false,ignoreClickUntil:0,
    reduced:typeof window.matchMedia==='function'?window.matchMedia('(prefers-reduced-motion: reduce)'):{matches:false}};
  GLASS_NAV_STATE.set(nav,state);
  nav.addEventListener('pointerdown',event=>{
    if(!state.ready||nav.hidden||nav.inert||state.drag||event.isPrimary===false||(event.pointerType==='mouse'&&event.button!==0))return;
    state.ignoreClickUntil=0;
    const rect=nav.getBoundingClientRect();
    state.drag={id:event.pointerId,x:event.clientX,y:event.clientY,lastX:event.clientX,moved:false,unit:nav.offsetWidth/rect.width,start:glassNavCurrent(nav,state),targets:state.buttons.map(glassNavButton)};
  });
  nav.addEventListener('pointermove',event=>{
    const drag=state.drag;if(!drag||event.pointerId!==drag.id)return;
    const dx=event.clientX-drag.x,dy=event.clientY-drag.y;

      if(Math.abs(dx)<=7||Math.abs(dx)<=Math.abs(dy)*1.25)return;

      glassNavPlace(state,drag.start);nav.classList.add('v2-nav-dragging');

    const drag=state.drag;if(drag&&!drag.moved&&event.pointerId===drag.id)glassNavRelease(nav,state);
  });

    const drag=state.drag;if(!drag||event.pointerId!==drag.id)return;
    if(drag.moved&&!cancelled){drag.lastX=event.clientX;glassNavDrag(state,drag);}
    glassNavRelease(nav,state);
    if(!drag.moved)return;
    state.ignoreClickUntil=Date.now()+500;state.needsSettle=true;
    if(cancelled){syncGlassNav(nav,state.visible);return;}
    const current=glassNavCurrent(nav,state),center=current.x+current.width/2;
    const closest=drag.targets.reduce((best,target)=>Math.abs(target.x+target.width/2-center)<Math.abs(best.x+best.width/2-center)?target:best);
    switchTab(closest.button.dataset.v);persist();render();
  };
  nav.addEventListener('pointerup',event=>end(event,false));
  nav.addEventListener('pointercancel',event=>end(event,true));
  nav.addEventListener('lostpointercapture',event=>end(event,true));
  nav.addEventListener('click',event=>{

  },true);
  if(typeof ResizeObserver==='function'){
    state.observer=new ResizeObserver(()=>{
      if(!state.ready||nav.hidden||nav.inert)return;
      const drag=glassNavRelease(nav,state);if(drag?.moved)state.needsSettle=true;

    });
    state.observer.observe(nav);state.buttons.forEach(button=>state.observer.observe(button));
  }
  state.reduced.addEventListener?.('change',()=>{
    if(state.reduced.matches)glassNavRelease(nav,state);
    syncGlassNav(nav,state.visible);
  });
  return nav;
}

function syncGlassNav(nav,visible){
  const state=GLASS_NAV_STATE.get(nav);if(!state)return;
  const wasReady=state.ready,blocked=!visible||APP.sheets.length>0;
  state.visible=!!visible;
  if(blocked){glassNavRelease(nav,state);glassNavStop(state);state.ready=false;state.needsSettle=false;state.target=null;}
  nav.hidden=!visible;nav.inert=blocked;
  if(blocked)nav.setAttribute('aria-hidden','true');else nav.removeAttribute('aria-hidden');
  for(const button of state.buttons){
    const active=button.dataset.v===APP.tab;button.classList.toggle('on',active);
    if(active)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');
  }
  const vault=state.buttons.find(button=>button.dataset.v==='vault'),count=typeof dueReviews==='function'?dueReviews().length:0;
  let badge=vault.querySelector('.bdg');
  if(count){if(!badge){badge=document.createElement('span');badge.className='bdg';vault.append(badge);}if(badge.textContent!==String(count))badge.textContent=String(count);}else badge?.remove();
  const active=state.buttons.find(button=>button.dataset.v===APP.tab)||state.buttons[0],target=glassNavButton(active);
  if(!visible||!nav.isConnected||!target.width)return;
  if(blocked){glassNavPlace(state,target);state.tab=APP.tab;return;}
  if(state.drag&&state.tab===APP.tab)return;
  if(state.drag){const drag=glassNavRelease(nav,state);if(drag?.moved)state.needsSettle=true;}
  const same=state.target&&['x','y','width','height'].every(key=>Math.abs(state.target[key]-target[key])<.5);
  if(wasReady&&state.tab===APP.tab&&same&&!state.needsSettle&&!state.reduced.matches)return;
  const from=wasReady?glassNavCurrent(nav,state):target;
  glassNavStop(state);state.ready=true;state.tab=APP.tab;state.target=target;state.needsSettle=false;
  glassNavPlace(state,target);
  if(!wasReady||state.reduced.matches||typeof state.bubble.animate!=='function')return;
  const bounds=state.buttons.map(glassNavButton),min=bounds[0].x,max=bounds.at(-1).x+bounds.at(-1).width;
  const delta=target.x-from.x,direction=Math.sign(delta),clamp=(x,width)=>Math.max(min,Math.min(max-width,x));
  const frame=(x,width,scaleY,offset)=>({transform:`translateX(${clamp(x,width)}px) scaleX(${width/target.width}) scaleY(${scaleY})`,offset});
  const middleWidth=(from.width+(target.width-from.width)*.65)*1.08;
  const animation=state.bubble.animate([
    {transform:`translateX(${from.x}px) scaleX(${from.width/target.width}) scaleY(${from.height/target.height})`,offset:0,easing:'cubic-bezier(.22,.76,.28,1)'},
    {...frame(from.x+delta*.65,middleWidth,.95,.48),easing:'cubic-bezier(.24,.66,.34,1)'},
    {...frame(target.x+direction*2.5,target.width*.985,1.015,.8),easing:'ease-in-out'},
    frame(target.x-direction*.6,target.width*1.005,.995,.92),
    frame(target.x,target.width,1,1)
  ],{duration:480,easing:'linear'});
  state.animation=animation;
  animation.finished.then(()=>{if(state.animation===animation)state.animation=null;}).catch(()=>{});
}

function glassNavButton(button){return {button,x:button.offsetLeft,y:button.offsetTop,width:button.offsetWidth,height:button.offsetHeight};}
function glassNavCurrent(nav,state){
  const rect=state.bubble.getBoundingClientRect(),parent=nav.getBoundingClientRect(),unit=nav.offsetWidth/parent.width;
  return {x:(rect.left-parent.left)*unit-nav.clientLeft,y:(rect.top-parent.top)*unit-nav.clientTop,width:rect.width*unit,height:rect.height*unit};
}
function glassNavPlace(state,geometry){
  const bubble=state.bubble;bubble.style.top=geometry.y+'px';bubble.style.width=geometry.width+'px';bubble.style.height=geometry.height+'px';bubble.style.transform=`translateX(${geometry.x}px)`;
}
function glassNavStop(state){const animation=state.animation;state.animation=null;animation?.cancel();}
function glassNavRelease(nav,state){
  const drag=state.drag;state.drag=null;
  if(state.frame){cancelAnimationFrame(state.frame);state.frame=0;}
  nav.classList.remove('v2-nav-dragging');
  if(drag?.moved)state.ignoreClickUntil=Date.now()+500;
  if(drag&&nav.hasPointerCapture?.(drag.id))nav.releasePointerCapture(drag.id);
  return drag;
}
function glassNavDrag(state,drag){
  const targets=drag.targets,first=targets[0],last=targets.at(-1),min=first.x,max=last.x+last.width;
  const center=Math.max(first.x+first.width/2,Math.min(last.x+last.width/2,drag.start.x+drag.start.width/2+(drag.lastX-drag.x)*drag.unit));
  let left=first,right=last;
  for(let index=1;index<targets.length;index++){if(center<=targets[index].x+targets[index].width/2){left=targets[index-1];right=targets[index];break;}}
  const span=right.x+right.width/2-left.x-left.width/2,ratio=span?Math.max(0,Math.min(1,(center-left.x-left.width/2)/span)):0;
  const width=(left.width+(right.width-left.width)*ratio)*(1+Math.min(.03,Math.abs(drag.lastX-drag.x)/1600));
  const x=Math.max(min,Math.min(max-width,center-width/2));
  state.bubble.style.transform=`translateX(${x}px) scaleX(${width/drag.start.width}) scaleY(.96)`;
}

bootstrap();

</script></body></html>
