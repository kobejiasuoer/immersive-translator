<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>沉浸阅读室 · 移动端原型 v2（练 · 语音三件套）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   沉浸阅读室 · 移动端交互原型 v2 —— iOS 优先
   在 v1（今天/生词/书架/我的 + 复习流/词典卡/分享/导入）基础上新增：
   · 「练」Tab：口语陪练（4 场景×3 难度）· 影子跟读（评测/词着色）· 录音直译（双语字幕+导出）
   · 复习触点：本地通知横幅 → 1 卡快速复习（对应 Mac P7 迷你窗）
   · 阅读层新增「跟读此句」入口（从读到练）
   单文件 · 无依赖 · 令牌/判分内核/数据与 mobile-v1 同源（跨端一致）
   ============================================================ */

/* ---------- 令牌 · 浅色（默认） ---------- */
:root, [data-theme="light"] {
  --bg:#f4f5f9;
  --surface:   #ffffff;
  --surface-2:#f9fafc;
  --border:      #e4e7ee;
  --border-strong:#d6dae4;

  --text-1: #1c2029;
  --text-2:    #4b5261;
  --text-3:    #7c8494;
  --text-4:    #a6adbb;

  --accent:         #4c5ff0;
  --accent-hover:   #3f52e0;
  --accent-soft:    #eef0fe;
  --accent-softer:  #f6f7ff;
  --accent-hl:      #dde2fd;
  --on-accent:      #ffffff;

  --ok:        #1f8a4c;
  --ok-soft:   #e8f5ee;
  --warn:      #b45309;
  --warn-soft: #fdf1e3;
  --err:       #cf4141;
  --err-soft:  #fdeeee;

  --shadow-pop: 0 12px 32px rgba(16, 24, 40, 0.16), 0 3px 10px rgba(16, 24, 40, 0.1);
  --shadow-card:0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
  --sel: rgba(76, 95, 240, 0.2);
}
/* ---------- 深色 ---------- */
[data-theme="dark"] {
  --bg:#1d1f26;
  --surface:   #262933;
  --surface-2:#2e313c;
  --border:      #373b47;
  --border-strong:#474c5a;

  --text-1: #edeef4;
  --text-2:    #c4c9d6;
  --text-3:    #9399ab;
  --text-4:    #6d7384;

  --accent:         #7d8cff;
  --accent-hover:   #93a0ff;
  --accent-soft:    rgba(125, 140, 255, 0.16);
  --accent-softer:  rgba(125, 140, 255, 0.09);
  --accent-hl:      rgba(125, 140, 255, 0.30);
  --on-accent:      #ffffff;

  --ok:        #4cc38a;
  --ok-soft:   rgba(76, 195, 138, 0.14);
  --warn:      #e0a458;
  --warn-soft: rgba(224, 164, 88, 0.14);
  --err:       #e57070;
  --err-soft:  rgba(229, 112, 112, 0.14);

  --shadow-pop: 0 14px 36px rgba(0, 0, 0, 0.55);
  --shadow-card:0 1px 2px rgba(0, 0, 0, 0.3);
  --sel: rgba(125, 140, 255, 0.3);
}
/* ---------- 护眼 ---------- */
[data-theme="sepia"] {
  --bg:#f5efdf;
  --surface:   #fbf7ec;
  --surface-2:#f1ead7;
  --border:      #e4dac0;
  --border-strong:#d2c6a6;

  --text-1: #37301f;
  --text-2:    #5a5138;
  --text-3:    #857a5c;
  --text-4:    #a89d80;

  --accent:         #4c5ff0;
  --accent-hover:   #3f52e0;
  --accent-soft:    rgba(76, 95, 240, 0.10);
  --accent-softer:  rgba(76, 95, 240, 0.06);
  --accent-hl:      rgba(76, 95, 240, 0.20);
  --on-accent:      #ffffff;

  --ok:        #35793f;
  --ok-soft:   rgba(53, 121, 63, 0.12);
  --warn:      #9a6212;
  --warn-soft: rgba(154, 98, 18, 0.12);
  --err:       #b03a32;
  --err-soft:  rgba(176, 58, 50, 0.12);

  --shadow-pop: 0 12px 32px rgba(80, 66, 32, 0.18), 0 3px 10px rgba(80, 66, 32, 0.10);
  --shadow-card:0 1px 2px rgba(80, 66, 32, 0.05), 0 1px 3px rgba(80, 66, 32, 0.06);
  --sel: rgba(76, 95, 240, 0.18);
}
/* ---------- 纯黑（OLED） ---------- */
[data-theme="oled"] {
  --bg:#000000;
  --surface:   #0a0a0b;
  --surface-2:#141416;
  --border:      #212126;
  --border-strong:#2f2f36;

  --text-1: #e8e7e4;
  --text-2:    #b0aeab;
  --text-3:    #77756f;
  --text-4:    #4c4a46;

  --accent:         #7d8cff;
  --accent-hover:   #93a0ff;
  --accent-soft:    rgba(125, 140, 255, 0.13);
  --accent-softer:  rgba(125, 140, 255, 0.07);
  --accent-hl:      rgba(125, 140, 255, 0.26);
  --on-accent:      #0c0c10;

  --ok:        #4cc38a;
  --ok-soft:   rgba(76, 195, 138, 0.12);
  --warn:      #e0a458;
  --warn-soft: rgba(224, 164, 88, 0.12);
  --err:       #e57070;
  --err-soft:  rgba(229, 112, 112, 0.12);

  --shadow-pop: 0 14px 36px rgba(0, 0, 0, 0.8), 0 3px 10px rgba(0, 0, 0, 0.5);
  --shadow-card:0 1px 2px rgba(0, 0, 0, 0.6);
  --sel: rgba(125, 140, 255, 0.28);
}

/* ---------- 基底 ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: -apple-system, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 15px; line-height: 1.55;
  color: var(--text-1); background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  transition: background .3s ease, color .3s ease;
}
::selection { background: var(--sel); }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 6px;
}
.serif-en { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; }
.zh-serif { font-family: "Noto Serif SC", serif; }
.hidden { display: none !important; }

/* ---------- 原型说明条 ---------- */
.proto-banner {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 18px; height: 40px;
  background: var(--accent-softer);
  border-bottom: 1px solid var(--border);
  font-size: 12px; color: var(--text-2);
  position: relative; z-index: 50;
}
.proto-banner .tag {
  flex: none; padding: 1px 9px; border-radius: 999px;
  background: var(--accent); color: var(--on-accent);
  font-weight: 600; font-size: 11px;
}
.proto-banner b { color: var(--text-1); }
.proto-banner .links { display: flex; gap: 2px; margin-left: 6px; flex-wrap: nowrap; overflow: hidden; }
.banner-link {
  border: none; background: transparent; color: var(--text-2);
  font-size: 11.5px; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
}
.banner-link:hover { background: var(--accent-soft); color: var(--accent); }
.proto-banner .spacer { flex: 1; }

/* ---------- 舞台（桌面观看） ---------- */
.stage {
  position: absolute; top: 40px; left: 0; right: 0; bottom: 0;
  display: grid; place-items: center;
  background:
    radial-gradient(900px 500px at 50% 12%, var(--accent-softer), transparent 70%),
    var(--bg);
  overflow: hidden;
}
.stage-note {
  position: absolute; left: max(24px, calc(50vw - 560px)); top: 50%;
  transform: translateY(-50%);
  width: 220px; color: var(--text-3); font-size: 12.5px; line-height: 1.9;
}
.stage-note .n1 { font-size: 15px; font-weight: 700; color: var(--text-1); margin-bottom: 4px; }
.stage-note .n1 small { font-size: 11px; font-weight: 500; color: var(--text-4); display: block; }
.stage-note em { color: var(--text-2); font-style: normal; background: var(--accent-soft); border-radius: 4px; padding: 0 4px; }
@media (max-width: 1180px) { .stage-note { display: none; } }

/* ---------- iPhone 壳 ---------- */
.phone {
  position: relative; width: 390px; height: 844px; flex: none;
  background: var(--bg);
  border-radius: 55px;
  border: 11px solid #101116;
  outline: 1px solid rgba(128, 138, 160, .35);
  box-shadow: 0 30px 80px rgba(10, 14, 30, .35), 0 6px 22px rgba(10, 14, 30, .22);
  overflow: hidden;
  transform-origin: center;
}
.island {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  width: 122px; height: 36px; border-radius: 20px;
  background: #050507; z-index: 40;
  pointer-events: none;
}
.statusbar {
  position: absolute; top: 0; left: 0; right: 0; height: 58px; z-index: 39;
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 34px 0 40px;
  font-size: 15px; font-weight: 600; color: var(--text-1);
  pointer-events: none;
}
.statusbar svg { display: block; }
.homebar {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  width: 134px; height: 5px; border-radius: 3px;
  background: var(--text-1); opacity: .35; z-index: 46; pointer-events: none;
}

/* ---------- App 内部 ---------- */
.app { position: absolute; inset: 0; }
.screen {
  position: absolute; inset: 0;
  padding: 74px 18px 120px;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.screen::-webkit-scrollbar { display: none; }
.screen .pagehead { padding: 2px 2px 14px; }
.large-title { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
.page-sub { font-size: 12.5px; color: var(--text-3); margin-top: 3px; }

/* 底部 Tab Bar（5 Tab：今天 / 练 / 书架 / 生词 / 我的） */
.tabbar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; align-items: flex-start;
  padding: 7px 10px 26px;
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(18px);
  backdrop-filter: saturate(1.4) blur(18px);
  border-top: 1px solid var(--border);
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  border: none; background: transparent; padding: 4px 0 0;
  color: var(--text-3); font-size: 10px; font-weight: 500;
}
.tab svg { width: 25px; height: 25px; }
.tab.on { color: var(--accent); }
.tab .tbadge {
  position: absolute; margin: -3px 0 0 16px;
  min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
  background: var(--err); color: #fff; font-size: 10px; font-weight: 700; line-height: 16px;
}
.tab { position: relative; }

/* ---------- 通用组件 ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  box-shadow: var(--shadow-card); padding: 16px;
}
.btn {
  height: 50px; border: none; border-radius: 14px; width: 100%;
  background: var(--accent); color: var(--on-accent);
  font-size: 16px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:hover { background: var(--accent-hover); }
.btn.ghost {
  background: transparent; border: 1px solid var(--border-strong);
  color: var(--text-2); font-size: 14px; font-weight: 500; height: 44px;
}
.btn.ghost:hover { color: var(--text-1); border-color: var(--text-3); }
.btn.sm { height: 36px; font-size: 13.5px; border-radius: 10px; width: auto; padding: 0 16px; }
.badge {
  display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 600;
  white-space: nowrap;
}
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.err  { background: var(--err-soft);  color: var(--err); }
.badge.ok   { background: var(--ok-soft);   color: var(--ok); }
.badge.mute { background: var(--surface-2); color: var(--text-3); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--err); flex: none; }
.dot.ok { background: var(--ok); }

/* iOS 分段控件 */
.seg {
  display: flex; padding: 2px; gap: 2px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 11px;
}
.seg button {
  flex: 1; height: 32px; border: none; background: transparent; border-radius: 9px;
  font-size: 13px; color: var(--text-3); font-weight: 500;
}
.seg button.on { background: var(--surface); color: var(--text-1); font-weight: 600; box-shadow: var(--shadow-card); }

/* 搜索框 */
.search {
  display: flex; align-items: center; gap: 7px;
  height: 38px; padding: 0 12px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 11px;
  color: var(--text-4);
}
.search input {
  flex: 1; border: none; background: transparent; outline: none;
  font-size: 15px; color: var(--text-1); font-family: inherit;
}
.search input::placeholder { color: var(--text-4); }

/* 列表行 */
.rows { display: flex; flex-direction: column; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 13px 4px; border: none; background: transparent; text-align: left;
  border-bottom: 1px solid var(--border);
}
.rows .row:last-child { border-bottom: none; }
.row .rt { flex: 1; min-width: 0; }
.row .rt .t1 { font-size: 15.5px; font-weight: 600; display: flex; align-items: center; gap: 7px; min-width: 0; }
.row .rt .t1 .w { font-family: "Source Serif 4", Georgia, serif; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .rt .t2 { font-size: 12.5px; color: var(--text-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .chev { color: var(--text-4); flex: none; }

/* ---------- 今天（复习主页） ---------- */
.hero { padding: 20px 18px 18px; text-align: left; position: relative; }
.hero .huge {
  font-family: "Source Serif 4", Georgia, serif;
  font-size: 76px; font-weight: 600; line-height: .95; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
.hero .huge small { font-size: 22px; color: var(--text-3); font-weight: 400; margin-left: 6px; }
.hero .split { margin-top: 10px; font-size: 13px; color: var(--text-2); display: flex; gap: 14px; align-items: center; }
.hero .split .sw { display: inline-flex; align-items: center; gap: 5px; }
.hero .split .sw i { width: 8px; height: 8px; border-radius: 3px; background: var(--accent); display: inline-block; }
.hero .split .sw.ck i { border-radius: 50%; background: var(--warn); }
.hero .streak {
  position: absolute; top: 18px; right: 16px;
  text-align: right; font-size: 12px; color: var(--text-3); line-height: 1.5;
}
.hero .streak b { display: block; font-size: 20px; color: var(--warn); font-family: "Source Serif 4", Georgia, serif; }
.hero-dots { display: flex; gap: 5px; margin-top: 14px; flex-wrap: wrap; }
.hero-dots i { width: 9px; height: 9px; border-radius: 3px; background: var(--accent); opacity: .9; }
.hero-dots i.ck { border-radius: 50%; background: var(--warn); }
.hero-dots i.done { background: var(--border-strong); opacity: .55; }
.sect-label { font-size: 12px; font-weight: 700; color: var(--text-3); margin: 20px 4px 8px; letter-spacing: .02em; }

.resume { display: flex; align-items: center; gap: 12px; }
.resume .thumb {
  width: 46px; height: 46px; border-radius: 12px; flex: none;
  background: linear-gradient(135deg, var(--accent), #7a5cf0);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 19px; font-weight: 700; font-family: "Source Serif 4", Georgia, serif;
}
.resume .rt { flex: 1; min-width: 0; }
.resume .pbar { height: 4px; border-radius: 2px; background: var(--border); margin-top: 7px; overflow: hidden; }
.resume .pbar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }

/* 快捷练一练入口 */
.quick-ents { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.qent {
  border: 1px solid var(--border); border-radius: 14px; background: var(--surface);
  padding: 12px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; color: var(--text-2);
  box-shadow: var(--shadow-card);
}
.qent svg { width: 21px; height: 21px; }
.qent:active { background: var(--accent-softer); }
.qent .sub { font-size: 10px; color: var(--text-4); font-weight: 400; }

/* ---------- 复习卡 ---------- */
.rev-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.rev-top .x {
  width: 34px; height: 34px; border-radius: 50%; border: none; flex: none;
  background: var(--surface-2); color: var(--text-2); font-size: 16px;
  display: flex; align-items: center; justify-content: center;
}
.rev-top .prog { flex: 1; height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; }
.rev-top .prog i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .25s ease; }
.rev-top .n { font-size: 12.5px; color: var(--text-3); font-variant-numeric: tabular-nums; flex: none; }

.rev-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  box-shadow: var(--shadow-card); padding: 20px 18px;
  display: flex; flex-direction: column; gap: 14px;
}
.rev-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3); }
.word-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.word { font-family: "Source Serif 4", Georgia, serif; font-size: 36px; line-height: 1.1; }
.phonetic { font-size: 13.5px; color: var(--text-3); }
.icon-btn {
  width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2); font-size: 14px;
  display: inline-flex; align-items: center; justify-content: center; flex: none;
}
.icon-btn:active { background: var(--accent-soft); color: var(--accent); }
.sense-line { font-size: 15px; line-height: 1.75; font-family: "Noto Serif SC", serif; }
.sense-line .pos { color: var(--text-3); font-style: italic; margin-right: 5px; font-size: 13px; }
.chunk-detail { font-size: 13px; line-height: 1.7; color: var(--text-2); }
.chunk-detail i { font-family: "Source Serif 4", Georgia, serif; }
.src-sent {
  border-left: 2px solid var(--border-strong); padding: 8px 12px;
  font-family: "Source Serif 4", Georgia, serif;
  font-size: 13px; line-height: 1.65; color: var(--text-2);
}
.src-sent .from { display: block; margin-top: 3px; font-size: 11px; color: var(--text-3); font-family: inherit; }

/* 完形（移动：输入槽内嵌句中，字号 ≥16 防 iOS 缩放） */
.cloze-sent {
  font-family: "Source Serif 4", Georgia, serif;
  font-size: 19px; line-height: 2.1; color: var(--text-1);
}
.blank-input {
  font-family: inherit; font-size: 17px; line-height: inherit; text-align: center;
  border: none; outline: none; border-bottom: 2px solid var(--accent);
  background: var(--accent-softer); color: var(--accent);
  min-width: 88px; max-width: 250px; width: 120px;
  padding: 0 7px; margin: 0 2px; border-radius: 8px 8px 0 0;
}
.blank-input::placeholder { color: var(--text-4); font-style: italic; font-size: 13.5px; }
.blank-input:focus { background: var(--accent-soft); }
.cloze-cn { font-family: "Noto Serif SC", serif; font-size: 13.5px; color: var(--text-3); }
.cn-masked { cursor: pointer; border-bottom: 1px dashed var(--border-strong); }
.hint {
  font-size: 13px; color: var(--text-2); line-height: 1.65;
  padding: 9px 12px; border-radius: 10px;
  background: var(--surface-2); border: 1px solid var(--border);
}
.hint .h-tag { color: var(--accent); font-weight: 600; margin-right: 7px; font-size: 11px; }
.hint-btn {
  align-self: flex-start; border: 1px dashed var(--border-strong); border-radius: 10px;
  background: transparent; color: var(--text-3); font-size: 12.5px; padding: 6px 14px;
}
/* 听写 */
.dict-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 13px; border-radius: 12px;
  background: var(--surface-2); border: 1px solid var(--border);
}
.play-btn {
  height: 42px; padding: 0 18px; border-radius: 11px; border: none; flex: none;
  background: var(--accent); color: var(--on-accent);
  font-size: 14px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 7px;
}
.play-btn:disabled { opacity: .5; }
.dict-input {
  width: 100%; min-height: 84px; resize: vertical;
  font-family: "Source Serif 4", Georgia, serif; font-size: 17px; line-height: 1.7;

}

/* 判分反馈 */
.verdict { border-radius: 12px; padding: 12px 14px; font-size: 13.5px; line-height: 1.7; }
.verdict .v-head { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.verdict.perfect { background: var(--ok-soft); color: var(--ok); }
.verdict.close   { background: var(--warn-soft); color: var(--warn); }
.verdict.trapv   { background: var(--err-soft); color: var(--err); }
.verdict.wrong   { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.verdict .v-body { color: var(--text-2); font-size: 13px; }
.verdict .v-body b { color: var(--text-1); }
.verdict .ans { font-family: "Source Serif 4", Georgia, serif; font-size: 15px; color: var(--text-1); }
.diff-line { font-family: "Source Serif 4", Georgia, serif; font-size: 15px; line-height: 1.95; }
.diff-line .w-ok    { color: var(--ok); }
.diff-line .w-miss  { color: var(--err); border-bottom: 2px dashed var(--err); padding: 0 2px; }
.diff-line .w-miss::before { content: "+"; font-size: 11px; }
.diff-line .w-extra { color: var(--err); text-decoration: line-through; margin: 0 2px; }
/* 评分带（拇指优先：4 大按钮） */
.gradebar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 2px; }
.grade-btn {

}

.grade-btn:active { background: var(--accent-softer); }
.grade-btn.focus { border-color: var(--accent); background: var(--accent-softer); }
.grade-btn.focus::after {

  background: var(--accent); color: var(--on-accent);

}

/* 摘要 */
.summary { text-align: center; padding: 26px 0 8px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.summary .big { font-family: "Source Serif 4", Georgia, serif; font-size: 24px; }

/* ---------- 书架 ---------- */

/* ---------- 全屏功能层（陪练 / 跟读 / 直译） ---------- */

}

@keyframes micpulse {

/* ---------- 影子跟读 ---------- */

}

  width: 36px; height: 36px; border-radius: 50%; border: none; flex: none;

}

.r-top .tt .a { font-family: "Source Serif 4", Georgia, serif; font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.r-top .rbtn {

/* ============================================================
   判分内核（与 recallJudge 规划一致，纯本地；与 mobile-v1 同源）
   ============================================================ */
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function judge(input, answer, trap, accepted = []) {
  const i = norm(input), a = norm(answer);
  if (!i) return "wrong";
  if (i === a || accepted.some((x) => norm(x) === i)) return "perfect";
  const t = norm(trap);
  if (t && (i === t || (t.length > 6 && i.includes(t)))) return "trap";
  const strip = (x) => x.replace(/\b(a|an|the)\b/g, "").replace(/\s+/g, " ").trim();
  if (strip(i) === strip(a)) return "close";
  if (levenshtein(i, a) <= Math.max(1, Math.floor(a.length / 6))) return "close";
  return "wrong";
}
const JUDGE_SUGGEST = { perfect: "easy", close: "good", trap: "forgot", wrong: "forgot" };
const JUDGE_HEAD = { perfect: "✓ 一次写对", close: "≈ 很接近，差一点", trap: "⚠ 命中直译陷阱", wrong: "✗ 没想起来" };
const JUDGE_TONE = { perfect: "perfect", close: "close", trap: "trapv", wrong: "wrong" };
function wordDiff(input, answer) {
  const tk = (s) => norm(s).split(" ").filter(Boolean);
  const A = tk(input), B = tk(answer);
  const m = A.length, n = B.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    dp[i][j] = A[i - 1] === B[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
  const out = []; let i = m, j = n;
  while (i > 0 && j > 0) {
    if (A[i - 1] === B[j - 1]) { out.unshift({ w: B[j - 1], s: "ok" }); i--; j--; }
    else if (dp[i - 1][j] >= dp[i][j - 1]) { out.unshift({ w: A[i - 1], s: "extra" }); i--; }
    else { out.unshift({ w: B[j - 1], s: "miss" }); j--; }
  }
  while (i > 0) { out.unshift({ w: A[i - 1], s: "extra" }); i--; }
  while (j > 0) { out.unshift({ w: B[j - 1], s: "miss" }); j--; }
  return out;
}

/* ---------- TTS（原型用 Web Speech；实现走系统 TTS 插件） ---------- */
let voiceEn = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter((v) => /^en(-|_)/i.test(v.lang));
  voiceEn = vs.find((v) => /Google US|Natural|Samantha|Zira/i.test(v.name)) || vs[0] || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, rate = 1, onend = null) {
  if (!("speechSynthesis" in window)) { if (onend) setTimeout(onend, 400); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = rate;
  if (voiceEn) u.voice = voiceEn;
  if (onend) u.onend = onend;
  speechSynthesis.speak(u);
}
function stopSpeak() { if ("speechSynthesis" in window) speechSynthesis.cancel(); }

  state.review = {
    queue: REVIEW_CARDS.map((c) => ({ ...c })),
    pos: 0, phase: "answer", hints: 0, input: "", judged: null,
    replay: 3, results: [], finished: false,
  };
  renderToday();
  $("scr-today").scrollTop = 0;
}
function rvNext() {
  const r = state.review;
  r.pos += 1;
  r.phase = "answer"; r.hints = 0; r.input = ""; r.judged = null; r.replay = 3;
  if (r.pos >= r.queue.length) r.finished = true;
  renderToday();
  $("scr-today").scrollTop = 0;
}
function renderReviewCard() {
  const r = state.review;
  const c = r.queue[r.pos];
  const prog = Math.round((r.pos / r.queue.length) * 100);
  let inner = "";
  if (c.mode === "recognition") inner = htmlRecognition(c);
  else if (c.mode === "cloze") inner = htmlCloze(c);
  else inner = htmlDictation(c);
  $("scr-today").innerHTML = `
    <div class="rev-top">
      <button class="x" id="rvClose" title="结束本轮">✕</button>
      <div class="prog"><i style="width:${prog}%"></i></div>
      <span class="n">${r.pos + 1} / ${r.queue.length}</span>
    </div>
    <div class="rev-card">${inner}</div>
    <div style="text-align:center;margin-top:12px"><button class="banner-link" id="rvSkip">跳过这张</button></div>`;
  bindReview(c);
}
function modePill(mode) {
  const m = { recognition: ["识别", "mute"], cloze: ["完形", ""], dictation: ["听写", "warn"] }[mode];
  return `<span class="badge ${m[1]}">${m[0]}</span>`;
}
function htmlRecognition(c) {
  const flipped = state.review.phase === "graded";
  return `
    <div class="rev-meta">${modePill("recognition")}<span>来自《${c.article}》</span></div>
    <div class="word-line">
      <span class="word">${esc(c.word)}</span>
      ${c.phonetic ? `<span class="phonetic">/${c.phonetic}/</span>` : ""}
      <button class="icon-btn" id="btnSpeakWord">🔊</button>
    </div>
    ${flipped ? `
      <div class="sense-line">${c.senses.map((s) => `<div><span class="pos">${s.pos}</span>${esc(s.cn)}</div>`).join("")}</div>
      ${c.pattern ? `<div class="chunk-detail">记法：<i>${esc(c.pattern)}</i></div>` : ""}
      <div class="src-sent">${esc(c.sentence)}<span class="from">来自《${c.article}》 · 点击跳回原文</span></div>
      ${gradebarHtml()}
    ` : `
      <div style="color:var(--text-3);font-size:13.5px">回想它的意思，再翻面对答案。</div>
      <button class="btn" id="btnFlip">翻面看释义</button>
    `}`;
}
function htmlCloze(c) {
  const graded = state.review.phase === "graded";
  const blank = c.blank || c.word;
  const idx = c.sentence.toLowerCase().indexOf(blank.toLowerCase());
  const before = idx >= 0 ? c.sentence.slice(0, idx) : `_____ `;
  const after = idx >= 0 ? c.sentence.slice(idx + blank.length) : "";
  let sentHtml;
  if (!graded) {
    sentHtml = `${esc(before)}<input class="blank-input" id="blankInput" spellcheck="false" autocomplete="off" placeholder="写出挖空部分" value="${esc(state.review.input)}">${esc(after)}`;
  } else {
    sentHtml = `${esc(before)}<span class="${state.review.judged === "perfect" ? "diff-line" : ""}" style="color:${state.review.judged === "perfect" ? "var(--ok)" : state.review.judged === "close" ? "var(--warn)" : "var(--err)"}">${esc(blank)}</span>${esc(after)}`;
  }
  let hintsHtml = "";
  if (!graded) {
    const hints = [];
    if (state.review.hints >= 1) hints.push(`<div class="hint"><span class="h-tag">提示 1</span>${esc(c.senses[0].cn)}</div>`);
    if (state.review.hints >= 2) hints.push(`<div class="hint"><span class="h-tag">提示 2</span>首字母：${blank.split(/\s+/).map((w) => w[0] + "…").join(" ")}（${blank.split(/\s+/).length} 词）</div>`);
    if (state.review.hints >= 3) hints.push(`<div class="hint"><span class="h-tag">提示 3</span>槽位记法：<i>${esc(c.pattern || c.word)}</i></div>`);
    hintsHtml = hints.join("") + (state.review.hints < 3 ? `<button class="hint-btn" id="btnHint">再给一点提示</button>` : "");
  }
  let verdictHtml = "";
  if (graded) {
    const j = state.review.judged;
    const ansNote = blank !== c.word ? `（词条原形：${esc(c.word)}）` : "";
    let body = "";
    if (j === "close") body = `你写的：<b>${esc(state.review.input)}</b> · <span class="ans">${esc(blank)}</span>${ansNote}`;
    else if (j === "trap") body = `你写了 <b>${esc(state.review.input)}</b> —— ${esc(c.trap || "常见直译错误")}。<span class="ans">正确：${esc(blank)}</span>`;
    else if (j === "wrong") body = `<span class="ans">${esc(blank)}</span>${ansNote}${c.trap ? ` · ⚠ 别写成：${esc(c.trap)}` : ""}`;
    else body = `<span class="ans">${esc(blank)}</span>${ansNote}`;
    verdictHtml = `
      <div class="verdict ${JUDGE_TONE[j]}">
        <span class="v-head">${JUDGE_HEAD[j]}${state.review.hints ? `<span style="font-weight:400;font-size:11px;opacity:.75">（用了 ${state.review.hints} 级提示）</span>` : ""}</span>
        <span class="v-body">${body}</span>
      </div>`;
  }
  return `
    <div class="rev-meta">${modePill("cloze")}<span>词块 · 来自《${c.article}》</span></div>
    <div class="cloze-sent">${sentHtml}</div>
    <div class="cloze-cn">中文提示：<span class="cn-masked" id="cnHint">${graded ? esc(c.sentenceCn) : esc(c.sentenceCn).replace(/[^\s，。]/g, "＿")}</span></div>
    ${hintsHtml ? `<div style="display:flex;flex-direction:column;gap:6px">${hintsHtml}</div>` : ""}
    ${verdictHtml}
    ${graded ? gradebarHtml() : `
      <div class="act-row">
        <button class="btn" id="btnSubmit" style="flex:1.3">提交判分</button>
        <button class="btn ghost" id="btnGiveup">想不出来，看答案</button>
      </div>`}
    ${graded ? "" : `<div style="text-align:center;font-size:11px;color:var(--text-4)">提示阶梯：释义 → 首字母 → 槽位记法</div>`}`;
}
function htmlDictation(c) {
  const graded = state.review.phase === "graded";
  let verdictHtml = "";
  if (graded) {
    const diff = wordDiff(state.review.input, c.sentence);
    const diffHtml = diff.map((d) =>
      d.s === "ok" ? `<span class="w-ok">${esc(d.w)}</span>` : d.s === "miss" ? `<span class="w-miss">${esc(d.w)}</span>` : `<span class="w-extra">${esc(d.w)}</span>`).join(" ");
    const okN = diff.filter((d) => d.s === "ok").length;
    const pct = Math.round((okN / Math.max(1, norm(c.sentence).split(" ").length)) * 100);
    verdictHtml = `
      <div class="verdict ${JUDGE_TONE[state.review.judged]}">
        <span class="v-head">${JUDGE_HEAD[state.review.judged]} · 词级命中 ${pct}%</span>
        <span class="diff-line">${diffHtml}</span>
        <span class="v-body" style="font-size:11px"><span class="w-ok">写对</span> · <span class="w-miss">漏写</span> · <span class="w-extra">多写/写错</span></span>
      </div>`;
  }
  return `
    <div class="rev-meta">${modePill("dictation")}<span>${c.kind === "chunk" ? "词块" : "单词"}整句 · 来自《${c.article}》</span></div>
    <div class="word-line">
      <span class="word" style="font-size:28px">${esc(c.word)}</span>
      <button class="icon-btn" id="btnSpeakWord">🔊</button>
    </div>
    <div class="dict-bar">
      <button class="play-btn" id="btnPlay" ${!graded && state.review.replay <= 0 ? "disabled" : ""}>▶ ${graded ? "再听一遍" : state.review.replay < 3 ? "重播" : "播放句子"}</button>
      <span style="font-size:11.5px;color:var(--text-3)">还可重播 <b>${state.review.replay}</b> 次</span>
    </div>
    ${graded ? "" : `<textarea class="dict-input" id="dictInput" spellcheck="false" placeholder="听写整句（不区分大小写与标点）">${esc(state.review.input)}</textarea>`}
    ${verdictHtml}
    ${graded ? gradebarHtml() : `
      <div class="act-row">
        <button class="btn" id="btnSubmitD" style="flex:1.3">提交判分</button>
        <button class="btn ghost" id="btnGiveupD">听不出，看句子</button>
      </div>`}`;
}
function gradebarHtml() {
  const suggest = JUDGE_SUGGEST[state.review.judged || "wrong"];
  const bars = [["forgot", "忘记", "10 分钟"], ["hard", "困难", "1 天"], ["good", "一般", "3 天"], ["easy", "简单", "7 天"]];
  return `<div class="gradebar">${bars.map(([v, name, next]) => `
    <button class="grade-btn ${v === suggest ? "focus" : ""}" data-grade="${v}">
      <span class="name">${name}</span><span class="next">${next}</span>
    </button>`).join("")}</div>`;
}
function bindReview(c) {
  $("rvClose").addEventListener("click", () => { state.review = null; stopSpeak(); renderToday(); });
  $("rvSkip").addEventListener("click", () => rvNext());
  $("btnSpeakWord")?.addEventListener("click", () => speak(c.word, 0.9));
  $("btnFlip")?.addEventListener("click", () => { state.review.phase = "graded"; renderToday(); });
  $("btnHint")?.addEventListener("click", () => { state.review.hints++; renderReviewCard(); });
  $("cnHint")?.addEventListener("click", () => toast("实现：点击显示完整中文"));
  $("btnGiveup")?.addEventListener("click", () => { state.review.phase = "graded"; state.review.judged = "wrong"; renderToday(); });
  $("btnSubmit")?.addEventListener("click", submitCloze);
  $("btnPlay")?.addEventListener("click", () => {
    if (state.review.phase !== "graded") {
      if (state.review.replay <= 0) return;
      state.review.replay--;
    }
    speak(c.sentence, 1, () => renderReviewCard());
    renderReviewCard();
  });
  $("btnGiveupD")?.addEventListener("click", () => { state.review.phase = "graded"; state.review.judged = "wrong"; speak(c.sentence); renderToday(); });
  $("btnSubmitD")?.addEventListener("click", submitDictation);
  const bi = $("blankInput");
  if (bi) {
    bi.addEventListener("input", () => { state.review.input = bi.value; });
    bi.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); submitCloze(); } });
  }
  const di = $("dictInput");
  if (di) {
    di.addEventListener("input", () => { state.review.input = di.value; });
    di.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitDictation(); } });
  }
  document.querySelectorAll(".grade-btn").forEach((b) =>
    b.addEventListener("click", () => {
      state.review.results.push({ word: c.word, mode: c.mode, judged: state.review.judged, grade: b.dataset.grade });
      rvNext();
    }));
}
function submitCloze() {
  const r = state.review;
  if (r.phase === "graded") return;
  r.phase = "graded";
  const c = r.queue[r.pos];
  r.judged = judge(r.input, c.blank || c.word, c.trap, c.accepted);
  renderToday();
}
function submitDictation() {
  const r = state.review;
  if (r.phase === "graded") return;
  r.phase = "graded";
  const c = r.queue[r.pos];
  const full = judge(r.input, c.sentence, c.trap, c.accepted);
  if (full === "perfect" || full === "trap") { r.judged = full; renderToday(); return; }
  const nA = norm(c.sentence).split(" ").filter(Boolean).length;
  const okN = wordDiff(r.input, c.sentence).filter((d) => d.s === "ok").length;
  r.judged = okN / Math.max(1, nA) >= 0.85 ? "close" : "wrong";
  renderToday();
}
function renderSummary() {
  const r = state.review;
  const produced = r.results.filter((x) => x.mode !== "recognition");
  const recogN = r.results.length - produced.length;
  const count = (j) => produced.filter((x) => x.judged === j).length;
  $("scr-today").innerHTML = `
    <div class="summary">
      <div style="font-size:44px">🎉</div>
      <div class="big">今日复习完成</div>
      <div class="sub">${produced.length} 张产出卡${recogN ? ` · 另 ${recogN} 张识别卡` : ""} · streak 15 天 🔥</div>
      <div class="sum-grid">
        <div class="sum-cell ok"><div class="n">${count("perfect")}</div><div class="l">一次写对</div></div>
        <div class="sum-cell warn"><div class="n">${count("close")}</div><div class="l">接近差一点</div></div>
        <div class="sum-cell err"><div class="n">${count("trap")}</div><div class="l">直译陷阱</div></div>
        <div class="sum-cell mute"><div class="n">${count("wrong")}</div><div class="l">未想起</div></div>
      </div>
      <div style="font-size:12px;color:var(--text-3);line-height:1.8;max-width:300px">
        直译陷阱命中会进入长期统计「中式直译纠正率」——手机与电脑端共用同一份记录。
      </div>
      <button class="btn" id="btnHome" style="max-width:260px">回到今天</button>
    </div>`;
  $("btnHome").addEventListener("click", () => { state.review = null; renderToday(); });
  updateDueBadge();
}

  el.innerHTML = `
    <div class="n-head">

      <button class="btn ghost" data-na="later">稍后</button>
      <button class="btn" data-na="go">清一张</button>
    </div>`;
  $("phone").appendChild(el);
  el.addEventListener("click", (e) => {
    const b = e.target.closest("[data-na]");
    if (b && b.dataset.na === "later") { dismissNotify(); toast("已稍后 · 30 分钟后再提醒"); return; }

/* ============================================================

function openShadow(startIdx) {

function closeShadow() {

  $("fxLayer").innerHTML = "";
}
function renderShadow() {
  const sh = state.shadow;
  const s = SHADOW_SESSION.sents[sh.i];
  const prog = Math.round((sh.i / SHADOW_SESSION.sents.length) * 100);
  let cardInner = `
    <div class="sh-meta">
      <span class="badge">第 ${sh.i + 1} / ${SHADOW_SESSION.sents.length} 句</span>

    </div>
    <div class="sh-sent" id="shSent">${shadowSentHtml(s, sh)}</div>
    <div class="sh-zh">${esc(s.zh)}</div>`;
  if (sh.phase === "result") {
    cardInner += `
      <div class="score-pill ${sh.passed ? "pass" : "fail"}">
        <span class="n">${sh.score.toFixed(1)}</span>
        <span class="t">${sh.passed ? "过关 · 发音清晰" : "差一点 · 看标红的词"}</span>

    </div>
    <div class="sh-wrap">
      <div class="sh-card">${cardInner}</div>
      ${shFooterHtml(sh, s)}
      <div class="sh-foot">评测：讯飞 ISE（发音 / 流利度 / 准确率）· 不达标词标红<br>领读 = 慢速 TTS 带读，读完自动回到待录状态</div>
    </div>`;
  $("shClose").addEventListener("click", closeShadow);
  $("shLead")?.addEventListener("click", () => {
    sh.phase = "lead";
    renderShadow();
    speak(s.en, 0.75, () => { if (state.shadow) { state.shadow.phase = "idle"; renderShadow(); } });
  });
  $("shRetry")?.addEventListener("click", () => { sh.phase = "idle"; renderShadow(); });
  $("shSkip")?.addEventListener("click", () => shadowNext(false));
  $("shNext")?.addEventListener("click", () => shadowNext(true));

}
function shadowSentHtml(s, sh) {

    // 词级着色：不达标词标红（实现由 ISE 词级结果驱动）
    return s.en.split(" ").map((w) => {

function shFooterHtml(sh, s) {

function bindShadowMic() {

function shadowRelease(downAt) {

          <div class="sum-cell ok"><div class="n">${passN}</div><div class="l">过关</div></div>
          <div class="sum-cell err"><div class="n">${SHADOW_SESSION.sents.length - passN}</div><div class="l">卡住重练</div></div>
          <div class="sum-cell warn"><div class="n">${avg >= 80 ? "+1" : "+1"}</div><div class="l">streak</div></div>
        </div>
        <div style="font-size:12px;color:var(--text-3);line-height:1.8;max-width:300px">
          卡住重练的句子会进「易错句」清单，明天优先安排（与桌面端同口径）。
        </div>
        <button class="btn" id="shAgain" style="max-width:240px">再练一轮</button>
        <button class="btn ghost" id="shDone" style="max-width:240px">完成</button>
      </div>`;
    $("shClose2").addEventListener("click", closeShadow);
    $("shAgain").addEventListener("click", () => openShadow(0));
    $("shDone").addEventListener("click", closeShadow);

    </div>
    <div class="cap-stream" id="capStream">
      ${cp.done.length || partialHtml ? doneHtml + partialHtml : `
        <div class="cap-empty">按下录音，开口就行。<br>VAD 检测静音自动分句，一句一段双语字幕。<br>适合会议、播客、网课。</div>`}
    </div>
    <div class="cap-foot">
      <button class="rec-fab ${cp.rec ? "rec" : ""}" id="recFab" aria-label="${cp.rec ? "停止" : "开始录音"}">
        ${cp.rec ? '<span class="sq"></span>' : ICON_MIC}
      </button>
      <div class="cap-note">${cp.rec ? "轻触停止 · 已翻 " + cp.done.length + " 句" : "轻触开始录音"}</div>
    </div>`;
  $("cpClose").addEventListener("click", () => {
    if (cp.rec && cp.done.length) { capStop(); return; }
    closeCaption();
  });
  $("cpStop")?.addEventListener("click", () => { if (cp.rec) capStop(); });
  $("recFab").addEventListener("click", () => (cp.rec ? capStop() : capStart()));
  if (cp.rec) {
    const stream = $("capStream");
    stream.scrollTop = stream.scrollHeight;
  }
}
function capStart() {
  const cp = state.cap;
  cp.rec = true; cp.t = 0; cp.ci = 0; cp.partial = ""; cp.done = [];
  renderCaption();
  // 计时 + 电平
  cp.timers.push(setInterval(() => {
    cp.t += 0.1;
    const tm = $("capStream")?.parentElement === null ? null : document.querySelector(".cap-timer");
    if (tm) tm.textContent = capFmt(cp.t);
    const m = $("capMeter");
    if (m) m.style.width = (18 + Math.random() * 74) + "%";
  }, 100));
  // 打字式「正在说」→ 说完收句（VAD 静音收句的演示，约 2.5s 一句）
  cp.timers.push(setInterval(() => {
    if (cp.ci >= CAPTION_LINES.length) { capStop(); return; }
    const line = CAPTION_LINES[cp.ci];
    const n = Math.floor(cp.partial.length) + 4;
    if (n >= line.en.length) {
      cp.done.push({ en: line.en, zh: line.zh, tm: capFmt(cp.t) });
      cp.ci += 1; cp.partial = "";
    } else {
      cp.partial = line.en.slice(0, n);
    }
    renderCaption();
  }, 150));
}
function capStop() {
  const cp = state.cap;
  cp.timers.forEach(clearInterval);
  cp.timers = [];
  cp.rec = false;
  const said = cp.done.length;
  const dur = capFmt(cp.t);
  const md = cp.done.map((d) => `- ${d.en}\n  ${d.zh}`).join("\n");
  openSheet(`

/* ============================================================
   阅读层：点词查词 + 词块高亮 + 遮罩 + 逐句播放 + 跟读入口
   ============================================================ */
function buildSentences(art) {
  const sents = [];
  art.paras.forEach((p) => {
    (p.en.match(/[^.!?]+[.!?]+["']?\s*|[^.!?]+$/g) || [p.en]).forEach((s) => {
      const t = s.trim();
      if (t) sents.push({ en: t, chunks: p.chunks });
    });
  });
  return sents;
}
function tokenizeSentence(text, chunks, savedSet) {
  const toks = text.match(/[A-Za-z0-9'’-]+|[^A-Za-z0-9'’-]+/g) || [];
  const isW = (t) => /^[A-Za-z0-9'’-]+$/.test(t);
  const marks = new Array(toks.length).fill(-1);
  (chunks || []).forEach((ch, ci) => {
    const needle = norm(ch.text).split(" ");
    for (let i = 0; i < toks.length; i++) {
      if (!isW(toks[i])) continue;
      let k = i, j = 0;
      while (j < needle.length && k < toks.length) {
        if (!isW(toks[k])) { k++; continue; }
        if (toks[k].toLowerCase().replace("’", "'") === needle[j]) { j++; k++; } else break;
      }
      if (j === needle.length) { for (let x = i; x < k; x++) if (isW(toks[x])) marks[x] = ci; break; }
    }
  });
  return toks.map((t, i) => {
    if (!isW(t)) return `<span class="tok pu">${esc(t)}</span>`;
    const key = norm(t);
    const keyBase = key.endsWith("s") ? key.slice(0, -1) : key;
    const ck = marks[i] >= 0 ? ` ck" data-ck="${marks[i]}` : "";
    const sv = savedSet.has(key) || savedSet.has(keyBase) || (marks[i] >= 0 && savedSet.has(norm(chunks[marks[i]].word))) ? " sv" : "";
    return `<span class="tok${ck}${sv}" data-w="${esc(key)}" data-t="${esc(t)}">${esc(t)}</span>`;
  }).join("");
}
function openReader(artId) {
  const art = ARTICLES.find((a) => a.id === artId);
  const sentences = buildSentences(art);
  state.reader = { art, sentences, si: Math.min(7, sentences.length - 1), playing: false, rate: 1, masked: false };
  renderReader();
  $("readerLayer").classList.remove("hidden");
  $("readerLayer").scrollTop = 0;
}
function closeReader() {
  state.reader.playing = false; stopSpeak();
  $("readerLayer").classList.add("hidden");
  $("readerLayer").innerHTML = "";
  renderShelf();
}
function renderReader() {
  const r = state.reader;
  const saved = savedKeys();
  let si = 0;
  const paras = r.art.paras.map((p) => {
    const sents = (p.en.match(/[^.!?]+[.!?]+["']?\s*|[^.!?]+$/g) || [p.en]).map((s) => s.trim()).filter(Boolean);
    const enHtml = sents.map((s) => {
      const cur = si === r.si ? " cur" : "";
      const html = `<span class="sent${cur}" data-si="${si}">${tokenizeSentence(s, p.chunks, saved)}</span>`;
      si++;
      return html;
    }).join(" ");
    return `<div class="para"><div class="en">${enHtml}</div><p class="zh">${esc(p.zh)}</p></div>`;
  });
  $("readerLayer").innerHTML = `
    <div class="r-top ${r.masked ? "reader-masked" : ""}">
      <button class="x" id="rBack">‹</button>
      <div class="tt"><div class="a">${esc(r.art.title)}</div><div class="b">${r.art.words} 词 · ${r.art.pct}%</div></div>
      <button class="rbtn ${r.masked ? "on" : ""}" id="rMask" title="遮罩中文">目</button>
    </div>
    <div class="minibar ${r.masked ? "reader-masked" : ""}">
      <button class="play-mini" id="rPlay">${r.playing ? "❚❚" : "▶"}</button>
      <span class="m-info">第 <b>${r.si + 1}</b> / ${r.sentences.length} 句 · 逐句朗读</span>
      <button class="mshadow" id="rShadow" title="跟读此句" aria-label="跟读此句">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3.5"/></svg>
      </button>
      <button class="rate" id="rRate">${r.rate}×</button>
    </div>
    <div class="r-body ${r.masked ? "reader-masked" : ""}">
      ${paras.join("")}
      <div class="r-foot">已收藏词会整篇高亮 · 点词查词 · 点句子朗读 · 🎤 跟读此句</div>
    </div>`;
  $("rBack").addEventListener("click", closeReader);
  $("rMask").addEventListener("click", () => { r.masked = !r.masked; renderReader(); });
  $("rPlay").addEventListener("click", () => (r.playing ? stopPlay() : startPlay(r.si)));
  $("rShadow").addEventListener("click", () => openShadow(Math.min(r.si, SHADOW_SESSION.sents.length - 1)));
  $("rRate").addEventListener("click", () => {
    r.rate = r.rate === 1 ? 1.25 : r.rate === 1.25 ? 0.85 : 1;
    if (r.playing) { stopPlay(); startPlay(r.si); } else renderReader();
  });
  $("readerLayer").querySelector(".r-body").addEventListener("click", onReaderTap);
}
function onReaderTap(e) {
  const r = state.reader;
  const tok = e.target.closest(".tok");
  if (tok && !tok.classList.contains("pu")) {
    const si = +tok.closest(".sent").dataset.si;
    if (tok.dataset.ck !== undefined) {
      const ci = +tok.dataset.ck;
      const ch2 = r.sentences[si].chunks[ci];
      openDictForChunk(ch2, tok.dataset.t, si);
    } else {
      lookupWord(tok.dataset.t, si);
    }
    return;
  }
  const zh = e.target.closest(".zh");
  if (zh && r.masked && !zh.classList.contains("revealed")) { zh.classList.add("revealed"); return; }
  const sent = e.target.closest(".sent");
  if (sent) { stopPlay(); state.reader.si = +sent.dataset.si; renderReader(); startPlay(+sent.dataset.si); }
}
function lookupWord(t, si) {
  const r = state.reader;
  si = si === undefined ? r.si : si;
  const key = norm(t);
  const keyBase = key.endsWith("s") ? key.slice(0, -1) : key;
  const saved = VOCAB.find((v) => norm(v.word) === key || norm(v.word) === keyBase);
  const sent = r.sentences[si];
  const src = `${r.art.title} · 第 ${si + 1} 句`;
  if (saved) { openDictForEntry({ ...saved, src, sentence: sent.en }); return; }
  const d = MINI_DICT[key] || MINI_DICT[keyBase];
  openDictForEntry({
    id: keyBase, kind: "word", word: t, senses: d?.senses || [{ pos: "", cn: "（原型未收录释义 · 实际实现调用 readerDict 在线词典）" }],
    trap: d?.trap, src, sentence: sent.en,
  });
}
function openDictForChunk(ch, surfaceForm, si) {
  if (!ch) return;
  const r = state.reader;
  si = si === undefined ? r.si : si;
  const saved = VOCAB.find((v) => norm(v.word) === norm(ch.word));
  const sent = r.sentences[si];
  const src = `${r.art.title} · 第 ${si + 1} 句`;
  if (saved) { openDictForEntry({ ...saved, src, sentence: sent.en }); return; }
  openDictForEntry({
    id: norm(ch.word), kind: "chunk", chunkType: ch.type, word: ch.word,
    senses: [{ pos: ch.type?.toLowerCase() || "chunk", cn: ch.gloss }],
    pattern: ch.pattern, trap: ch.trap, src, sentence: sent.en,
  });
}
/* 词典卡（阅读 tap 查词 / 分享收词共用） */
function openDictForEntry(v) {
  const isSaved = VOCAB.some((x) => norm(x.word) === norm(v.word));
  openSheet(`
    <div class="grabber"></div>
    <div class="d-head">
      <span class="w">${esc(v.word)}</span>
      ${v.chunkType ? `<span class="badge">${esc(v.chunkType)}</span>` : `<span class="badge mute">单词</span>`}
      <button class="icon-btn close" id="dSpeak">🔊</button>
    </div>
    <div class="d-senses">${v.senses.map((s) => `<div><span class="pos">${s.pos}</span>${esc(s.cn)}</div>`).join("")}</div>
    ${v.pattern ? `<div class="d-extra">槽位记法：<i>${esc(v.pattern)}</i></div>` : ""}
    ${v.trap ? `<div class="d-trap">⚠ <b>直译陷阱</b>：${esc(v.trap)}</div>` : ""}
    ${v.src ? `<div class="d-src">${v.sentence ? esc(v.sentence) : ""}<span class="from">来自 ${esc(v.src)}</span></div>` : ""}
    <div class="d-actions">
      ${isSaved
        ? `<button class="btn ghost" id="dSaved" disabled style="color:var(--ok);border-color:transparent;background:var(--ok-soft)">✓ 已在生词本</button>`
        : `<button class="btn" id="dSave">收进生词本</button>
           <button class="btn ghost" id="dSaveChunk">收为词块</button>`}
    </div>
    <div class="d-note">收藏后整篇自动高亮，SRS 到期进「今天」复习</div>`);
  $("dSpeak").addEventListener("click", () => speak(v.word, 0.9));
  const save = (kind) => {
    VOCAB.unshift({ ...v, kind, due: "now", senses: v.senses, src: v.src || `${state.reader?.art?.title || "分享"} · 收藏` });
    closeSheet();
    toast(kind === "chunk" ? `已收为词块「${v.word}」· 今晚复习` : `已收藏「${v.word}」· 今晚复习`);
    if (state.reader && !$("readerLayer").classList.contains("hidden")) renderReader();
    updateDueBadge();
    if (state.tab === "vocab") renderVocab();
  };
  $("dSave")?.addEventListener("click", () => save("word"));
  $("dSaveChunk")?.addEventListener("click", () => save("chunk"));
}

/* ---------- 逐句播放 ---------- */
function startPlay(si) {
  const r = state.reader;
  r.playing = true; r.si = si;
  stepPlay();
}
function stepPlay() {
  const r = state.reader;
  if (!r.playing) return;
  if (r.si >= r.sentences.length) { stopPlay(); return; }
  const body = $("readerLayer").querySelector(".r-body");
  if (body) {
    body.querySelectorAll(".sent.cur").forEach((s) => s.classList.remove("cur"));
    const cur = body.querySelector(`.sent[data-si="${r.si}"]`);
    if (cur) cur.scrollIntoView({ block: "center", behavior: "smooth" });
  }
  updateMinibar();
  speak(r.sentences[r.si].en, r.rate, () => {
    if (!state.reader?.playing) return;
    state.reader.si++;
    markCur();
    setTimeout(stepPlay, 300);
  });
}
function stopPlay() {
  if (state.reader) state.reader.playing = false;
  stopSpeak();
  const b = $("readerLayer")?.querySelector(".r-body");
  if (b) b.querySelectorAll(".sent.cur").forEach((s) => s.classList.remove("cur"));
  updateMinibar();
}
function markCur() {
  const r = state.reader;
  const b = $("readerLayer")?.querySelector(".r-body");
  if (!b || !r) return;
  b.querySelectorAll(".sent").forEach((s) => s.classList.toggle("cur", +s.dataset.si === r.si));
}
function updateMinibar() {
  const r = state.reader;
  const pb = $("rPlay");
  if (pb && r) pb.textContent = r.playing ? "❚❚" : "▶";
}

/* ============================================================
   底部抽屉
   ============================================================ */
function openSheet(html) { $("sheet").innerHTML = html; $("dim").classList.remove("hidden"); $("sheet").classList.remove("hidden"); }
function closeSheet() { $("sheet").classList.add("hidden"); $("dim").classList.add("hidden"); $("sheet").innerHTML = ""; }
$("dim").addEventListener("click", closeSheet);

/* ============================================================
   系统分享收词（iOS Share Extension 模拟）

const SHARED = {
  from: "微信 · 收藏",

  word: "linden",
};
function openShare() {

      <div class="share-head">

    });

}
function closeShare() { $("shareLayer").classList.add("hidden"); $("shareLayer").innerHTML = ""; }

/* ============================================================
   主题 / toast / 键盘 / 启动
   ============================================================ */
const THEMES = ["light", "dark", "sepia", "oled"];
const THEME_LABEL = { light: "浅色", dark: "深色", sepia: "护眼", oled: "纯黑" };
let themeIdx = 0;
function cycleTheme() {
  themeIdx = (themeIdx + 1) % THEMES.length;
  document.documentElement.dataset.theme = THEMES[themeIdx];
  $("themeBtn").textContent = THEME_LABEL[THEMES[themeIdx]];
  $("mTheme") && ($("mTheme").querySelector(".val").textContent = THEME_LABEL[THEMES[themeIdx]] + " ›");
}
function setTheme(t) {
  themeIdx = THEMES.indexOf(t);
  document.documentElement.dataset.theme = t;
  $("themeBtn").textContent = THEME_LABEL[t];
}
let toastTimer = null;
function toast(msg) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  $("phone").appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2200);
}
document.querySelector(".proto-banner").addEventListener("click", (e) => {
  const b = e.target.closest("[data-go]");
  if (!b) return;
  const go = b.dataset.go;
  if (go === "theme") return cycleTheme();
  if (go === "today") { state.review = null; switchTab("today"); }
  if (go === "review") { switchTab("today"); startReview(); }
  if (go === "cloze") { switchTab("today"); startReview(); while (!state.review.finished && state.review.queue[state.review.pos].mode !== "cloze") rvNext(); }
  if (go === "trap") { switchTab("today"); startReview(); const i = state.review.queue.findIndex((c) => c.blank === "took root"); state.review.pos = i; state.review.input = "take roots"; submitCloze(); }
  if (go === "dictdiff") {
    switchTab("today"); startReview();
    const i = state.review.queue.findIndex((c) => c.word === "canopy");
    state.review.pos = i; state.review.phase = "answer";
    state.review.input = "The citys tree canopy now cover fourty percent of the streets";
    submitDictation();
  }
  if (go === "speak") { switchTab("practice"); openSpeak(); }
  if (go === "speakchat") { switchTab("practice"); openSpeak("travel"); }
  if (go === "shadow") { switchTab("practice"); openShadow(0); }
  if (go === "shadowfail") { switchTab("practice"); openShadow(1); state.shadow.phase = "rec"; renderShadow(); setTimeout(() => { const sh = state.shadow; if (!sh) return; const s = SHADOW_SESSION.sents[sh.i]; sh.score = s.score; sh.passed = s.score >= SHADOW_SESSION.passLine; sh.results.push({ i: sh.i, score: s.score, passed: sh.passed }); sh.phase = "result"; renderShadow(); }, 60); }
  if (go === "caption") { switchTab("practice"); openCaption(); }
  if (go === "notify") { switchTab("today"); showNotify(); }
  if (go === "vocab") switchTab("vocab");
  if (go === "lookup") { openReader("trees"); setTimeout(() => lookupWord("lindens", 3), 60); }
  if (go === "share") openShare();
  if (go === "import") { switchTab("shelf"); setTimeout(openImport, 60); }
});
/* 桌面键 1-4 评分（真机用不到，方便电脑上走完一轮） */
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea")) return;
  if (state.review && !state.review.finished && state.review.phase === "graded" && ["1", "2", "3", "4"].includes(e.key)) {
    const grade = ["forgot", "hard", "good", "easy"][+e.key - 1];
    const c = state.review.queue[state.review.pos];
    state.review.results.push({ word: c.word, mode: c.mode, judged: state.review.judged, grade });
    rvNext();
  }
});

/* 手机壳自适应缩放 */
function fitPhone() {
  const phone = $("phone");
  if (window.innerWidth <= 520 || window.innerHeight <= 620) { phone.style.transform = ""; return; }
  const s = Math.min(1, (window.innerHeight - 92) / 866);
  phone.style.transform = `scale(${s})`;
}
window.addEventListener("resize", fitPhone);

/* ---------- 启动 ---------- */
switchTab("today");
fitPhone();

/* 演示钩子：URL hash 直达关键状态，便于截图/分享
   #demo=review    复习流第一张（识别卡）
   #demo=cloze     完形卡答题态
   #demo=trap      完形命中直译陷阱的判分反馈
   #demo=dictdiff  听写卡词级 diff
   #demo=speak     陪练场景选择（难度分段）
   #demo=speakchat 陪练对话中（AI 开场 + 按住说话）
   #demo=shadow    跟读第 1 句待录态
   #demo=shadowfail 跟读不达标：词着色 + 再试/领读/跳过
   #demo=caption   直译未开始
   #demo=captioning 直译录制中（双语字幕流）
   #demo=notify    复习提醒通知横幅
   #demo=quick     通知 → 1 卡快速复习
   #demo=lookup    阅读页点词查词典卡（lindens）
   #demo=vocab     生词本（词块分组）
   #demo=share     系统分享收词
   #demo=import    电脑导入抽屉
   #demo=imported  导入完成后的书架
   #demo=done      今日复习完成摘要
   #theme=dark|sepia|oled 指定主题 */
(function demoHook() {
  const p = new URLSearchParams(location.hash.slice(1));
  const demo = p.get("demo");
  if (p.get("theme")) setTheme(p.get("theme"));
  if (!demo) return;
  if (demo === "review") { switchTab("today"); startReview(); }
  if (demo === "cloze") { switchTab("today"); startReview(); while (!state.review.finished && state.review.queue[state.review.pos].mode !== "cloze") rvNext(); }
  if (demo === "trap") { switchTab("today"); startReview(); const i = state.review.queue.findIndex((c) => c.blank === "took root"); state.review.pos = i; state.review.input = "take roots"; submitCloze(); }
  if (demo === "dictdiff") {
    switchTab("today"); startReview();
    const i = state.review.queue.findIndex((c) => c.word === "canopy");
    state.review.pos = i; state.review.phase = "answer";
    state.review.input = "The citys tree canopy now cover fourty percent of the streets";
    submitDictation();
  }
  if (demo === "speak") { switchTab("practice"); openSpeak(); }
  if (demo === "speakchat") { switchTab("practice"); openSpeak("travel"); }
  if (demo === "shadow") { switchTab("practice"); openShadow(0); }
  if (demo === "shadowfail") {
    switchTab("practice"); openShadow(1);
    const sh = state.shadow; const s = SHADOW_SESSION.sents[sh.i];
    sh.score = s.score; sh.passed = s.score >= SHADOW_SESSION.passLine;
    sh.results.push({ i: sh.i, score: s.score, passed: sh.passed });
    sh.phase = "result"; renderShadow();
  }
  if (demo === "caption") { switchTab("practice"); openCaption(); }
  if (demo === "captioning") { switchTab("practice"); openCaption(); capStart(); }
  if (demo === "notify") { switchTab("today"); setTimeout(showNotify, 200); }
  if (demo === "quick") { switchTab("today"); openQuickReview(); }
  if (demo === "lookup") { openReader("trees"); setTimeout(() => lookupWord("lindens", 3), 60); }
  if (demo === "vocab") { switchTab("vocab"); state.vocab.kind = "chunk"; renderVocab(); }
  if (demo === "share") openShare();
  if (demo === "import") { switchTab("shelf"); setTimeout(openImport, 60); }
  if (demo === "imported") { state.imported = true; switchTab("shelf"); }
  if (demo === "done") {
    state.review = { queue: REVIEW_CARDS, pos: 8, phase: "graded", hints: 0, input: "", judged: null, replay: 0,
      finished: true,
      results: [
        { word: "took root", mode: "cloze", judged: "perfect", grade: "easy" },
        { word: "comprehension", mode: "recognition", judged: null, grade: "good" },
        { word: "in the wake of", mode: "cloze", judged: "perfect", grade: "easy" },
        { word: "canopy", mode: "dictation", judged: "close", grade: "hard" },
        { word: "buffer against", mode: "cloze", judged: "trap", grade: "forgot" },
        { word: "settle in", mode: "cloze", judged: "wrong", grade: "forgot" },
        { word: "attribute X to Y", mode: "cloze", judged: "perfect", grade: "good" },
        { word: "torrential rain", mode: "dictation", judged: "wrong", grade: "hard" },
      ] };
    switchTab("today");
  }
})();
