<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 方案三 沉浸透镜：玻璃透镜下的文字由模糊变清晰 -->
  <defs>
    <linearGradient id="fc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C5FF0"/>
      <stop offset="1" stop-color="#7A5CF0"/>
    </linearGradient>
    <radialGradient id="fc-glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fc-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.62" stop-color="#1B1464" stop-opacity="0"/>
      <stop offset="1" stop-color="#1B1464" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="fc-lens"><circle cx="296" cy="300" r="107"/></clipPath>
    <filter id="fc-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#fc-bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#fc-glow)"/>
  <rect width="512" height="512" rx="116" fill="url(#fc-shade)"/>
  <!-- 原文两行（镜外，半透明） -->
  <g fill="#FFFFFF" opacity="0.5">
    <rect x="124" y="150" width="216" height="40" rx="20"/>
    <rect x="124" y="214" width="150" height="40" rx="20"/>
  </g>
  <!-- 透镜内部：原文虚化延续 + 译文聚焦 -->
  <g clip-path="url(#fc-lens)">
    <g fill="#FFFFFF" opacity="0.4" filter="url(#fc-blur)">
      <rect x="124" y="150" width="216" height="40" rx="20"/>
      <rect x="124" y="214" width="150" height="40" rx="20"/>
    </g>
    <rect x="218" y="262" width="204" height="46" rx="23" fill="#FFFFFF"/>
    <rect x="218" y="330" width="128" height="36" rx="18" fill="#FFFFFF" opacity="0.85"/>
  </g>
  <!-- 镜体 -->
  <circle cx="296" cy="300" r="113.5" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="13"/>
  <path d="M236 240 Q270 210 316 206" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="9" stroke-linecap="round" fill="none"/>
</svg>
