  <rect width="512" height="512" rx="116" fill="url(#fa-shade)"/>
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
    <path d="M316 104 L288 136" stroke-width="44"/>
    <path d="M162 180 L350 180" stroke-width="40"/>
    <path d="M298 196 L158 402" stroke-width="46"/>
    <path d="M214 196 L354 402" stroke-width="46"/>
