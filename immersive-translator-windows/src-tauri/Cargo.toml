[package]
name = "immersive-translator-windows"
version = "0.10.1"
description = "Tauri + TypeScript 实现的 Windows 版 ImmersiveTranslator"
authors = ["yangbishang"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "immersive_translator_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "immersive-translator-windows"
# main.rs 仅是 run() 入口包装、不含任何测试（全部 91 个测试在 lib），
# 关闭其 test harness：本机企业杀软（Kaspersky/360）会把「应用全量代码 +
# harness」的 ~35MB 测试二进制定向隔离（deps 下 <hash>.exe 链接落盘即被
# 删除、同名 .pdb 幸存），cargo test 执行时报 os error 5 拒绝访问。
# test = false 后 cargo test 不再构建/执行该无测试的 harness，零测试损失；
# cargo build/check 的 bin 本体构建不受影响。
test = false

[features]
# 生产构建必须启用：generate_context! 据此嵌入 ../dist 前端资源；
# 不启用时 exe 会去连 devUrl (http://localhost:1420)，运行即"localhost 拒绝连接"。
# 正确构建命令：cargo build --release --features custom-protocol
# （`npm run tauri dev` 调试时不要启用。）
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
# 单实例：防双开导致两进程各持同一旧 refreshToken 刷新 → 服务端 token_reused
# 全设备下线（客户端-auth-integration.md §7 红线 2 的进程维度设防）。
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.5"
arboard = "3"
rfd = "0.15"
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_SystemInformation", "Win32_Graphics_Gdi"] }
windows = { version = "0.61.3", features = ["Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Variant", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Media_Speech"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
base64 = "0.22"
regex = "1"

# OCR（PaddleOCR via ONNX Runtime）。
# ort 用 download-binaries 预下载编译好的 onnxruntime，避免 bindgen/libclang 依赖。
ort = { version = "2.0.0-rc.10", default-features = false, features = ["download-binaries"] }
paddle-ocr-rs = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }

[dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_LibraryLoader", "Win32_UI_Controls"] }
